<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Football Agent Empire - Enhanced Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background: linear-gradient(to bottom right, #14532d, #166534, #047857);
            min-height: 100vh;
        }
        .modal-overlay {
            backdrop-filter: blur(4px);
        }
        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 0 20px rgba(34, 197, 94, 0.5); }
            50% { box-shadow: 0 0 40px rgba(34, 197, 94, 0.8); }
        }
        .deal-ready {
            animation: pulse-glow 2s infinite;
        }
        
        /* Login Screen Styles */
        .login-screen, .signup-screen {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(to bottom right, #14532d, #166534, #047857);
            z-index: 100;
        }
        
        .login-container, .signup-container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            padding: 2rem;
            width: 100%;
            max-width: 400px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .login-title, .signup-title {
            font-size: 2rem;
            font-weight: bold;
            text-align: center;
            margin-bottom: 0.5rem;
        }
        
        .login-subtitle, .signup-subtitle {
            text-align: center;
            color: #86efac;
            font-size: 0.875rem;
            letter-spacing: 0.1em;
            margin-bottom: 1.5rem;
        }
        
        .form-group {
            margin-bottom: 1rem;
        }
        
        .form-label {
            display: block;
            font-size: 0.75rem;
            font-weight: bold;
            letter-spacing: 0.05em;
            margin-bottom: 0.5rem;
            color: #d1fae5;
        }
        
        .form-input {
            width: 100%;
            padding: 0.75rem;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 6px;
            color: white;
            font-size: 1rem;
        }
        
        .form-input:focus {
            outline: none;
            border-color: #86efac;
        }
        
        .login-btn, .signup-btn {
            width: 100%;
            padding: 0.875rem;
            background: linear-gradient(to right, #22c55e, #16a34a);
            border: none;
            border-radius: 6px;
            color: white;
            font-weight: bold;
            font-size: 1rem;
            letter-spacing: 0.05em;
            cursor: pointer;
            margin-top: 1rem;
        }
        
        .login-btn:hover, .signup-btn:hover {
            background: linear-gradient(to right, #16a34a, #15803d);
        }
        
        .error-message, .success-message {
            display: none;
            text-align: center;
            padding: 0.5rem;
            border-radius: 6px;
            margin-top: 1rem;
            font-size: 0.875rem;
        }
        
        .error-message {
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid #ef4444;
            color: #fca5a5;
        }
        
        .success-message {
            background: rgba(34, 197, 94, 0.2);
            border: 1px solid #22c55e;
            color: #86efac;
        }
        
        .signup-link, .back-to-login {
            text-align: center;
            margin-top: 1rem;
            font-size: 0.875rem;
            color: #d1fae5;
        }
        
        .signup-link button, .back-to-login button {
            background: none;
            border: none;
            color: #86efac;
            text-decoration: underline;
            cursor: pointer;
            font-weight: bold;
        }
        
        .password-requirements {
            font-size: 0.75rem;
            color: #9ca3af;
            margin-top: 0.25rem;
        }
        
        .admin-btn {
            background: linear-gradient(to right, #dc2626, #b91c1c);
            padding: 0.5rem 1rem;
            border-radius: 6px;
            border: none;
            color: white;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.875rem;
        }
        
        .admin-btn:hover {
            background: linear-gradient(to right, #b91c1c, #991b1b);
        }
        
        .logout-btn {
            background: rgba(255, 255, 255, 0.1);
            padding: 0.5rem 1rem;
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.875rem;
        }
        
        .logout-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }
        
        .user-info-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            padding: 1rem;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body class="text-white p-4">
    <div id="app" class="max-w-7xl mx-auto"></div>

    <script>
        // User Authentication State
        let currentUser = null;
        let users = JSON.parse(localStorage.getItem('footballAgentUsers')) || {};
        let currentScreen = 'login'; // 'login', 'signup', 'game'
        
        // Game State
        let state = {
            money: 100,
            reputation: 0,
            agents: 1,
            players: [],
            upgrades: {
                scoutingNetwork: 0,
                negotiationSkills: 0,
                officeSpace: 0,
                marketingTeam: 0,
                legalTeam: 0,
                mediaConnections: 0
            },
            currentMarket: 0, // 0=Youth, 1=Domestic, 2=European, 3=World Class
            transfersCompleted: 0,
            totalCommission: 0,
            activeSponsorships: 0,
            nextTransferWindow: Date.now() + 20000,
            availableDeals: [],
            autoSignEnabled: false,
            availablePlayers: [],
            showPlayerSelection: false,
            showTransferWindow: false,
            showAdminPanel: false,
            notifications: [],
            lastExpenseTime: Date.now(),
            lastGrowthTime: Date.now()
        };

        // Constants
        const markets = [
            { name: 'Youth Academy', multiplier: 1, minRep: 0, color: 'text-gray-400' },
            { name: 'Domestic League', multiplier: 3, minRep: 500, color: 'text-green-400' },
            { name: 'European Circuit', multiplier: 8, minRep: 2000, color: 'text-blue-400' },
            { name: 'World Class', multiplier: 20, minRep: 10000, color: 'text-yellow-400' },
            { name: 'Global Superstars', multiplier: 50, minRep: 50000, color: 'text-purple-400' }
        ];

        const playerTiers = [
            { name: 'Prospect', baseValue: 1, valueRange: [1, 5], multiplier: 1, color: 'bg-gray-500', minRep: 0 },
            { name: 'Rising Star', baseValue: 5, valueRange: [5, 15], multiplier: 2, color: 'bg-green-500', minRep: 100 },
            { name: 'Professional', baseValue: 25, valueRange: [20, 40], multiplier: 5, color: 'bg-blue-500', minRep: 500 },
            { name: 'International', baseValue: 100, valueRange: [80, 150], multiplier: 10, color: 'bg-purple-500', minRep: 2000 },
            { name: 'World Class', baseValue: 500, valueRange: [400, 700], multiplier: 25, color: 'bg-yellow-500', minRep: 10000 },
            { name: 'Superstar', baseValue: 2500, valueRange: [2000, 3500], multiplier: 50, color: 'bg-red-500', minRep: 50000 }
        ];

        const firstNames = ['Tommy', 'Alex', 'Jordan', 'Sam', 'Chris', 'Taylor', 'Morgan', 'Casey', 'Riley', 'Jamie', 
            'Marco', 'Luis', 'Carlos', 'Diego', 'Andre', 'Paulo', 'Kevin', 'Michael', 'David', 'Robert',
            'Luca', 'Pierre', 'Hans', 'Giovanni', 'Pablo', 'Yuki', 'Ahmed', 'Viktor', 'Mateo', 'Lucas'];
        
        const lastNames = ['James', 'Martinez', 'Silva', 'Johnson', "O'Connor", 'Müller', 'Nakamura',
            'Santos', 'Williams', 'Garcia', 'Ibrahim', 'Chen', 'Rodriguez', 'Smith', 'Brown', 'Davis',
            'Wilson', 'Anderson', 'Taylor', 'Thomas', 'Rossi', 'Blanc', 'Schmidt', 'Petrov', 'Costa'];

        const clubs = ['Manchester FC', 'Real Madrid', 'Bayern Munich', 'Barcelona', 'PSG', 'Juventus', 
            'Liverpool', 'Chelsea', 'AC Milan', 'Inter Milan', 'Atletico', 'Dortmund'];

        const upgradeTypes = {
            scoutingNetwork: {
                name: 'Scouting Network',
                description: 'Discover talent worldwide',
                baseCost: 1000,
                effect: 'Increases reputation gain by 25% per level',
                icon: '🔍'
            },
            negotiationSkills: {
                name: 'Negotiation Skills',
                description: 'Secure better deals',
                baseCost: 2000,
                effect: 'Increases commission by 20% per level',
                icon: '💼'
            },
            officeSpace: {
                name: 'Office Expansion',
                description: 'Expand your agency capacity',
                baseCost: 5000,
                effect: '+1 agent and +2 player slots per level',
                icon: '🏢'
            },
            marketingTeam: {
                name: 'Marketing Department',
                description: 'Unlock premium markets',
                baseCost: 10000,
                effect: 'Access higher tier players',
                icon: '📈'
            },
            legalTeam: {
                name: 'Legal Department',
                description: 'Handle complex transfers',
                baseCost: 25000,
                effect: 'Earn 10% bonus on transfers',
                icon: '⚖️'
            },
            mediaConnections: {
                name: 'Media Network',
                description: 'Attract sponsorships',
                baseCost: 50000,
                effect: 'Players earn sponsorship deals',
                icon: '📺'
            }
        };

        // Helper Functions
        function getUpgradeCost(upgradeKey) {
            const base = upgradeTypes[upgradeKey].baseCost;
            const level = state.upgrades[upgradeKey];
            return Math.floor(base * Math.pow(1.5, level));
        }

        function getMaxAgents() {
            return 1 + state.upgrades.officeSpace;
        }

        function getMaxPlayers() {
            return 3 + (state.upgrades.officeSpace * 2);
        }

        function getCommissionMultiplier() {
            return (1 + (state.upgrades.negotiationSkills * 0.2)) * (1 + state.upgrades.legalTeam * 0.1);
        }

        function getReputationMultiplier() {
            return 1 + (state.upgrades.scoutingNetwork * 0.25);
        }

        function getSponsorshipChance() {
            return Math.min(0.5, state.upgrades.mediaConnections * 0.1);
        }

        function getAvailableTiers() {
            const marketingLevel = state.upgrades.marketingTeam;
            return playerTiers.filter(tier => tier.minRep <= state.reputation).slice(0, 2 + marketingLevel);
        }

        function getUnlockedMarkets() {
            return markets.filter(market => market.minRep <= state.reputation);
        }

        function formatMoney(amount) {
            if (amount >= 1000000000) return `$${(amount / 1000000000).toFixed(2)}B`;
            if (amount >= 1000000) return `$${(amount / 1000000).toFixed(2)}M`;
            if (amount >= 1000) return `$${(amount / 1000).toFixed(1)}K`;
            return `$${Math.floor(amount)}`;
        }

        function getTotalEarningsPerSecond() {
            let total = 0;
            state.players.forEach(player => {
                // Base commission
                total += player.value * player.multiplier * getCommissionMultiplier() * state.agents;
                // Sponsorship deals
                if (player.hasSponsorship) {
                    total += player.sponsorshipValue;
                }
            });
            return total;
        }

        function addNotification(message, type = 'success') {
            state.notifications.push({
                id: Date.now() + Math.random(),
                message,
                type,
                timestamp: Date.now()
            });
            // Remove after 5 seconds
            setTimeout(() => {
                state.notifications = state.notifications.filter(n => n.timestamp > Date.now() - 5000);
                render();
            }, 5000);
        }

        function generateAvailablePlayers() {
            const availableTiers = getAvailableTiers();
            if (availableTiers.length === 0) return [];

            const newPlayers = [];
            const numPlayers = 4 + Math.floor(state.upgrades.scoutingNetwork / 2);

            for (let i = 0; i < numPlayers; i++) {
                const tierWeights = availableTiers.map((_, idx) => Math.pow(2, availableTiers.length - idx - 1));
                const totalWeight = tierWeights.reduce((a, b) => a + b, 0);
                let random = Math.random() * totalWeight;
                let selectedTierIndex = 0;
                
                for (let j = 0; j < tierWeights.length; j++) {
                    random -= tierWeights[j];
                    if (random <= 0) {
                        selectedTierIndex = j;
                        break;
                    }
                }

                const tier = availableTiers[selectedTierIndex];
                const firstName = firstNames[Math.floor(Math.random() * firstNames.length)];
                const lastName = lastNames[Math.floor(Math.random() * lastNames.length)];
                
                // Generate random value within the tier's range
                const minValue = tier.valueRange[0];
                const maxValue = tier.valueRange[1];
                const playerValue = Math.floor(minValue + Math.random() * (maxValue - minValue + 1));
                
                const repRequired = tier.minRep + Math.floor(Math.random() * tier.baseValue * 5);
                // If reputation is high enough, guarantee 100% acceptance
                const acceptanceChance = state.reputation >= repRequired ? 100 : Math.min(95, Math.max(10, 100 - ((repRequired - state.reputation) / repRequired) * 100));

                newPlayers.push({
                    id: Date.now() + Math.random(),
                    name: `${firstName} ${lastName}`,
                    tier: tier.name,
                    value: playerValue,
                    multiplier: tier.multiplier,
                    color: tier.color,
                    repRequired: repRequired,
                    acceptanceChance: Math.floor(acceptanceChance),
                    demanded: state.reputation < repRequired
                });
            }

            return newPlayers.sort((a, b) => a.repRequired - b.repRequired);
        }

        function generateTransferDeals() {
            const deals = [];
            const unlockedMarkets = getUnlockedMarkets();
            const numDeals = 3 + Math.floor(state.upgrades.negotiationSkills / 2);

            state.players.forEach(player => {
                if (Math.random() < 0.3) { // 30% chance per player
                    const marketMultiplier = unlockedMarkets[Math.floor(Math.random() * unlockedMarkets.length)].multiplier;
                    const club = clubs[Math.floor(Math.random() * clubs.length)];
                    const transferFee = player.value * player.multiplier * marketMultiplier * (5 + Math.random() * 10);
                    const commission = transferFee * 0.1 * getCommissionMultiplier();

                    deals.push({
                        id: Date.now() + Math.random(),
                        player: player,
                        club: club,
                        transferFee: transferFee,
                        commission: commission,
                        type: 'transfer'
                    });
                }
            });

            // Add contract renewal opportunities
            state.players.forEach(player => {
                if (Math.random() < 0.2) { // 20% chance
                    const renewalBonus = player.value * player.multiplier * (2 + Math.random() * 3) * getCommissionMultiplier();
                    
                    deals.push({
                        id: Date.now() + Math.random(),
                        player: player,
                        club: "Current Club",
                        transferFee: renewalBonus * 5,
                        commission: renewalBonus,
                        type: 'renewal'
                    });
                }
            });

            return deals.slice(0, numDeals);
        }

        // Action Functions
        function openPlayerSelection() {
            state.availablePlayers = generateAvailablePlayers();
            state.showPlayerSelection = true;
            render();
        }

        function closePlayerSelection() {
            state.showPlayerSelection = false;
            state.availablePlayers = [];
            render();
        }

        function refreshPlayerList() {
            state.availablePlayers = generateAvailablePlayers();
            render();
        }

        function attemptSignPlayer(player) {
            if (state.players.length >= getMaxPlayers()) {
                addNotification(`❌ Player roster full! Upgrade office to sign more players`, 'error');
                return;
            }
            
            const roll = Math.random() * 100;
            
            if (roll <= player.acceptanceChance) {
                const newPlayer = {
                    id: Date.now() + Math.random(),
                    name: player.name,
                    tier: player.tier,
                    value: player.value,
                    multiplier: player.multiplier,
                    color: player.color,
                    earnings: 0,
                    hasSponsorship: false,
                    sponsorshipValue: 0,
                    lastEarning: Date.now()
                };

                state.players.push(newPlayer);
                state.reputation += Math.floor(player.value / 5 * getReputationMultiplier());
                addNotification(`✅ Signed ${player.name}!`, 'success');
                closePlayerSelection();
            } else {
                state.availablePlayers = state.availablePlayers.filter(p => p.id !== player.id);
                addNotification(`❌ ${player.name} declined`, 'error');
                render();
            }
        }

        function purchaseUpgrade(upgradeKey) {
            const cost = getUpgradeCost(upgradeKey);
            if (state.money >= cost) {
                state.money -= cost;
                state.upgrades[upgradeKey]++;
                addNotification(`📈 Upgraded ${upgradeTypes[upgradeKey].name}`, 'success');
                render();
            }
        }

        function hireAgent() {
            const cost = 10000 * Math.pow(2, state.agents - 1);
            if (state.money >= cost && state.agents < getMaxAgents()) {
                state.money -= cost;
                state.agents++;
                addNotification(`👔 Hired new agent!`, 'success');
                render();
            }
        }

        function openTransferWindow() {
            if (state.players.length === 0) {
                addNotification('❌ Sign some players first!', 'error');
                return;
            }
            state.availableDeals = generateTransferDeals();
            state.showTransferWindow = true;
            render();
        }

        function closeTransferWindow() {
            state.showTransferWindow = false;
            state.availableDeals = [];
            render();
        }

        function completeDeal(deal) {
            state.money += deal.commission;
            state.totalCommission += deal.commission;
            state.transfersCompleted++;
            state.reputation += Math.floor(deal.commission / 100);
            
            if (deal.type === 'transfer') {
                // Player stays with you as agent, they just moved clubs
                // Increase their value by 10-20% due to the transfer
                const player = state.players.find(p => p.id === deal.player.id);
                if (player) {
                    player.value = Math.floor(player.value * (1.1 + Math.random() * 0.1));
                }
                addNotification(`💰 Transfer complete! ${deal.player.name} moved to ${deal.club}. Earned ${formatMoney(deal.commission)}`, 'success');
            } else {
                addNotification(`📝 Contract renewed! Earned ${formatMoney(deal.commission)}`, 'success');
            }
            
            // Remove deal
            state.availableDeals = state.availableDeals.filter(d => d.id !== deal.id);
            
            // Schedule next window
            state.nextTransferWindow = Date.now() + 20000 + Math.random() * 10000;
            
            if (state.availableDeals.length === 0) {
                closeTransferWindow();
            } else {
                render();
            }
        }

        function toggleAutoSign() {
            state.autoSignEnabled = !state.autoSignEnabled;
            render();
        }

        function firePlayer(playerId) {
            const player = state.players.find(p => p.id === playerId);
            if (player && confirm(`Are you sure you want to fire ${player.name}? You will lose them as a client.`)) {
                state.players = state.players.filter(p => p.id !== playerId);
                if (player.hasSponsorship) {
                    state.activeSponsorships--;
                }
                addNotification(`🔥 Fired ${player.name}`, 'error');
                render();
            }
        }

        // Icons (SVG)
        const icons = {
            briefcase: '<svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>',
            dollar: '<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>',
            star: '<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>',
            users: '<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>',
            award: '<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><circle cx="12" cy="8" r="7"/><polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88"/></svg>',
            trending: '<svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>',
            handshake: '<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5M2 12l10 5 10-5"/></svg>'
        };

        // Render Function
        function render() {
            // Show login or signup screen if not logged in
            if (currentScreen === 'login') {
                renderLoginScreen();
                return;
            }
            if (currentScreen === 'signup') {
                renderSignupScreen();
                return;
            }
            
            const totalEarnings = getTotalEarningsPerSecond();
            const availableTiers = getAvailableTiers();
            const unlockedMarkets = getUnlockedMarkets();
            const timeUntilTransfer = Math.max(0, state.nextTransferWindow - Date.now());
            const transferReady = timeUntilTransfer === 0 && state.players.length > 0;

            const html = `
                <!-- User Info Bar -->
                <div class="user-info-bar">
                    <div>
                        <div class="text-sm text-green-300">👤 ${currentUser}</div>
                        ${users[currentUser].isAdmin ? '<div class="text-xs text-red-300">⚡ ADMIN</div>' : ''}
                    </div>
                    <div class="flex gap-2">
                        <button onclick="saveGame()" class="logout-btn">💾 Save</button>
                        ${users[currentUser].isAdmin ? '<button onclick="openAdminPanel()" class="admin-btn">⚙️ Admin Panel</button>' : ''}
                        <button onclick="logout()" class="logout-btn">🚪 Logout</button>
                    </div>
                </div>
            
                <!-- Header -->
                <div class="text-center mb-6">
                    <h1 class="text-4xl font-bold mb-2">
                        ⚽ Football Agent Empire
                    </h1>
                    <p class="text-green-200">Represent players. Negotiate deals. Build your empire!</p>
                    <div class="mt-2 text-lg font-bold ${unlockedMarkets[unlockedMarkets.length - 1].color}">
                        ${unlockedMarkets[unlockedMarkets.length - 1].name}
                    </div>
                </div>

                <!-- Notifications -->
                ${state.notifications.length > 0 ? `
                    <div class="fixed top-4 right-4 z-50 space-y-2 max-w-sm">
                        ${state.notifications.map(notif => `
                            <div class="bg-${notif.type === 'success' ? 'green' : 'red'}-900/90 backdrop-blur border-2 border-${notif.type === 'success' ? 'green' : 'red'}-400 rounded-lg p-3 shadow-lg animate-pulse">
                                ${notif.message}
                            </div>
                        `).join('')}
                    </div>
                ` : ''}

                <!-- Stats Bar -->
                <div class="grid grid-cols-2 md:grid-cols-5 gap-3 mb-6">
                    <div class="bg-white/10 backdrop-blur rounded-lg p-3 border-2 border-green-400">
                        <div class="flex items-center gap-2 mb-1">
                            ${icons.dollar}
                            <span class="text-xs text-green-200">Balance</span>
                        </div>
                        <div class="text-xl font-bold" id="moneyDisplay">${formatMoney(state.money)}</div>
                        <div class="text-xs text-green-300" id="earningsDisplay">${formatMoney(totalEarnings)}/sec</div>
                    </div>

                    <div class="bg-white/10 backdrop-blur rounded-lg p-3 border-2 border-blue-400">
                        <div class="flex items-center gap-2 mb-1">
                            ${icons.star}
                            <span class="text-xs text-blue-200">Reputation</span>
                        </div>
                        <div class="text-xl font-bold" id="reputationDisplay">${Math.floor(state.reputation)}</div>
                    </div>

                    <div class="bg-white/10 backdrop-blur rounded-lg p-3 border-2 border-purple-400">
                        <div class="flex items-center gap-2 mb-1">
                            ${icons.users}
                            <span class="text-xs text-purple-200">Agents</span>
                        </div>

                            </div>
                        </form>
                    </div>
                </div>
            `;
            document.getElementById('app').innerHTML = html;
        }

        // Game Loop
        function gameLoop() {
            // Don't run game loop if not logged in
            if (currentScreen !== 'game') {
                return;
            }
            
            let totalEarnings = 0;
            state.players.forEach(player => {
                // Add variation between 0.7x and 1.3x to make earnings more dynamic
                const variation = 0.7 + (Math.random() * 0.6);
                const baseEarning = player.value * player.multiplier * getCommissionMultiplier() * state.agents;
                const earning = baseEarning * variation;
                totalEarnings += earning;
                player.earnings += earning;

                // Sponsorship earnings
                if (player.hasSponsorship) {
                    const sponsorVariation = 0.8 + (Math.random() * 0.4);
                    const sponsorEarning = player.sponsorshipValue * sponsorVariation;
                    totalEarnings += sponsorEarning;
                    player.earnings += sponsorEarning;
                }

                // Chance to get sponsorship deal
                if (!player.hasSponsorship && Math.random() < getSponsorshipChance() / 100) {
                    player.hasSponsorship = true;
                    player.sponsorshipValue = player.value * player.multiplier * 2;
                    state.activeSponsorships++;
                    addNotification(`📺 ${player.name} signed sponsorship deal!`, 'success');
                }
            });

            state.money += totalEarnings;

            // Monthly expenses (every 2 minutes = 1 month, but 5 minute grace period at start)
            const timeSinceStart = Date.now() - state.lastExpenseTime;
            if (timeSinceStart > 300000) { // After 5 minute grace period
                const timeSinceLastExpense = Date.now() - (state.lastExpenseTime + 300000);
                if (timeSinceLastExpense > 120000) { // Then every 2 minutes
                    const officeExpense = state.upgrades.officeSpace * 50;
                    const agentSalaries = state.agents * 200;
                    const totalExpenses = officeExpense + agentSalaries + (state.players.length * 10);
                    
                    state.money -= totalExpenses;
                    state.lastExpenseTime = Date.now() - 300000; // Keep the grace period offset
                    
                    if (totalExpenses > 0) {
                        addNotification(`💸 Monthly expenses: -${formatMoney(totalExpenses)}`, 'error');
                    }
                }
            }

            // Player growth (every 5 minutes = season)
            if (Date.now() - state.lastGrowthTime > 300000) {
                state.players.forEach(player => {
                    // 30% chance to grow
                    if (Math.random() < 0.3) {
                        const growthAmount = Math.floor(player.value * (0.05 + Math.random() * 0.15)); // 5-20% growth
                        player.value += growthAmount;
                        addNotification(`📈 ${player.name} improved! Value +${formatMoney(growthAmount)}`, 'success');
                    }
                    // 10% chance to decline (aging/injury)
                    else if (Math.random() < 0.1) {
                        const declineAmount = Math.floor(player.value * (0.05 + Math.random() * 0.10)); // 5-15% decline
                        player.value = Math.max(1, player.value - declineAmount);
                        addNotification(`📉 ${player.name} declined. Value -${formatMoney(declineAmount)}`, 'error');
                    }
                });
                state.lastGrowthTime = Date.now();
            }

            // Auto-sign logic
            if (state.autoSignEnabled && state.players.length < getMaxPlayers() && state.money > 10000 && !state.showPlayerSelection && Math.random() < 0.05) {
                const availableTiers = getAvailableTiers();
                if (availableTiers.length > 0) {
                    const tier = availableTiers[0];
                    const firstName = firstNames[Math.floor(Math.random() * firstNames.length)];
                    const lastName = lastNames[Math.floor(Math.random() * lastNames.length)];
                    
                    // Generate random value within the tier's range
                    const minValue = tier.valueRange[0];
                    const maxValue = tier.valueRange[1];
                    const playerValue = Math.floor(minValue + Math.random() * (maxValue - minValue + 1));
                    
                    const newPlayer = {
                        id: Date.now() + Math.random(),
                        name: `${firstName} ${lastName}`,
                        tier: tier.name,
                        value: playerValue,
                        multiplier: tier.multiplier,
                        color: tier.color,
                        earnings: 0,
                        hasSponsorship: false,
                        sponsorshipValue: 0,
                        lastEarning: Date.now()
                    };

                    state.players.push(newPlayer);
                    state.reputation += Math.floor(tier.baseValue / 5 * getReputationMultiplier());
                }
            }

            // Only render if no modals are open to prevent scroll reset
            if (!state.showPlayerSelection && !state.showTransferWindow && !state.showAdminPanel) {
                render();
            } else {
                // Just update the stats displays without full re-render
                updateStatsDisplay();
            }
        }
        
        // Update just the stats without full re-render
        function updateStatsDisplay() {
            const moneyEl = document.getElementById('moneyDisplay');
            const earningsEl = document.getElementById('earningsDisplay');
            const reputationEl = document.getElementById('reputationDisplay');
            const agentsEl = document.getElementById('agentsDisplay');
            
            if (moneyEl) moneyEl.textContent = formatMoney(state.money);
            if (earningsEl) earningsEl.textContent = formatMoney(getTotalEarningsPerSecond()) + '/sec';
            if (reputationEl) reputationEl.textContent = Math.floor(state.reputation);
            if (agentsEl) agentsEl.textContent = state.agents;
        }

        // Initialize
        render();
        setInterval(gameLoop, 1000);
        
        // Authentication Functions
        function handleLogin(event) {
            event.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('errorMessage');
            
            if (users[username] && users[username].password === password) {
                currentUser = username;
                currentScreen = 'game';
                loadGame();
                errorMsg.style.display = 'none';
                render();
            } else {
                errorMsg.style.display = 'block';
            }
        }
        
        function handleSignup(event) {
            event.preventDefault();
            const username = document.getElementById('signupUsername').value;
            const password = document.getElementById('signupPassword').value;
            const passwordConfirm = document.getElementById('signupPasswordConfirm').value;
            const errorMsg = document.getElementById('signupErrorMessage');
            const successMsg = document.getElementById('signupSuccessMessage');
            
            if (users[username]) {
                errorMsg.textContent = 'Username already exists';
                errorMsg.style.display = 'block';
                return;
            }
            
            if (password !== passwordConfirm) {
                errorMsg.textContent = 'Passwords do not match';
                errorMsg.style.display = 'block';
                return;
            }
            
            users[username] = {
                password: password,
                isAdmin: Object.keys(users).length === 0, // First user is admin
                gameData: null
            };
            
            localStorage.setItem('footballAgentUsers', JSON.stringify(users));
            
            errorMsg.style.display = 'none';
            successMsg.style.display = 'block';
            
            setTimeout(() => {
                currentUser = username;
                currentScreen = 'game';
                render();
            }, 1500);
        }
        
        function showSignup() {
            currentScreen = 'signup';
            render();
        }
        
        function showLogin() {
            currentScreen = 'login';
            render();
        }
        
        function logout() {
            saveGame();
            currentUser = null;
            currentScreen = 'login';
            render();
        }
        
        function saveGame() {
            if (currentUser) {
                users[currentUser].gameData = JSON.stringify(state);
                localStorage.setItem('footballAgentUsers', JSON.stringify(users));
                addNotification('💾 Game saved!', 'success');
            }
        }
        
        function loadGame() {
            if (currentUser && users[currentUser].gameData) {
                const savedState = JSON.parse(users[currentUser].gameData);
                Object.assign(state, savedState);
            }
        }
        
        function resetGame() {
            if (confirm('Are you sure you want to reset all progress? This cannot be undone!')) {
                state = {
                    money: 100,
                    reputation: 0,
                    agents: 1,
                    players: [],
                    upgrades: {
                        scoutingNetwork: 0,
                        negotiationSkills: 0,
                        officeSpace: 0,
                        marketingTeam: 0,
                        legalTeam: 0,
                        mediaConnections: 0
                    },
                    currentMarket: 0,
                    transfersCompleted: 0,
                    totalCommission: 0,
                    activeSponsorships: 0,
                    nextTransferWindow: Date.now() + 20000,
                    availableDeals: [],
                    autoSignEnabled: false,
                    availablePlayers: [],
                    showPlayerSelection: false,
                    showTransferWindow: false,
                    showAdminPanel: false,
                    notifications: [],
                    lastExpenseTime: Date.now(),
                    lastGrowthTime: Date.now()
                };
                saveGame();
                addNotification('🔄 Game reset!', 'success');
                render();
            }
        }
        
        function openAdminPanel() {
            state.showAdminPanel = true;
            render();
        }
        
        function closeAdminPanel() {
            state.showAdminPanel = false;
            render();
        }
        
        function toggleAdmin(username) {
            if (username === currentUser && users[username].isAdmin) {
                alert('You cannot remove your own admin status!');
                return;
            }
            users[username].isAdmin = !users[username].isAdmin;
            localStorage.setItem('footballAgentUsers', JSON.stringify(users));
            render();
        }
        
        function deleteAccount(username) {
            if (username === currentUser) {
                alert('You cannot delete your own account!');
                return;
            }
            
            if (confirm(`Are you sure you want to delete ${username}'s account? This cannot be undone!`)) {
                delete users[username];
                localStorage.setItem('footballAgentUsers', JSON.stringify(users));
                addNotification(`🗑️ Deleted account: ${username}`, 'success');
                render();
            }
        }
        
        // Admin Cheat Functions
        function addAdminMoney() {
            const amount = parseInt(document.getElementById('adminMoneyInput').value) || 0;
            if (amount > 0) {
                state.money += amount;
                addNotification(`💰 Added ${formatMoney(amount)}!`, 'success');
                saveGame();
                updateStatsDisplay();
            }
        }
        
        function addAdminReputation() {
            const amount = parseInt(document.getElementById('adminRepInput').value) || 0;
            if (amount > 0) {
                state.reputation += amount;
                addNotification(`⭐ Added ${amount} reputation!`, 'success');
                saveGame();
                updateStatsDisplay();
            }
        }
    </script>
</body>
</html>
