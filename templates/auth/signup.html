{% extends 'base.html' %}
{% block title %}Sign Up - Football Agent Empire{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card animate-scale-in">
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-emerald-500/10 border border-emerald-500/20 mb-4">
                <span class="text-3xl">&#9917;</span>
            </div>
            <h1 class="font-display text-xl font-bold tracking-wider text-white mb-1">CREATE ACCOUNT</h1>
            <p class="font-display text-xs tracking-[0.3em] text-emerald-400">JOIN THE NETWORK</p>
        </div>

        <form id="signupForm" onsubmit="doSignup(event)">
            <div class="mb-4">
                <label class="block text-xs font-semibold tracking-wider text-slate-400 mb-2 uppercase">Username</label>
                <input type="text" id="su" class="form-input-game" placeholder="Choose a username" required minlength="3" maxlength="20" autocomplete="username">
                <p class="text-xs text-slate-500 mt-1">3-20 alphanumeric characters</p>
            </div>
            <div class="mb-4">
                <label class="block text-xs font-semibold tracking-wider text-slate-400 mb-2 uppercase">Password</label>
                <input type="password" id="sp" class="form-input-game" placeholder="Create a password" required minlength="6" autocomplete="new-password">
                <p class="text-xs text-slate-500 mt-1">Minimum 6 characters</p>
            </div>
            <div class="mb-6">
                <label class="block text-xs font-semibold tracking-wider text-slate-400 mb-2 uppercase">Confirm Password</label>
                <input type="password" id="spc" class="form-input-game" placeholder="Confirm password" required autocomplete="new-password">
            </div>
            <button type="submit" id="signupBtn" class="btn-game btn-primary-game w-full py-3 text-base">
                Create Account
            </button>
            <div id="signupErr" class="hidden mt-4 text-center text-sm p-3 rounded-lg bg-red-500/10 border border-red-500/20 text-red-300"></div>
            <div id="signupOk" class="hidden mt-4 text-center text-sm p-3 rounded-lg bg-emerald-500/10 border border-emerald-500/20 text-emerald-300"></div>
            <div class="text-center mt-6 text-sm text-slate-400">
                Already have an account?
                <a href="/login" class="text-emerald-400 hover:text-emerald-300 font-semibold transition-colors">Sign in</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
let csrfToken = '';
async function api(path, opts = {}) {
    const method = opts.method || 'GET';
    const headers = { 'Content-Type': 'application/json' };
    if (method !== 'GET') headers['X-CSRF-Token'] = csrfToken;
    const body = opts.body ? JSON.stringify(opts.body) : undefined;
    const res = await fetch(path, { method, headers, body, credentials: 'same-origin' });
    const json = await res.json();
    if (json.csrf_token) csrfToken = json.csrf_token;
    return { status: res.status, data: json };
}

async function doSignup(e) {
    e.preventDefault();
    const pw = document.getElementById('sp').value;
    const pwc = document.getElementById('spc').value;
    const errEl = document.getElementById('signupErr');
    const okEl = document.getElementById('signupOk');

    if (pw !== pwc) {
        errEl.textContent = 'Passwords do not match';
        errEl.classList.remove('hidden');
        return;
    }

    const btn = document.getElementById('signupBtn');
    btn.disabled = true;
    btn.textContent = 'Creating account...';
    errEl.classList.add('hidden');

    const { data } = await api('/api/register', {
        method: 'POST',
        body: {
            username: document.getElementById('su').value,
            password: pw
        }
    });

    if (data.ok) {
        okEl.textContent = 'Account created! Redirecting...';
        okEl.classList.remove('hidden');
        errEl.classList.add('hidden');
        setTimeout(() => { window.location.href = '/'; }, 500);
    } else {
        errEl.textContent = data.error || 'Signup failed';
        errEl.classList.remove('hidden');
        btn.disabled = false;
        btn.textContent = 'Create Account';
    }
}

(async () => {
    const { data } = await api('/api/me');
    if (data.username) window.location.href = '/';
    if (data.csrf_token) csrfToken = data.csrf_token;
})();
</script>
{% endblock %}
