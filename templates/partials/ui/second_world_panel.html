<!-- Second World Panel: Agency II management tab -->
<script>
function renderSecondWorldPage() {
    const sw = S.secondWorldAgency || {};
    const upgKeys = ['scoutingNetwork','negotiationSkills','officeSpace','marketingTeam','legalTeam','mediaConnections','autoSign'];
    const sw2MaxPlayers = 3 + ((sw.upgrades || {}).officeSpace || 0) * 2;
    const sw2Eps = (sw.players || []).reduce((s, p) => s + p.value * p.multiplier * (1 + ((sw.upgrades||{}).negotiationSkills||0)*0.15) * (1 + ((sw.upgrades||{}).legalTeam||0)*0.08) * (sw.agents||1) * 0.4, 0);
    const upgLabels = {
        scoutingNetwork: 'Scouting',
        negotiationSkills: 'Negotiation',
        officeSpace: 'Office',
        marketingTeam: 'Marketing',
        legalTeam: 'Legal',
        mediaConnections: 'Media',
        autoSign: 'Auto-Scout',
    };
    const upgs = sw.upgrades || {};
    const players = sw.players || [];
    const totalUpgLevels = upgKeys.reduce((s, k) => s + (upgs[k] || 0), 0);

    return `
    <div class="max-w-6xl mx-auto animate-float-in">
        <!-- Header -->
        <div class="mb-6 flex items-center gap-4">
            <div class="flex items-center justify-center w-12 h-12 rounded-2xl bg-gradient-to-br from-purple-600/20 to-violet-600/20 border border-purple-500/30">
                <svg class="w-6 h-6 text-purple-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3.055 11H5a2 2 0 012 2v1a2 2 0 002 2 2 2 0 012 2v2.945M8 3.935V5.5A2.5 2.5 0 0010.5 8h.5a2 2 0 012 2 2 2 0 104 0 2 2 0 012-2h1.064M15 20.488V18a2 2 0 012-2h3.064M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
            </div>
            <div>
                <h2 class="font-display text-lg font-bold tracking-wide text-white flex items-center gap-2">
                    ${esc(sw.name || 'Agency II')}
                    <span class="text-[10px] px-2 py-0.5 rounded-full bg-purple-500/20 text-purple-400 border border-purple-500/30 font-normal">SECOND WORLD</span>
                </h2>
                <p class="text-xs text-slate-500">${sw.country ? 'Based in ' + esc(sw.country.charAt(0).toUpperCase() + sw.country.slice(1)) : 'Your second agency empire'}</p>
            </div>
            <button id="sw2-rename-btn" onclick="openRenameAgencyModal()" class="ml-auto btn-game btn-secondary-game py-1.5 px-3 text-xs flex items-center gap-1.5">
                <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"/></svg>
                Rename
            </button>
        </div>

        <div class="grid md:grid-cols-12 gap-4">

            <!-- Left: Stats + Upgrades -->
            <div class="md:col-span-5 space-y-4">

                <!-- Agency Stats -->
                <div class="game-panel">
                    <div class="game-panel-header">
                        <div class="flex items-center justify-center w-8 h-8 rounded-lg bg-purple-500/10">
                            <svg class="w-4 h-4 text-purple-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg>
                        </div>
                        <h3 class="font-semibold text-sm">Agency II Stats</h3>
                    </div>
                    <div class="game-panel-body grid grid-cols-2 gap-3" id="sw2-stats">
                        <div class="p-3 rounded-xl bg-emerald-500/5 border border-emerald-500/20 text-center">
                            <div class="text-[10px] text-slate-500 uppercase tracking-wider mb-1">Balance</div>
                            <div class="text-lg font-bold text-emerald-400">${fmt(sw.money || 0)}</div>
                        </div>
                        <div class="p-3 rounded-xl bg-amber-500/5 border border-amber-500/20 text-center">
                            <div class="text-[10px] text-slate-500 uppercase tracking-wider mb-1">Reputation</div>
                            <div class="text-lg font-bold text-amber-400">${(sw.reputation || 0).toLocaleString()}</div>
                        </div>
                        <div class="p-3 rounded-xl bg-blue-500/5 border border-blue-500/20 text-center">
                            <div class="text-[10px] text-slate-500 uppercase tracking-wider mb-1">Agents</div>
                            <div class="text-lg font-bold text-blue-400">${sw.agents || 1}</div>
                        </div>
                        <div class="p-3 rounded-xl bg-purple-500/5 border border-purple-500/20 text-center">
                            <div class="text-[10px] text-slate-500 uppercase tracking-wider mb-1">Transfers</div>
                            <div class="text-lg font-bold text-purple-400">${sw.transfersCompleted || 0}</div>
                        </div>
                        <div class="p-3 rounded-xl bg-cyan-500/5 border border-cyan-500/20 text-center col-span-2">
                            <div class="text-[10px] text-slate-500 uppercase tracking-wider mb-1">Earning/s</div>
                            <div class="text-lg font-bold text-cyan-400">${fmt(sw2Eps)}/s</div>
                        </div>
                    </div>
                </div>

                <!-- Upgrades -->
                <div class="game-panel">
                    <div class="game-panel-header">
                        <div class="flex items-center justify-center w-8 h-8 rounded-lg bg-amber-500/10">
                            <svg class="w-4 h-4 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>
                        </div>
                        <h3 class="font-semibold text-sm">Upgrades</h3>
                        <span class="ml-auto text-[10px] text-slate-500">Total levels: ${totalUpgLevels}</span>
                    </div>
                    <div class="game-panel-body space-y-2" id="sw2-upgrades">
                        ${upgKeys.map(k => {
                            const lv = upgs[k] || 0;
                            const baseCosts = {scoutingNetwork:2500,negotiationSkills:5000,officeSpace:15000,marketingTeam:25000,legalTeam:50000,mediaConnections:100000,autoSign:250000};
                            const cost = Math.floor((baseCosts[k]||2500) * Math.pow(1.8, lv));
                            const canAfford = (sw.money || 0) >= cost;
                            return `
                            <div class="flex items-center gap-2 p-2.5 rounded-lg bg-white/[0.02] border border-white/[0.04] hover:bg-white/[0.04] transition-game">
                                <div class="w-2 h-2 rounded-full flex-shrink-0 ${lv > 0 ? 'bg-purple-400' : 'bg-slate-600'}"></div>
                                <span class="text-[11px] text-white flex-1">${upgLabels[k]} <span class="text-slate-500">Lv.${lv}</span></span>
                                <button onclick="doSW2Upgrade('${k}')" ${!canAfford ? 'disabled' : ''} class="text-[10px] px-2 py-1 rounded-md ${canAfford ? 'bg-purple-500/20 border border-purple-500/30 text-purple-300 hover:bg-purple-500/30 cursor-pointer' : 'bg-white/[0.03] border border-white/[0.06] text-slate-600 cursor-not-allowed'} transition-game">
                                    ${fmt(cost)}
                                </button>
                            </div>`;
                        }).join('')}
                    </div>
                </div>

            </div>

            <!-- Right: Players + Info -->
            <div class="md:col-span-7 space-y-4">

                <!-- Players -->
                <div class="game-panel">
                    <div class="game-panel-header">
                        <div class="flex items-center justify-center w-8 h-8 rounded-lg bg-cyan-500/10">
                            <svg class="w-4 h-4 text-cyan-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                        </div>
                        <h3 class="font-semibold text-sm">Agency II Players (${players.length}/${sw2MaxPlayers})</h3>
                        <button onclick="doSW2Scout()" class="ml-auto btn-game py-1.5 px-3 text-xs flex items-center gap-1.5" style="background:rgba(124,58,237,0.15);border:1px solid rgba(168,85,247,0.3);color:#c084fc;border-radius:10px;font-weight:600;">
                            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
                            Scout
                        </button>
                    </div>
                    <div class="game-panel-body" id="sw2-players">
                        ${players.length === 0 ? `
                            <div class="text-center py-8">
                                <div class="w-14 h-14 mx-auto rounded-full bg-white/[0.03] border border-white/[0.06] flex items-center justify-center mb-3">
                                    <svg class="w-7 h-7 text-slate-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                                </div>
                                <div class="text-sm text-slate-500 mb-1">No players yet</div>
                                <div class="text-xs text-slate-600 mb-3">Agency II is ready to grow — scout players below!</div>
                                <button onclick="doSW2Scout()" class="btn-game py-2 px-4 text-xs" style="background:rgba(124,58,237,0.2);border:1px solid rgba(168,85,247,0.3);color:#c084fc;border-radius:10px;font-weight:600;">Scout Players</button>
                            </div>
                        ` : `
                            <div class="space-y-2">
                                ${players.map(p => {
                                    const stats = p.stats || {};
                                    const posColor = positionColors[p.position] || 'bg-slate-500';
                                    return `
                                    <div class="p-3 rounded-xl bg-white/[0.02] border border-white/[0.04] flex items-center gap-3">
                                        <div class="w-9 h-9 rounded-lg ${posColor} flex items-center justify-center text-[10px] font-bold text-white flex-shrink-0">${esc(p.position)}</div>
                                        <div class="flex-1 min-w-0">
                                            <div class="text-sm font-semibold text-white truncate">${esc(p.name)}</div>
                                            <div class="text-[10px] text-slate-500">${esc(p.tier)} | Age ${p.age} | ${stats.overall || '?'} OVR</div>
                                        </div>
                                        <div class="text-right flex-shrink-0">
                                            <div class="text-xs font-bold text-emerald-400">${fmt(p.value || 0)}</div>
                                            <div class="text-[9px] text-slate-600">value</div>
                                        </div>
                                    </div>`;
                                }).join('')}
                            </div>
                        `}
                    </div>
                </div>

                <!-- Coming Soon / Info -->
                <div class="game-panel">
                    <div class="game-panel-header">
                        <div class="flex items-center justify-center w-8 h-8 rounded-lg bg-violet-500/10">
                            <svg class="w-4 h-4 text-violet-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                        </div>
                        <h3 class="font-semibold text-sm">What is the Second World?</h3>
                    </div>
                    <div class="game-panel-body space-y-3">
                        ${[
                            { icon: '&#9917;', label: 'Independent Agency', desc: 'Agency II operates separately with its own balance, players, and reputation.' },
                            { icon: '&#127775;', label: 'Elite Milestone', desc: 'Only agents with $1 Billion can unlock a second empire. You\'ve earned it.' },
                            { icon: '&#128640;', label: 'Expand Your Empire', desc: 'Build upgrades, sign players, and compete from a second powerhouse.' },
                        ].map(item => `
                            <div class="flex items-start gap-3 p-3 rounded-xl bg-white/[0.02] border border-white/[0.04]">
                                <div class="text-xl flex-shrink-0">${item.icon}</div>
                                <div>
                                    <div class="text-xs font-semibold text-white mb-0.5">${item.label}</div>
                                    <div class="text-[11px] text-slate-500">${item.desc}</div>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>

            </div>
        </div>
    </div>`;
}

/* Rename Agency II */
function openRenameAgencyModal() {
    const current = (S.secondWorldAgency || {}).name || 'Agency II';
    showModal('Rename Agency II', `
        <div class="space-y-4">
            <div>
                <label class="text-xs text-slate-400 mb-1 block">New Agency Name</label>
                <input id="agency2-name" type="text" maxlength="40" value="${esc(current)}"
                    class="form-input-game w-full text-sm py-2" />
            </div>
            <button onclick="doRenameAgency()" class="btn-game btn-primary-game w-full py-2.5 text-sm">Save Name</button>
        </div>
    `, { maxWidth: 'max-w-sm' });
}

async function doRenameAgency() {
    const input = document.getElementById('agency2-name');
    if (!input) return;
    const name = input.value.trim();
    if (!name) { showToast('Name cannot be empty', 'error'); return; }
    const { data } = await api('/api/rename-second-world', { method: 'POST', body: { name } });
    if (data.error) { showToast(data.error, 'error'); return; }
    if (data.state) { S = data.state; }
    removeModal();
    showToast('Agency renamed!', 'success');
    renderFull();
}
</script>
