<!-- Player Trade Market + Card Collection -->
<script>
let marketTab = 'browse';
let tradeListings = null;
let myListings = null;

function switchMarketTab(tab) {
    marketTab = tab;
    if (tab === 'browse' && !tradeListings) loadTradeListings();
    if (tab === 'my_listings' && !myListings) loadMyListings();
    renderFull();
}

function renderMarketPage() {
    return `
    <div class="max-w-6xl mx-auto animate-float-in">
        <div class="mb-6">
            <h2 class="font-display text-lg font-bold tracking-wide text-white mb-1">Player Market</h2>
            <p class="text-xs text-slate-500">Trade players with other agents and collect cards</p>
        </div>

        <!-- Sub-Tabs -->
        <div class="flex gap-1 mb-6 p-1 rounded-xl bg-white/[0.03] border border-white/[0.06] w-fit">
            ${[
                {id:'browse', label:'Browse Market', icon:'M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 100 4 2 2 0 000-4z'},
                {id:'sell', label:'Sell Player', icon:'M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z'},
                {id:'my_listings', label:'My Listings', icon:'M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2'},
                {id:'cards', label:'Card Collection', icon:'M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10'},
            ].map(t => `
                <button onclick="switchMarketTab('${t.id}')"
                    class="flex items-center gap-1.5 px-3 py-2 rounded-lg text-xs font-medium transition-all ${marketTab === t.id ? 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30' : 'text-slate-400 hover:text-white hover:bg-white/[0.05]'}">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="${t.icon}"/></svg>
                    ${t.label}
                </button>
            `).join('')}
        </div>

        ${marketTab === 'browse' ? renderBrowseMarket() : ''}
        ${marketTab === 'sell' ? renderSellPlayer() : ''}
        ${marketTab === 'my_listings' ? renderMyListings() : ''}
        ${marketTab === 'cards' ? renderCardCollection() : ''}
    </div>`;
}

/* =========== BROWSE MARKET =========== */
function renderBrowseMarket() {
    if (!tradeListings) {
        loadTradeListings();
        return `<div class="game-panel"><div class="game-panel-body text-center py-8"><div class="text-sm text-slate-400">Loading market...</div></div></div>`;
    }

    return `
    <div class="game-panel">
        <div class="game-panel-header">
            <div class="flex items-center justify-center w-8 h-8 rounded-lg bg-emerald-500/10">
                <svg class="w-4 h-4 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 100 4 2 2 0 000-4z"/></svg>
            </div>
            <h3 class="font-semibold text-sm">Player Market (${tradeListings.length} listings)</h3>
            <button onclick="tradeListings=null;loadTradeListings()" class="ml-auto btn-game btn-secondary-game py-1 px-2 text-[10px]">Refresh</button>
        </div>
        <div class="game-panel-body">
            ${tradeListings.length === 0 ? `
                <div class="text-center py-8">
                    <div class="w-16 h-16 mx-auto rounded-full bg-white/[0.03] border border-white/[0.06] flex items-center justify-center mb-4">
                        <svg class="w-8 h-8 text-slate-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17"/></svg>
                    </div>
                    <div class="text-sm text-slate-500 mb-1">No players listed yet</div>
                    <div class="text-xs text-slate-600 mb-4">Be the first to sell a player!</div>
                    ${!S.starterPlayerBought ? `
                    <div class="p-4 rounded-xl bg-emerald-500/5 border border-emerald-500/20 max-w-sm mx-auto">
                        <div class="text-sm font-semibold text-emerald-400 mb-1">Buy a Starter Player</div>
                        <div class="text-xs text-slate-400 mb-3">Get a random Prospect player for just $100 to kickstart your agency! (One-time only)</div>
                        <button onclick="doBuyStarter()" class="btn-game btn-primary-game w-full py-2 text-xs">Buy Starter Player - $100</button>
                    </div>
                    ` : `
                    <div class="p-4 rounded-xl bg-white/[0.03] border border-white/[0.06] max-w-sm mx-auto">
                        <div class="text-xs text-slate-500 text-center">Starter player already purchased</div>
                    </div>
                    `}
                </div>
            ` : `
                <div class="grid md:grid-cols-2 gap-3">
                    ${tradeListings.map(l => {
                        const p = l.player;
                        const stats = p.stats || {};
                        const flag = nationalityFlags[p.nationality] || '&#127760;';
                        const posColor = positionColors[p.position] || 'bg-slate-500';
                        const isMine = l.sellerName === currentUser;
                        return `
                        <div class="p-4 rounded-xl bg-white/[0.03] border border-white/[0.06] hover:bg-white/[0.05] transition-game">
                            <div class="flex items-center justify-between mb-3">
                                <div class="flex items-center gap-2">
                                    <div class="w-9 h-9 rounded-lg ${posColor} flex items-center justify-center text-[10px] font-bold text-white">${esc(p.position)}</div>
                                    <div>
                                        <div class="text-sm font-semibold text-white flex items-center gap-1">${esc(p.name)} <span class="text-xs">${flag}</span></div>
                                        <div class="text-[10px] text-slate-500">${esc(p.tier)} | Age ${p.age} | ${stats.overall||'?'} OVR</div>
                                    </div>
                                </div>
                                <div class="text-right">
                                    <div class="text-lg font-bold text-emerald-400">${fmt(l.price)}</div>
                                    <div class="text-[9px] text-slate-500">by ${esc(l.sellerName)}</div>
                                </div>
                            </div>
                            <!-- Stats -->
                            <div class="grid grid-cols-6 gap-1 mb-3 p-2 rounded-lg bg-white/[0.02]">
                                ${['pace','shooting','passing','dribbling','defending','physical'].map(sn => {
                                    const v = stats[sn]||0;
                                    const color = v >= 80 ? 'text-emerald-400' : v >= 60 ? 'text-blue-400' : v >= 40 ? 'text-amber-400' : 'text-red-400';
                                    return `<div class="text-center">
                                        <div class="text-[8px] text-slate-600 uppercase">${sn.slice(0,3)}</div>
                                        <div class="text-xs font-bold ${color}">${v}</div>
                                    </div>`;
                                }).join('')}
                            </div>
                            ${p.hasSponsorship ? '<div class="text-[10px] text-yellow-400 mb-2">Has active sponsorship</div>' : ''}
                            ${l.listingType === 'auction' ? `
                                <div class="mb-2 p-2 rounded-lg bg-purple-500/5 border border-purple-500/20">
                                    <div class="flex justify-between items-center text-xs mb-1">
                                        <span class="text-purple-400 font-semibold">&#128296; AUCTION</span>
                                        <span class="text-slate-400">${l.bidCount || 0} bid(s)</span>
                                    </div>
                                    <div class="flex justify-between items-center text-xs">
                                        <span class="text-slate-400">Current top bid:</span>
                                        <span class="text-emerald-400 font-bold">${l.topBid ? fmt(l.topBid) : `Min ${fmt(l.startingBid || l.price)}`}</span>
                                    </div>
                                    ${l.expiresAt ? `<div class="text-[10px] text-slate-500 mt-1">Ends: ${new Date(l.expiresAt * 1000).toLocaleString()}</div>` : ''}
                                    ${l.myBid ? `<div class="text-[10px] text-blue-400 mt-1">Your bid: ${fmt(l.myBid)}</div>` : ''}
                                </div>
                                ${isMine ? `
                                    <button disabled class="btn-game btn-secondary-game w-full py-2 text-xs opacity-50">Your Auction</button>
                                ` : `
                                    <button onclick="openBidModal(${l.listingId}, '${esc(p.name)}', ${l.topBid || l.startingBid || l.price})" class="btn-game py-2 text-xs w-full" style="background:rgba(168,85,247,0.15);border:1px solid rgba(168,85,247,0.3);color:#a855f7;">
                                        Place Bid
                                    </button>
                                `}
                            ` : `
                                ${isMine ? `
                                    <div class="flex gap-2">
                                        <button onclick="viewOffers(${l.listingId})" class="btn-game btn-secondary-game flex-1 py-2 text-xs">View Offers</button>
                                        <button disabled class="btn-game btn-secondary-game py-2 text-xs opacity-50">Your Listing</button>
                                    </div>
                                ` : `
                                    <div class="flex gap-2">
                                        <button onclick="doBuyPlayer(${l.listingId})" class="btn-game btn-primary-game flex-1 py-2 text-xs">
                                            Buy ${fmt(l.price)}
                                        </button>
                                        <button onclick="openOfferModal(${l.listingId}, '${esc(p.name)}', ${l.price})" class="btn-game btn-gold-game py-2 px-3 text-xs">
                                            Offer
                                        </button>
                                    </div>
                                `}
                            `}
                        </div>`;
                    }).join('')}
                </div>
            `}
        </div>
    </div>`;
}

/* =========== SELL PLAYER =========== */
function renderSellPlayer() {
    const players = S.players || [];

    return `
    <div class="game-panel">
        <div class="game-panel-header">
            <div class="flex items-center justify-center w-8 h-8 rounded-lg bg-amber-500/10">
                <svg class="w-4 h-4 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
            </div>
            <h3 class="font-semibold text-sm">List a Player for Sale</h3>
        </div>
        <div class="game-panel-body">
            ${players.length === 0 ? `
                <div class="text-center py-8 text-sm text-slate-500">No players to sell</div>
            ` : `
                <div class="space-y-2">
                    ${players.map(p => {
                        const flag = nationalityFlags[p.nationality] || '&#127760;';
                        const posColor = positionColors[p.position] || 'bg-slate-500';
                        const stats = p.stats || {};
                        const suggestedPrice = p.value * p.multiplier * 100;
                        return `
                        <div class="p-3 rounded-xl bg-white/[0.02] border border-white/[0.06]">
                            <div class="flex items-center justify-between">
                                <div class="flex items-center gap-2">
                                    <div class="w-8 h-8 rounded-lg ${posColor} flex items-center justify-center text-[10px] font-bold text-white">${esc(p.position)}</div>
                                    <div>
                                        <div class="text-sm font-semibold text-white flex items-center gap-1">${esc(p.name)} <span class="text-xs">${flag}</span></div>
                                        <div class="text-[10px] text-slate-500">${esc(p.tier)} | ${stats.overall||'?'} OVR | Val: ${p.value}x${p.multiplier}</div>
                                    </div>
                                </div>
                                <button onclick="openSellModal('${p.id}', '${esc(p.name)}', ${suggestedPrice})" class="btn-game btn-gold-game py-1.5 px-3 text-xs">
                                    Sell
                                </button>
                            </div>
                        </div>`;
                    }).join('')}
                </div>
            `}
        </div>
    </div>`;
}

function openSellModal(playerId, playerName, suggestedPrice) {
    showModal('List ' + playerName, `
        <div class="space-y-4">
            <!-- Listing Type -->
            <div>
                <label class="text-xs text-slate-400 mb-2 block">Listing Type</label>
                <div class="flex gap-2">
                    <button onclick="setSellType('fixed')" id="sell-type-fixed" class="btn-game btn-primary-game flex-1 py-2 text-xs">Fixed Price</button>
                    <button onclick="setSellType('auction')" id="sell-type-auction" class="btn-game btn-secondary-game flex-1 py-2 text-xs">Auction</button>
                </div>
            </div>
            <!-- Price -->
            <div>
                <label class="text-xs text-slate-400 mb-1 block" id="price-label">Set your asking price</label>
                <input id="sell-price" type="number" min="100" value="${Math.floor(suggestedPrice)}"
                    class="form-input-game w-full text-sm py-2" />
            </div>
            <div class="flex gap-1 flex-wrap">
                ${[suggestedPrice * 0.5, suggestedPrice, suggestedPrice * 2, suggestedPrice * 5].map(v => `
                    <button onclick="document.getElementById('sell-price').value=${Math.floor(v)}" class="btn-game btn-secondary-game py-1 px-2 text-[10px]">${fmt(v)}</button>
                `).join('')}
            </div>
            <!-- Auction duration (hidden by default) -->
            <div id="auction-options" style="display:none;">
                <label class="text-xs text-slate-400 mb-1 block">Auction Duration</label>
                <select id="auction-duration" class="form-input-game w-full text-sm py-2">
                    <option value="1">1 hour</option>
                    <option value="6">6 hours</option>
                    <option value="24" selected>24 hours</option>
                    <option value="48">48 hours</option>
                    <option value="72">3 days</option>
                </select>
            </div>
            <p id="sell-desc" class="text-xs text-slate-500">Player is listed at a fixed price. You get paid when someone buys or accepts your price.</p>
            <button onclick="doListPlayer('${playerId}')" class="btn-game btn-primary-game w-full py-2.5 text-sm">List for Sale</button>
        </div>
    `, { maxWidth: 'max-w-sm' });

    window._sellType = 'fixed';
    window.setSellType = function(type) {
        window._sellType = type;
        document.getElementById('sell-type-fixed').className = `btn-game ${type==='fixed'?'btn-primary-game':'btn-secondary-game'} flex-1 py-2 text-xs`;
        document.getElementById('sell-type-auction').className = `btn-game ${type==='auction'?'btn-primary-game':'btn-secondary-game'} flex-1 py-2 text-xs`;
        document.getElementById('auction-options').style.display = type==='auction' ? 'block' : 'none';
        document.getElementById('price-label').textContent = type==='auction' ? 'Starting bid price' : 'Set your asking price';
        document.getElementById('sell-desc').textContent = type==='auction'
            ? 'Auction: other players bid. When time expires, the highest bidder wins. If no one bids, player returns to you.'
            : 'Fixed price: player is removed from your roster and listed. You get paid when someone buys.';
    };
}

/* =========== MY LISTINGS =========== */
function renderMyListings() {
    if (!myListings) {
        loadMyListings();
        return `<div class="game-panel"><div class="game-panel-body text-center py-8"><div class="text-sm text-slate-400">Loading...</div></div></div>`;
    }

    return `
    <div class="game-panel">
        <div class="game-panel-header">
            <div class="flex items-center justify-center w-8 h-8 rounded-lg bg-blue-500/10">
                <svg class="w-4 h-4 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>
            </div>
            <h3 class="font-semibold text-sm">My Active Listings (${myListings.length})</h3>
            <button onclick="myListings=null;loadMyListings()" class="ml-auto btn-game btn-secondary-game py-1 px-2 text-[10px]">Refresh</button>
        </div>
        <div class="game-panel-body">
            ${myListings.length === 0 ? `
                <div class="text-center py-8 text-sm text-slate-500">You have no active listings</div>
            ` : `
                <div class="space-y-2">
                    ${myListings.map(l => {
                        const p = l.player;
                        const stats = p.stats || {};
                        return `
                        <div class="p-3 rounded-xl bg-white/[0.02] border border-white/[0.06] flex items-center justify-between">
                            <div>
                                <div class="text-sm font-semibold text-white">${esc(p.name)}</div>
                                <div class="text-[10px] text-slate-500">${esc(p.tier)} | ${esc(p.position)} | ${stats.overall||'?'} OVR</div>
                            </div>
                            <div class="flex items-center gap-3">
                                <div class="text-right">
                                    <div class="text-sm font-bold text-emerald-400">${fmt(l.price)}</div>
                                    <div class="text-[9px] text-slate-500">${timeSince(l.listedAt)}</div>
                                </div>
                                <button onclick="viewOffers(${l.listingId})" class="btn-game btn-gold-game py-1.5 px-3 text-xs">Offers</button>
                                <button onclick="doCancelListing(${l.listingId})" class="btn-game bg-red-500/10 text-red-400 border border-red-500/20 hover:bg-red-500/20 py-1.5 px-3 text-xs">Cancel</button>
                            </div>
                        </div>`;
                    }).join('')}
                </div>
            `}
        </div>
    </div>`;
}

/* =========== CARD COLLECTION =========== */
function renderCardCollection() {
    const albums = S.cardAlbums || {};
    const completed = S.cardCollection || {};
    const albumKeys = Object.keys(albums);
    const completedCount = albumKeys.filter(k => completed[k]).length;

    const iconMap = {
        star: 'M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.784-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z',
        trophy: 'M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z',
        users: 'M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z',
        globe: 'M3.055 11H5a2 2 0 012 2v1a2 2 0 002 2 2 2 0 012 2v2.945M8 3.935V5.5A2.5 2.5 0 0010.5 8h.5a2 2 0 012 2 2 2 0 104 0 2 2 0 012-2h1.064M15 20.488V18a2 2 0 012-2h3.064M21 12a9 9 0 11-18 0 9 9 0 0118 0z',
        grid: 'M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z',
        exchange: 'M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4',
        dollar: 'M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z',
        medal: 'M9 12l2 2 4-4M7.835 4.697a3.42 3.42 0 001.946-.806 3.42 3.42 0 014.438 0 3.42 3.42 0 001.946.806 3.42 3.42 0 013.138 3.138 3.42 3.42 0 00.806 1.946 3.42 3.42 0 010 4.438 3.42 3.42 0 00-.806 1.946 3.42 3.42 0 01-3.138 3.138 3.42 3.42 0 00-1.946.806 3.42 3.42 0 01-4.438 0 3.42 3.42 0 00-1.946-.806 3.42 3.42 0 01-3.138-3.138 3.42 3.42 0 00-.806-1.946 3.42 3.42 0 010-4.438 3.42 3.42 0 00.806-1.946 3.42 3.42 0 013.138-3.138z',
    };

    return `
    <div class="space-y-4">
        <!-- Summary -->
        <div class="game-panel">
            <div class="game-panel-body">
                <div class="flex items-center justify-between mb-4">
                    <div>
                        <div class="text-lg font-bold text-white">Card Collection</div>
                        <div class="text-xs text-slate-500">${completedCount} / ${albumKeys.length} albums completed</div>

                    <div class="text-right">
                        <div class="text-xs text-slate-500">Earnings Bonus</div>
                        <div class="text-sm font-bold text-emerald-400">${S.albumEarningsMult ? `x${S.albumEarningsMult.toFixed(2)}` : 'x1.00'}</div>
                    </div>
                </div>
                <div class="progress-bar">
                    <div class="progress-fill bg-emerald-500" style="width:${albumKeys.length > 0 ? (completedCount / albumKeys.length * 100) : 0}%"></div>
                </div>
            </div>
        </div>

        <!-- Albums Grid -->
        <div class="grid md:grid-cols-2 gap-3">
            ${albumKeys.map(key => {
                const album = albums[key];
                const done = completed[key] || false;
                const iconPath = iconMap[album.icon] || iconMap.star;
                return `
                <div class="p-4 rounded-xl ${done ? 'bg-emerald-500/5 border-2 border-emerald-500/30' : 'bg-white/[0.02] border border-white/[0.06]'}">
                    <div class="flex items-center gap-3 mb-2">
                        <div class="w-10 h-10 rounded-xl ${done ? 'bg-emerald-500/20 border border-emerald-500/30' : 'bg-white/[0.05] border border-white/[0.08]'} flex items-center justify-center">

                        </div>
                        <div class="flex-1">
                            <div class="text-sm font-semibold ${done ? 'text-emerald-400' : 'text-white'}">${esc(album.name)}</div>
                            <div class="text-[10px] text-slate-500">${esc(album.description)}</div>
                        </div>
                        ${done ? '<span class="text-xs px-2 py-0.5 rounded bg-emerald-500/20 text-emerald-400 font-medium">DONE</span>' : ''}
                    </div>
                    <div class="flex items-center justify-between mt-2">
                        <div class="text-[10px] ${done ? 'text-emerald-400' : 'text-amber-400'} font-medium">${esc(album.bonus.label)}</div>
                        ${done ? '' : '<div class="text-[9px] text-slate-600">In Progress</div>'}
                    </div>
                </div>`;
            }).join('')}
        </div>
    </div>`;
}

/* =========== MARKET API ACTIONS =========== */
async function loadTradeListings() {
    const { data } = await api('/api/trade/listings');
    if (data.listings) {
        tradeListings = data.listings;
        renderFull();
        // Re-show tutorial overlay if it was active and got displaced
        if (tutorialActive && !document.getElementById('tutorial-overlay')) {
            setTimeout(() => showTutorialStep(), 100);
        }
    }
}

async function loadMyListings() {
    const { data } = await api('/api/trade/my-listings');
    if (data.listings) {
        myListings = data.listings;
        renderFull();
    }
}

async function doListPlayer(playerId) {
    const priceInput = document.getElementById('sell-price');
    if (!priceInput) return;
    const price = parseFloat(priceInput.value);
    if (isNaN(price) || price < 100) { showToast('Price must be at least $100', 'error'); return; }

    const listingType = window._sellType || 'fixed';
    const body = { playerId, price, listingType };
    if (listingType === 'auction') {
        const durInput = document.getElementById('auction-duration');
        body.durationHours = durInput ? parseFloat(durInput.value) : 24;
        body.startingBid = price;
    }

    const { data } = await api('/api/trade/list-player', { method: 'POST', body });
    if (data.error) { showToast(data.error, 'error'); return; }
    if (data.state) { S = data.state; }
    removeModal();
    tradeListings = null;
    myListings = null;
    showToast(listingType === 'auction' ? 'Auction started!' : 'Player listed on the market!', 'success');
    renderFull();
}

async function doBuyPlayer(listingId) {
    const { data } = await api('/api/trade/buy', { method: 'POST', body: { listingId } });
    if (data.error) { showToast(data.error, 'error'); return; }
    if (data.state) { S = data.state; }
    tradeListings = null;
    showToast('Player purchased!', 'success');
    renderFull();
}

async function doCancelListing(listingId) {
    const { data } = await api('/api/trade/cancel', { method: 'POST', body: { listingId } });
    if (data.error) { showToast(data.error, 'error'); return; }
    if (data.state) { S = data.state; }
    myListings = null;
    tradeListings = null;
    showToast('Listing cancelled, player returned', 'success');
    renderFull();
}

async function doBuyStarter() {
    const { data } = await api('/api/buy-starter', { method: 'POST', body: {} });
    if (data.error) { showToast(data.error, 'error'); return; }
    if (data.state) { S = data.state; }
    showToast(`Signed starter ${data.player.name}!`, 'success');
    renderFull();
}

function openOfferModal(listingId, playerName, askingPrice) {
    showModal('Make Offer for ' + playerName, `
        <div class="space-y-4">
            <div class="text-xs text-slate-400 mb-2">Asking price: <span class="text-emerald-400 font-bold">${fmt(askingPrice)}</span></div>
            <div>
                <label class="text-xs text-slate-400 mb-1 block">Your offer amount</label>
                <input id="offer-amount" type="number" min="100" value="${Math.floor(askingPrice * 0.8)}"
                    class="form-input-game w-full text-sm py-2" />
            </div>
            <div class="flex gap-1 flex-wrap">
                ${[askingPrice * 0.5, askingPrice * 0.75, askingPrice, askingPrice * 1.1].map(v => `
                    <button onclick="document.getElementById('offer-amount').value=${Math.floor(v)}" class="btn-game btn-secondary-game py-1 px-2 text-[10px]">${fmt(v)}</button>
                `).join('')}
            </div>
            <p class="text-xs text-slate-500">The seller can accept or decline your offer. If accepted, the player transfers to you and the money is deducted.</p>
            <button onclick="doMakeOffer(${listingId})" class="btn-game btn-gold-game w-full py-2.5 text-sm">Submit Offer</button>
        </div>
    `, { maxWidth: 'max-w-sm' });
}

function openBidModal(listingId, playerName, currentTopBid) {
    const minBid = Math.ceil(currentTopBid + 1);
    showModal('Bid on ' + playerName, `
        <div class="space-y-4">
            <div class="p-3 rounded-xl bg-purple-500/5 border border-purple-500/20">
                <div class="text-xs text-purple-400 font-semibold mb-1">&#128296; Auction Bid</div>
                <div class="text-xs text-slate-400">Current top bid: <span class="text-emerald-400 font-bold">${fmt(currentTopBid)}</span></div>
            </div>
            <div>
                <label class="text-xs text-slate-400 mb-1 block">Your bid (minimum ${fmt(minBid)})</label>
                <input id="bid-amount" type="number" min="${minBid}" value="${minBid}"
                    class="form-input-game w-full text-sm py-2" />
            </div>
            <div class="flex gap-1 flex-wrap">
                ${[minBid, minBid * 1.1, minBid * 1.25, minBid * 1.5].map(v => `
                    <button onclick="document.getElementById('bid-amount').value=${Math.ceil(v)}" class="btn-game btn-secondary-game py-1 px-2 text-[10px]">${fmt(v)}</button>
                `).join('')}
            </div>
            <p class="text-xs text-slate-500">Money is NOT deducted when bidding — only when the auction ends and you win. If outbid, no money is lost.</p>
            <button onclick="doPlaceBid(${listingId})" class="btn-game w-full py-2.5 text-sm" style="background:rgba(168,85,247,0.2);border:1px solid rgba(168,85,247,0.4);color:#a855f7;">Place Bid</button>
        </div>
    `, { maxWidth: 'max-w-sm' });
}

async function doPlaceBid(listingId) {
    const amountInput = document.getElementById('bid-amount');
    if (!amountInput) return;
    const amount = parseFloat(amountInput.value);
    if (isNaN(amount) || amount < 100) { showToast('Invalid bid amount', 'error'); return; }
    const { data } = await api('/api/trade/bid', { method: 'POST', body: { listingId, amount } });
    if (data.error) { showToast(data.error, 'error'); return; }
    if (data.state) { S = data.state; }
    removeModal();
    tradeListings = null;
    showToast('Bid placed!', 'success');
    renderFull();
}

async function doMakeOffer(listingId) {
    const input = document.getElementById('offer-amount');
    if (!input) return;
    const offerAmount = parseFloat(input.value);
    if (isNaN(offerAmount) || offerAmount < 100) { showToast('Offer must be at least $100', 'error'); return; }

    const { data } = await api('/api/trade/make-offer', { method: 'POST', body: { listingId, offerAmount } });
    if (data.error) { showToast(data.error, 'error'); return; }
    removeModal();
    showToast('Offer sent! The seller will review it.', 'success');
}

async function viewOffers(listingId) {
    const { data } = await api(`/api/trade/offers/${listingId}`);
    if (data.error) { showToast(data.error, 'error'); return; }
    const offers = data.offers || [];

    showModal(`Offers (${offers.length})`, `
        <div class="space-y-2">
            ${offers.length === 0 ? '<div class="text-center py-6 text-sm text-slate-500">No offers yet</div>' : ''}
            ${offers.map(o => `
                <div class="p-3 rounded-xl bg-white/[0.03] border border-white/[0.06]">
                    <div class="flex items-center justify-between mb-2">
                        <div>
                            <div class="text-sm font-semibold text-white">${esc(o.buyerName)}</div>
                            <div class="text-[10px] text-slate-500">${timeSince(o.createdAt)}</div>
                        </div>
                        <div class="text-lg font-bold text-emerald-400">${fmt(o.amount)}</div>
                    </div>
                    <div class="flex gap-2">
                        <button onclick="doAcceptOffer(${o.offerId})" class="btn-game btn-primary-game flex-1 py-1.5 text-xs">Accept</button>
                        <button onclick="doDeclineOffer(${o.offerId})" class="btn-game bg-red-500/10 text-red-400 border border-red-500/20 hover:bg-red-500/20 flex-1 py-1.5 text-xs">Decline</button>
                    </div>
                </div>
            `).join('')}
        </div>
    `, { maxWidth: 'max-w-sm' });
}

async function doAcceptOffer(offerId) {
    const { data } = await api('/api/trade/accept-offer', { method: 'POST', body: { offerId } });
    if (data.error) { showToast(data.error, 'error'); return; }
    if (data.state) { S = data.state; }
    removeModal();
    tradeListings = null;
    myListings = null;
    showToast('Offer accepted! Player sold.', 'success');
    renderFull();
}

async function doDeclineOffer(offerId) {
    const { data } = await api('/api/trade/decline-offer', { method: 'POST', body: { offerId } });
    if (data.error) { showToast(data.error, 'error'); return; }
    removeModal();
    showToast('Offer declined', 'info');
}
</script>
