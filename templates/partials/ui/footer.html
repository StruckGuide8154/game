<!-- Footer Template -->
<script>
function renderFooter() {
    const s = S;
    const markets = s.unlockedMarkets || [];

    return `
    <div class="mt-6 mb-4 animate-float-in" style="animation-delay: 0.2s" id="footer-panel">
        <div class="glass rounded-2xl p-4">
            <div class="flex flex-col sm:flex-row items-center justify-between gap-3">
                <div class="flex items-center gap-4 text-xs text-slate-500">
                    <span id="ft-players">${(s.players||[]).length} Players</span>
                    <span class="w-px h-3 bg-white/10"></span>
                    <span id="ft-deals">${s.transfersCompleted||0} Deals</span>
                    <span class="w-px h-3 bg-white/10"></span>
                    <span id="ft-markets">${markets.length} Markets</span>
                    <span class="w-px h-3 bg-white/10"></span>
                    <span id="ft-eps">${fmt(s.earningsPerSecond||0)}/s</span>
                </div>
                <div class="flex gap-2">
                    <button onclick="doSave()" class="btn-game btn-secondary-game py-1.5 px-4 text-xs">
                        Save Game
                    </button>
                    <button onclick="doReset()" class="btn-game btn-danger-game py-1.5 px-4 text-xs">
                        Reset
                    </button>
                </div>
            </div>
        </div>
    </div>`;
}

function updateFooter() {
    const s = S;
    _setText('ft-players', (s.players||[]).length + ' Players');
    _setText('ft-deals', (s.transfersCompleted||0) + ' Deals');
    _setText('ft-eps', fmt(s.earningsPerSecond||0) + '/s');
}
</script>
