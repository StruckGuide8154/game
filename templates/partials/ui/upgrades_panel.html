<!-- Upgrades Panel Template -->
<script>
const upgradeIcons = {
    scoutingNetwork: '<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>',
    negotiationSkills: '<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/></svg>',
    officeSpace: '<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M3 21h18M3 7v14M21 7v14M6 21V10M18 21V10M9 7h6M12 3v4"/></svg>',
    marketingTeam: '<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>',
    legalTeam: '<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M3 21h18M12 3l9 4v1H3V7z"/><path d="M5 8v8m4-8v8m4-8v8m4-8v8"/></svg>',
    mediaConnections: '<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>',
    autoSign: '<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 10 10H12V2z"/><path d="M12 2a10 10 0 0 1 10 10"/></svg>',
};

const upgradeColors = {
    scoutingNetwork: 'emerald',
    negotiationSkills: 'blue',
    officeSpace: 'purple',
    marketingTeam: 'amber',
    legalTeam: 'cyan',
    mediaConnections: 'pink',
    autoSign: 'orange',
};

function _upgradesContent() {
    const s = S;
    const info = s.upgradeInfo || {};
    let items = '';
    for (const [key, up] of Object.entries(info)) {
        const level = (s.upgrades || {})[key] || 0;
        const cost = (s.upgradeCosts || {})[key] || 0;
        const canAfford = (s.money || 0) >= cost;
        const color = upgradeColors[key] || 'emerald';
        const icon = upgradeIcons[key] || '';

        items += `
        <div class="group p-3 rounded-xl bg-white/[0.02] border border-white/[0.04] transition-game hover:bg-white/[0.04] hover:border-white/[0.08]">
            <div class="flex items-start gap-3">
                <div class="flex items-center justify-center w-9 h-9 rounded-lg bg-${color}-500/10 text-${color}-400 flex-shrink-0 mt-0.5">
                    ${icon}
                </div>
                <div class="flex-1 min-w-0">
                    <div class="flex items-center gap-2 mb-0.5">
                        <span class="font-semibold text-sm text-white">${esc(up.name)}</span>
                        <span class="badge bg-white/[0.06] text-slate-400 text-[10px]">Lv.${level}</span>
                    </div>
                    <p class="text-[11px] text-slate-500 mb-1.5">${esc(up.effect)}</p>
                    <button onclick="doUpgrade('${key}')" ${!canAfford ? 'disabled' : ''}
                        class="btn-game ${canAfford ? 'btn-gold-game' : 'btn-secondary-game opacity-50'} py-1 px-3 text-xs">
                        ${fmt(cost)}
                    </button>
                </div>
            </div>
        </div>`;
    }
    return items;
}

function _secondWorldBanner() {
    const s = S;
    if (s.secondWorldUnlocked) return '';
    if ((s.money || 0) < 1e9) return '';
    return `
    <div class="mt-3 p-4 rounded-xl bg-gradient-to-r from-violet-900/20 to-purple-900/20 border border-purple-500/30 text-center animate-pulse-slow">
        <div class="text-xs font-bold text-yellow-400 mb-1 tracking-wider">★ MILESTONE: $1,000,000,000 ★</div>
        <p class="text-[11px] text-slate-400 mb-3">You've reached $1 Billion! Unlock the Second World to run a second independent agency.</p>
        <button onclick="doUnlockSecondWorld()" class="btn-game btn-gold-game w-full py-2.5 text-xs tracking-wider">
            UNLOCK SECOND WORLD &rarr;
        </button>
    </div>`;
}

function renderUpgradesPanel() {
    return `
    <div class="game-panel hover-lift" id="upgrades-panel">
        <div class="game-panel-header">
            <div class="flex items-center justify-center w-8 h-8 rounded-lg bg-amber-500/10">
                <svg class="w-4 h-4 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>
            </div>
            <h3 class="font-semibold text-sm">Agency Upgrades</h3>
        </div>
        <div class="game-panel-body space-y-2" id="upgrades-body" data-hash="">
            ${_upgradesContent()}
        </div>
        <div id="second-world-banner">${_secondWorldBanner()}</div>
    </div>`;
}

function updateUpgradesPanel() {
    _patch('upgrades-body', _upgradesContent());
    _patch('second-world-banner', _secondWorldBanner());
}
</script>
