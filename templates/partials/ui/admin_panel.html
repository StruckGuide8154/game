<!-- Admin Panel Template -->
<script>
const tierOptions = ['Prospect', 'Rising Star', 'Professional', 'International', 'World Class', 'Superstar'];
const positionOptions = ['GK','CB','LB','RB','CDM','CM','CAM','LW','RW','ST'];
let adminTab = 'dashboard';
let adminSelectedUser = null;
let adminSelectedUserStats = null;
let adminLeaderboardData = null;
let adminPlaytimeData = null;
let adminLeaderboardSort = 'money';

function switchAdminTab(tab) {
    adminTab = tab;
    if (tab === 'leaderboard' && !adminLeaderboardData) loadLeaderboard();
    if (tab === 'playtime' && !adminPlaytimeData) loadPlaytime();
    renderFull();
}

function renderAdminPage() {
    const s = S;
    const players = s.players || [];

    return `
    <div class="max-w-6xl mx-auto animate-float-in" id="admin-page">
        <div class="mb-6">
            <h2 class="font-display text-lg font-bold tracking-wide text-white mb-1">Admin Panel</h2>
            <p class="text-xs text-slate-500">Full server management: users, players, leaderboard, playtime</p>
        </div>

        <!-- Admin Sub-Tabs -->
        <div class="flex gap-1 mb-6 p-1 rounded-xl bg-white/[0.03] border border-white/[0.06] w-fit">
            ${[
                {id:'dashboard', label:'Dashboard', icon:'M4 5a1 1 0 011-1h14a1 1 0 011 1v2a1 1 0 01-1 1H5a1 1 0 01-1-1V5zM4 13a1 1 0 011-1h6a1 1 0 011 1v6a1 1 0 01-1 1H5a1 1 0 01-1-1v-6zM16 13a1 1 0 011-1h2a1 1 0 011 1v6a1 1 0 01-1 1h-2a1 1 0 01-1-1v-6z'},

                {id:'playtime', label:'Playtime', icon:'M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z'},
            ].map(t => `
                <button onclick="switchAdminTab('${t.id}')"
                    class="flex items-center gap-1.5 px-3 py-2 rounded-lg text-xs font-medium transition-all ${adminTab === t.id ? 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30' : 'text-slate-400 hover:text-white hover:bg-white/[0.05]'}">

        <!-- Tab Content -->
        ${adminTab === 'dashboard' ? renderAdminDashboard(players) : ''}
        ${adminTab === 'users' ? renderAdminUsers() : ''}
        ${adminTab === 'leaderboard' ? renderAdminLeaderboard() : ''}
        ${adminTab === 'playtime' ? renderAdminPlaytime() : ''}
    </div>`;
}

                            `).join('')}

                    </div>`;

            </div>
        </div>
    </div>`;
}

function renderUserFullDetails() {
    const s = adminSelectedUserStats;
    const u = s.user;
    const st = s.stats;
    const players = s.players || [];
    const clubStats = st.clubStats || {};
    const upgrades = st.upgrades || {};
    const facilities = st.clubFacilities || {};

    return `
    <div class="space-y-4">
        <!-- User Header -->
        <div class="game-panel">
            <div class="game-panel-body">
                <div class="flex items-center justify-between mb-4">
                    <div>
                        <div class="text-lg font-bold text-white flex items-center gap-2">
                            ${esc(u.username)}
                            ${u.isAdmin ? '<span class="text-[10px] px-1.5 py-0.5 rounded bg-amber-500/20 text-amber-400 font-medium">ADMIN</span>' : ''}
                        </div>
                        <div class="text-xs text-slate-500">ID: ${u.id} | Joined: ${new Date(u.createdAt * 1000).toLocaleDateString()} | Playtime: ${formatPlaytime(st.totalPlaytime || 0)}</div>
                    </div>
                    <button onclick="loadUserDetails(${u.id})" class="btn-game btn-secondary-game py-1.5 px-3 text-xs">
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
                    </button>
                </div>

                <!-- Stats Grid -->
                <div class="grid grid-cols-4 gap-2 mb-4">
                    <div class="p-2 rounded-lg bg-white/[0.02] text-center">
                        <div class="text-[10px] text-slate-500">Money</div>
                        <div class="text-sm font-bold text-emerald-400">${fmt(st.money)}</div>
                    </div>
                    <div class="p-2 rounded-lg bg-white/[0.02] text-center">
                        <div class="text-[10px] text-slate-500">Reputation</div>
                        <div class="text-sm font-bold text-amber-400">${Math.floor(st.reputation).toLocaleString()}</div>
                    </div>
                    <div class="p-2 rounded-lg bg-white/[0.02] text-center">
                        <div class="text-[10px] text-slate-500">$/sec</div>
                        <div class="text-sm font-bold text-cyan-400">${fmt(st.earningsPerSecond)}</div>
                    </div>
                    <div class="p-2 rounded-lg bg-white/[0.02] text-center">
                        <div class="text-[10px] text-slate-500">Agents</div>
                        <div class="text-sm font-bold text-blue-400">${st.agents}</div>
                    </div>
                    <div class="p-2 rounded-lg bg-white/[0.02] text-center">
                        <div class="text-[10px] text-slate-500">Players</div>
                        <div class="text-sm font-bold text-purple-400">${st.playerCount}</div>
                    </div>
                    <div class="p-2 rounded-lg bg-white/[0.02] text-center">
                        <div class="text-[10px] text-slate-500">Transfers</div>
                        <div class="text-sm font-bold text-pink-400">${st.transfersCompleted}</div>
                    </div>
                    <div class="p-2 rounded-lg bg-white/[0.02] text-center">
                        <div class="text-[10px] text-slate-500">Commission</div>
                        <div class="text-sm font-bold text-orange-400">${fmt(st.totalCommission)}</div>
                    </div>
                    <div class="p-2 rounded-lg bg-white/[0.02] text-center">
                        <div class="text-[10px] text-slate-500">Sponsorships</div>
                        <div class="text-sm font-bold text-yellow-400">${st.activeSponsorships}</div>
                    </div>
                </div>

                <!-- Club Info -->
                ${st.clubName ? `
                <div class="p-3 rounded-xl bg-white/[0.03] border border-white/[0.06] mb-4">
                    <div class="flex items-center justify-between mb-2">
                        <span class="text-sm font-semibold text-white">${esc(st.clubName)}</span>
                        <span class="text-[10px] px-1.5 py-0.5 rounded ${st.clubActive ? 'bg-emerald-500/20 text-emerald-400' : 'bg-slate-500/20 text-slate-400'}">${st.clubActive ? 'ACTIVE' : 'INACTIVE'}</span>
                    </div>
                    <div class="grid grid-cols-5 gap-2 text-center text-xs">
                        <div><span class="text-slate-500">Played</span> <span class="text-white">${clubStats.matchesPlayed || 0}</span></div>
                        <div><span class="text-slate-500">W</span> <span class="text-emerald-400">${clubStats.wins || 0}</span></div>
                        <div><span class="text-slate-500">D</span> <span class="text-amber-400">${clubStats.draws || 0}</span></div>
                        <div><span class="text-slate-500">L</span> <span class="text-red-400">${clubStats.losses || 0}</span></div>
                        <div><span class="text-slate-500">GD</span> <span class="text-blue-400">${(clubStats.goalsScored || 0) - (clubStats.goalsConceded || 0)}</span></div>
                    </div>
                    <div class="grid grid-cols-3 gap-2 mt-2 text-center text-xs">
                        <div><span class="text-slate-500">Formation</span> <span class="text-white">${st.formation}</span></div>
                        <div><span class="text-slate-500">Stadium</span> <span class="text-white">Lv${facilities.stadium||0}</span></div>
                        <div><span class="text-slate-500">Training</span> <span class="text-white">Lv${facilities.training||0}</span></div>
                    </div>
                </div>
                ` : ''}

                <!-- Upgrades -->
                <div class="grid grid-cols-4 gap-1 mb-4">
                    ${Object.entries(upgrades).map(([k,v]) => `
                        <div class="text-center p-1 rounded bg-white/[0.02] text-[9px]">
                            <div class="text-slate-500">${k.replace(/([A-Z])/g,' $1').trim()}</div>
                            <div class="text-white font-bold">Lv${v}</div>
                        </div>
                    `).join('')}
                </div>
            </div>
        </div>

        <!-- Players List (Full editable) -->
        <div class="game-panel">
            <div class="game-panel-header">
                <div class="flex items-center justify-center w-8 h-8 rounded-lg bg-purple-500/10">
                    <svg class="w-4 h-4 text-purple-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"/></svg>
                </div>
                <h3 class="font-semibold text-sm">Players (${players.length})</h3>
            </div>
            <div class="game-panel-body max-h-[500px] overflow-y-auto space-y-2">
                ${players.length === 0 ? `
                    <p class="text-center text-sm text-slate-500 py-4">No players</p>
                ` : players.map(p => {
                    const flag = nationalityFlags[p.nationality] || '&#127760;';
                    const posColor = positionColors[p.position] || 'bg-slate-500';
                    const stats = p.stats || {};
                    return `
                    <div class="p-3 rounded-xl bg-white/[0.02] border border-white/[0.06]">
                        <div class="flex items-center justify-between mb-2">
                            <div class="flex items-center gap-2">
                                <div class="w-8 h-8 rounded-lg ${posColor} flex items-center justify-center text-[10px] font-bold text-white">${esc(p.position)}</div>
                                <div>
                                    <div class="text-sm font-semibold text-white flex items-center gap-1">
                                        ${esc(p.name)} <span class="text-xs">${flag}</span>
                                        ${p.hasSponsorship ? '<span class="text-[9px] px-1 py-0.5 rounded bg-yellow-500/20 text-yellow-400">SPONSORED</span>' : ''}
                                    </div>
                                    <div class="text-[10px] text-slate-500">${esc(p.tier)} | Age ${p.age} | ${p.preferredFoot} foot | Val: ${p.value} | x${p.multiplier}</div>
                                </div>
                            </div>
                            <div class="text-right">
                                <div class="text-sm font-bold ${stats.overall >= 80 ? 'text-emerald-400' : stats.overall >= 60 ? 'text-blue-400' : 'text-amber-400'}">${stats.overall||'?'}</div>
                                <div class="text-[9px] text-slate-500">OVR</div>
                            </div>
                        </div>
                        <!-- Stats Row -->
                        <div class="grid grid-cols-6 gap-1 mb-2 p-2 rounded-lg bg-white/[0.02]">
                            ${['pace','shooting','passing','dribbling','defending','physical'].map(sn => {
                                const v = stats[sn]||0;
                                const color = v >= 80 ? 'text-emerald-400' : v >= 60 ? 'text-blue-400' : v >= 40 ? 'text-amber-400' : 'text-red-400';
                                return `<div class="text-center">
                                    <div class="text-[8px] text-slate-600 uppercase">${sn.slice(0,3)}</div>
                                    <div class="text-xs font-bold ${color}">${v}</div>
                                </div>`;
                            }).join('')}
                        </div>
                        ${p.hasSponsorship ? `<div class="text-[10px] text-yellow-400 mb-2">Sponsorship: ${fmt(p.sponsorshipValue)}/s | Earnings: ${fmt(p.earnings)}</div>` : `<div class="text-[10px] text-slate-500 mb-2">Earnings: ${fmt(p.earnings)}</div>`}
                        <!-- Action Buttons -->
                        <div class="flex gap-1 flex-wrap">
                            <button onclick="openEditPlayerModal('${p.id}')" class="btn-game btn-secondary-game py-0.5 px-2 text-[10px]">Edit Stats</button>
                            <button onclick="doAdminToggleSponsorship('${p.id}')" class="btn-game ${p.hasSponsorship ? 'bg-yellow-500/10 text-yellow-400 border border-yellow-500/20' : 'btn-secondary-game'} py-0.5 px-2 text-[10px]">
                                ${p.hasSponsorship ? 'Remove Sponsor' : 'Add Sponsor'}
                            </button>
                            ${tierOptions.map(t => `
                                <button onclick="doAdminEditPlayerTier('${p.id}','${t}')" class="btn-game ${p.tier === t ? 'btn-primary-game' : 'btn-secondary-game'} py-0.5 px-1.5 text-[9px]">${t.split(' ')[0]}</button>
                            `).join('')}
                            <button onclick="doAdminRemovePlayer('${p.id}','${esc(p.name)}')" class="btn-game bg-red-500/10 text-red-400 border border-red-500/20 hover:bg-red-500/20 py-0.5 px-2 text-[10px]">Remove</button>
                        </div>
                    </div>`;
                }).join('')}
            </div>
        </div>
    </div>`;
}

/* =========== LEADERBOARD TAB =========== */
function renderAdminLeaderboard() {
    if (!adminLeaderboardData) {
        return `<div class="game-panel"><div class="game-panel-body text-center py-8">
            <div class="text-sm text-slate-400">Loading leaderboard...</div>
        </div></div>`;
    }

    const data = [...adminLeaderboardData];
    // Sort
    data.sort((a, b) => {
        if (adminLeaderboardSort === 'money') return b.money - a.money;
        if (adminLeaderboardSort === 'reputation') return b.reputation - a.reputation;
        if (adminLeaderboardSort === 'players') return b.playerCount - a.playerCount;
        if (adminLeaderboardSort === 'transfers') return b.transfersCompleted - a.transfersCompleted;
        if (adminLeaderboardSort === 'wins') return b.wins - a.wins;
        if (adminLeaderboardSort === 'playtime') return b.totalPlaytime - a.totalPlaytime;
        return b.money - a.money;
    });

    const medals = ['text-amber-400', 'text-slate-300', 'text-orange-600'];

    return `
    <div class="game-panel">
        <div class="game-panel-header">
            <div class="flex items-center justify-center w-8 h-8 rounded-lg bg-amber-500/10">
                <svg class="w-4 h-4 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg>
            </div>
            <h3 class="font-semibold text-sm">Leaderboard</h3>
            <button onclick="loadLeaderboard()" class="ml-auto btn-game btn-secondary-game py-1 px-2 text-[10px]">Refresh</button>
        </div>
        <div class="game-panel-body">
            <!-- Sort Buttons -->
            <div class="flex gap-1 mb-4 flex-wrap">
                ${['money','reputation','players','transfers','wins','playtime'].map(s => `
                    <button onclick="adminLeaderboardSort='${s}';renderFull()" class="btn-game ${adminLeaderboardSort === s ? 'btn-primary-game' : 'btn-secondary-game'} py-1 px-2 text-[10px]">
                        ${s.charAt(0).toUpperCase() + s.slice(1)}
                    </button>
                `).join('')}
            </div>
            <!-- Table -->
            <div class="overflow-x-auto">
                <table class="w-full text-xs">
                    <thead>
                        <tr class="text-slate-500 border-b border-white/[0.06]">
                            <th class="text-left py-2 px-2">#</th>
                            <th class="text-left py-2 px-2">User</th>
                            <th class="text-right py-2 px-2">Money</th>
                            <th class="text-right py-2 px-2">Rep</th>
                            <th class="text-right py-2 px-2">Players</th>
                            <th class="text-right py-2 px-2">W/L</th>
                            <th class="text-right py-2 px-2">Best Player</th>
                            <th class="text-right py-2 px-2">Playtime</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${data.map((u, i) => `
                        <tr class="border-b border-white/[0.03] hover:bg-white/[0.02] cursor-pointer" onclick="selectUserFromLeaderboard(${u.id}, '${esc(u.username)}')">
                            <td class="py-2 px-2 ${i < 3 ? medals[i] + ' font-bold' : 'text-slate-500'}">${i+1}</td>
                            <td class="py-2 px-2">
                                <span class="text-white font-medium">${esc(u.username)}</span>
                                ${u.isAdmin ? '<span class="ml-1 text-[8px] px-1 py-0.5 rounded bg-amber-500/20 text-amber-400">A</span>' : ''}
                                ${u.clubName ? '<span class="ml-1 text-[9px] text-slate-500">' + esc(u.clubName) + '</span>' : ''}
                            </td>
                            <td class="py-2 px-2 text-right text-emerald-400 font-medium">${fmt(u.money)}</td>
                            <td class="py-2 px-2 text-right text-amber-400">${Math.floor(u.reputation).toLocaleString()}</td>
                            <td class="py-2 px-2 text-right text-purple-400">${u.playerCount}</td>
                            <td class="py-2 px-2 text-right"><span class="text-emerald-400">${u.wins}</span><span class="text-slate-600">/</span><span class="text-red-400">${u.matchesPlayed - u.wins}</span></td>
                            <td class="py-2 px-2 text-right">
                                ${u.bestPlayerName ? `<span class="text-white">${esc(u.bestPlayerName)}</span> <span class="text-slate-500">${u.bestPlayerOvr}</span>` : '<span class="text-slate-600">-</span>'}
                            </td>
                            <td class="py-2 px-2 text-right text-cyan-400">${formatPlaytime(u.totalPlaytime)}</td>
                        </tr>
                        `).join('')}
                    </tbody>
                </table>
            </div>
        </div>
    </div>`;
}

/* =========== PLAYTIME TAB =========== */
function renderAdminPlaytime() {
    if (!adminPlaytimeData) {
        return `<div class="game-panel"><div class="game-panel-body text-center py-8">
            <div class="text-sm text-slate-400">Loading playtime data...</div>
        </div></div>`;
    }

    const maxPlaytime = Math.max(...adminPlaytimeData.map(u => u.totalPlaytime), 1);

    return `
    <div class="game-panel">
        <div class="game-panel-header">
            <div class="flex items-center justify-center w-8 h-8 rounded-lg bg-cyan-500/10">
                <svg class="w-4 h-4 text-cyan-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
            </div>
            <h3 class="font-semibold text-sm">Playtime Tracker</h3>
            <button onclick="loadPlaytime()" class="ml-auto btn-game btn-secondary-game py-1 px-2 text-[10px]">Refresh</button>
        </div>
        <div class="game-panel-body space-y-3">
            ${adminPlaytimeData.map((u, i) => {
                const pct = maxPlaytime > 0 ? (u.totalPlaytime / maxPlaytime * 100) : 0;
                const lastActive = u.lastActiveTime ? timeSince(u.lastActiveTime) : 'Never';
                const isOnline = u.lastActiveTime && ((Date.now()/1000) - u.lastActiveTime) < 120;
                return `
                <div class="p-3 rounded-xl bg-white/[0.02] border border-white/[0.06]">
                    <div class="flex items-center justify-between mb-2">
                        <div class="flex items-center gap-2">
                            <div class="w-6 h-6 rounded-full ${isOnline ? 'bg-emerald-500/20 border border-emerald-500/30' : 'bg-slate-500/20 border border-slate-500/30'} flex items-center justify-center">
                                <div class="w-2 h-2 rounded-full ${isOnline ? 'bg-emerald-400' : 'bg-slate-500'}"></div>
                            </div>
                            <div>
                                <span class="text-sm font-semibold text-white">${esc(u.username)}</span>
                                <span class="text-[10px] ml-2 ${isOnline ? 'text-emerald-400' : 'text-slate-500'}">${isOnline ? 'Online now' : 'Last active: ' + lastActive}</span>
                            </div>
                        </div>
                        <div class="text-right">
                            <div class="text-sm font-bold text-cyan-400">${formatPlaytime(u.totalPlaytime)}</div>
                            <div class="text-[9px] text-slate-500">Joined ${new Date(u.createdAt * 1000).toLocaleDateString()}</div>
                        </div>
                    </div>
                    <div class="progress-bar">
                        <div class="progress-fill bg-cyan-500" style="width:${pct}%"></div>
                    </div>
                </div>`;
            }).join('')}

            ${adminPlaytimeData.length === 0 ? '<div class="text-center py-4 text-sm text-slate-500">No users found</div>' : ''}
        </div>
    </div>`;
}

/* =========== HELPERS =========== */
function formatPlaytime(seconds) {
    if (!seconds || seconds <= 0) return '0m';
    const h = Math.floor(seconds / 3600);
    const m = Math.floor((seconds % 3600) / 60);
    if (h > 0) return `${h}h ${m}m`;
    return `${m}m`;
}

function timeSince(timestamp) {
    const now = Date.now() / 1000;
    const diff = now - timestamp;
    if (diff < 60) return 'just now';
    if (diff < 3600) return `${Math.floor(diff/60)}m ago`;
    if (diff < 86400) return `${Math.floor(diff/3600)}h ago`;
    return `${Math.floor(diff/86400)}d ago`;
}
