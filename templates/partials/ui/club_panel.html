<!-- Club Management Page Template -->
<script>
function renderClubPage() {
    const s = S;
    const players = s.players || [];
    const formation = s.formation || '4-3-3';
    const positions = s.formationPositions || [];
    const formations = s.formations || {};
    const clubName = s.clubName || '';
    const clubActive = s.clubActive || false;
    const clubReady = s.clubReady || false;
    const clubStats = s.clubStats || {};
    const clubOverall = s.clubOverall || 0;
    const matchHistory = s.matchHistory || [];
    const matchCooldown = s.matchCooldown || 0;
    const opponents = s.availableOpponents || [];
    const facilities = s.clubFacilities || {};
    const facilityCosts = s.facilityUpgradeCosts || {};
    const trainingTypes = s.trainingTypes || {};
    const cooldowns = s.playerTrainingCooldowns || {};
    const league = s.league || null;

    /* Map positions to players - USE startingLineup if available */
    const lineup = s.startingLineup || {};
    const assigned = {};
    const usedIds = new Set();

    // First, assign players from startingLineup
    positions.forEach((pos, idx) => {
        const assignedPlayerId = lineup[String(idx)];
        if (assignedPlayerId) {
            const player = players.find(p => p.id === assignedPlayerId && p.position === pos);
            if (player && !usedIds.has(player.id)) {
                assigned[idx] = player;
                usedIds.add(player.id);
            }
        }
    });

    // Then fill remaining slots with auto-assignment
    positions.forEach((pos, idx) => {
        if (!assigned[idx]) {
            for (const p of players) {
                if (!usedIds.has(p.id) && p.position === pos) {
                    assigned[idx] = p;
                    usedIds.add(p.id);
                    break;
                }
            }
        }
    });

    const posSlots = positions.map((pos, idx) => {
        const p = assigned[idx];
        const posColor = (positionColors||{})[pos] || 'bg-slate-500';
        if (p) {
            const flag = nationalityFlags[p.nationality] || '&#127760;';
            return `
            <div onclick="showSwapPlayer(${idx}, '${pos}')" class="flex flex-col items-center p-2 rounded-xl bg-white/[0.04] border border-emerald-500/20 min-w-[70px] cursor-pointer hover:bg-white/[0.06] transition-colors">
                <div class="w-7 h-7 rounded-lg ${posColor} flex items-center justify-center text-[9px] font-bold text-white mb-1">${pos}</div>
                <div class="text-[9px] font-semibold text-white text-center truncate w-full">${esc(p.name.split(' ')[1] || p.name)}</div>
                <div class="text-[8px] text-emerald-400">${(p.stats||{}).overall||'?'} OVR</div>
            </div>`;
        }
        return `
        <div onclick="showSwapPlayer(${idx}, '${pos}')" class="flex flex-col items-center p-2 rounded-xl bg-white/[0.02] border border-dashed border-white/[0.1] min-w-[70px] opacity-50 cursor-pointer hover:opacity-70 transition-opacity">
            <div class="w-7 h-7 rounded-lg ${posColor} flex items-center justify-center text-[9px] font-bold text-white mb-1">${pos}</div>
            <div class="text-[9px] text-slate-500">Empty</div>
        </div>`;
    });

    const filledCount = Object.keys(assigned).length;
    const totalSlots = positions.length;

    /* Club stats display */
    const winRate = clubStats.matchesPlayed > 0 ? Math.floor((clubStats.wins / clubStats.matchesPlayed) * 100) : 0;

    return `
    <div class="max-w-6xl mx-auto animate-float-in" id="club-page">
        <div class="mb-4">
            <h2 class="font-display text-lg font-bold tracking-wide text-white mb-1">Club Management</h2>
            <p class="text-xs text-slate-500">Build your squad, play matches, and earn rewards</p>
        </div>

        ${clubActive ? `
        <!-- Active Club Header -->
        <div class="game-panel mb-4">
            <div class="game-panel-body py-3">
                <div class="flex flex-wrap items-center justify-between gap-4">
                    <div class="flex items-center gap-3">
                        <div class="w-12 h-12 rounded-xl bg-gradient-to-br from-emerald-500 to-blue-500 flex items-center justify-center text-xl font-bold text-white">
                            ${esc(clubName.charAt(0) || 'C')}
                        </div>
                        <div>
                            <div class="text-lg font-bold text-white">${esc(clubName)}</div>
                            <div class="text-xs text-emerald-400">Team OVR: ${clubOverall}</div>
                        </div>
                    </div>
                    <div class="flex gap-6 text-center">
                        <div>
                            <div class="text-xl font-bold text-white">${clubStats.matchesPlayed || 0}</div>
                            <div class="text-[10px] text-slate-500">Matches</div>
                        </div>
                        <div>
                            <div class="text-xl font-bold text-emerald-400">${clubStats.wins || 0}</div>
                            <div class="text-[10px] text-slate-500">Wins</div>
                        </div>
                        <div>
                            <div class="text-xl font-bold text-amber-400">${clubStats.draws || 0}</div>
                            <div class="text-[10px] text-slate-500">Draws</div>
                        </div>
                        <div>
                            <div class="text-xl font-bold text-red-400">${clubStats.losses || 0}</div>
                            <div class="text-[10px] text-slate-500">Losses</div>
                        </div>
                        <div>
                            <div class="text-xl font-bold text-blue-400">${winRate}%</div>
                            <div class="text-[10px] text-slate-500">Win Rate</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        ` : ''}

        <div class="grid lg:grid-cols-3 gap-4">
            <!-- Formation & Squad -->
            <div class="game-panel">
                <div class="game-panel-header">
                    <div class="flex items-center justify-center w-7 h-7 rounded-lg bg-emerald-500/10">
                        <svg class="w-3.5 h-3.5 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M12 3v18M3 12h18"/></svg>
                    </div>
                    <h3 class="font-semibold text-sm">Squad (${filledCount}/${totalSlots})</h3>
                    <span class="ml-auto text-xs text-emerald-400">${clubOverall} OVR</span>
                </div>
                <div class="game-panel-body">
                    <div class="flex flex-wrap gap-1.5 mb-3">
                        ${Object.entries(formations).map(([k, label]) => `
                            <button onclick="doSetFormation('${k}')" class="btn-game ${formation === k ? 'btn-primary-game' : 'btn-secondary-game'} py-1 px-2 text-[10px]">
                                ${esc(label)}
                            </button>
                        `).join('')}
                    </div>
                    <div class="grid grid-cols-4 gap-1.5 mb-3">
                        ${posSlots.join('')}
                    </div>
                    <div class="progress-bar">
                        <div class="progress-fill ${filledCount >= totalSlots ? 'bg-emerald-500' : 'bg-amber-500'}" style="width:${Math.floor(filledCount/totalSlots*100)}%"></div>
                    </div>
                </div>
            </div>

            ${clubActive ? `
            <!-- Play Match + Friend Match -->
            <div class="game-panel">
                <div class="game-panel-header">
                    <div class="flex items-center justify-center w-7 h-7 rounded-lg bg-blue-500/10">
                        <svg class="w-3.5 h-3.5 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
                    </div>
                    <h3 class="font-semibold text-sm">Play Match</h3>
                    ${matchCooldown > 0 ? `<span class="ml-auto text-xs text-amber-400">${Math.ceil(matchCooldown)}s</span>` : ''}
                </div>
                <div class="game-panel-body space-y-2 max-h-[350px] overflow-y-auto">
                    <!-- Friend Match -->
                    <div class="p-2 rounded-lg bg-purple-500/[0.08] border border-purple-500/20">
                        <div class="text-[10px] text-purple-400 font-semibold mb-1.5">PLAY A FRIEND ONLINE</div>
                        <div class="flex gap-1.5">
                            <input id="friend-username-input" type="text" placeholder="Friend's username..." class="form-input-game flex-1 text-[11px] py-1.5 px-2" />
                            <button onclick="doFriendMatch()" ${matchCooldown > 0 ? 'disabled' : ''} class="btn-game btn-primary-game py-1.5 px-3 text-[10px]">
                                Challenge
                            </button>
                        </div>
                    </div>

                    ${matchCooldown > 0 ? `
                        <div class="p-3 rounded-lg bg-amber-500/[0.08] border border-amber-500/20 text-center">
                            <div class="text-xs text-amber-400">Next match available in ${Math.ceil(matchCooldown)}s</div>
                        </div>
                    ` : opponents.length > 0 ? opponents.map(opp => `
                        <div onclick="doPlayMatch('${esc(opp.name)}')" class="flex items-center gap-2 p-2 rounded-lg bg-white/[0.02] border border-white/[0.06] hover:bg-white/[0.04] cursor-pointer transition-colors">
                            <div class="flex-1">
                                <div class="text-xs font-semibold text-white">${esc(opp.name)}</div>
                                <div class="flex items-center gap-2 text-[10px]">
                                    <span class="text-slate-400">OVR: ${opp.avgOvr}</span>
                                    <span class="${opp.difficulty === 'easy' ? 'text-emerald-400' : opp.difficulty === 'medium' ? 'text-amber-400' : 'text-red-400'}">${opp.difficulty}</span>
                                </div>
                            </div>
                            <div class="text-right text-[10px] mr-2">
                                <div class="text-emerald-400">$${(opp.reward/1000).toFixed(0)}K</div>
                                <div class="text-blue-400">+${opp.repReward} rep</div>
                            </div>
                            <button class="btn-game btn-primary-game py-1.5 px-3 text-[10px]">
                                Play
                            </button>
                        </div>
                    `).join('') : `
                        <div class="text-xs text-slate-500 text-center py-4">No opponents available</div>
                    `}
                </div>
            </div>

            <!-- Training -->
            <div class="game-panel">
                <div class="game-panel-header">
                    <div class="flex items-center justify-center w-7 h-7 rounded-lg bg-purple-500/10">
                        <svg class="w-3.5 h-3.5 text-purple-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
                    </div>
                    <h3 class="font-semibold text-sm">Training</h3>
                    <button onclick="showBatchTraining()" class="ml-auto btn-game btn-secondary-game py-1 px-2 text-[10px]">
                        Batch Train
                    </button>
                </div>
                <div class="game-panel-body space-y-2 max-h-[280px] overflow-y-auto">
                    ${players.slice(0, 8).map(p => {
                        const onCooldown = cooldowns[p.id] && cooldowns[p.id] > (Date.now()/1000);
                        const cdRemaining = onCooldown ? Math.ceil(cooldowns[p.id] - Date.now()/1000) : 0;
                        return `
                        <div class="p-2 rounded-lg bg-white/[0.02] border border-white/[0.06]">
                            <div class="flex items-center justify-between mb-1.5">
                                <div class="text-xs font-semibold text-white">${esc(p.name.split(' ')[1] || p.name)}</div>
                                <div class="text-[10px] text-emerald-400">${(p.stats||{}).overall||'?'} OVR</div>
                            </div>
                            ${onCooldown ? `
                                <div class="text-[10px] text-amber-400 text-center">Cooldown: ${cdRemaining}s</div>
                            ` : `
                                <div class="flex flex-wrap gap-1">
                                    ${Object.entries(trainingTypes).map(([key, t]) => `
                                        <button onclick="doTrainPlayer('${p.id}', '${key}')" class="btn-game btn-secondary-game py-0.5 px-1.5 text-[9px]" title="${t.stats.join(', ')} +${t.boost[0]}-${t.boost[1]}">
                                            ${esc(t.name.split(' ')[0])} $${(t.cost/1000).toFixed(0)}K
                                        </button>
                                    `).join('')}
                                </div>
                            `}
                        </div>`;
                    }).join('')}
                    ${players.length === 0 ? `<div class="text-xs text-slate-500 text-center py-4">Sign players to train them</div>` : ''}
                </div>
            </div>
            ` : `
            <!-- Club Setup (when not active) -->
            <div class="game-panel lg:col-span-2">
                <div class="game-panel-header">
                    <div class="flex items-center justify-center w-7 h-7 rounded-lg bg-purple-500/10">
                        <svg class="w-3.5 h-3.5 text-purple-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M3 21h18M3 7v14M21 7v14M6 21V10M18 21V10M9 7h6M12 3v4"/></svg>
                    </div>
                    <h3 class="font-semibold text-sm">Activate Club</h3>
                </div>
                <div class="game-panel-body space-y-3">
                    <div>
                        <label class="text-xs text-slate-400 mb-1 block">Club Name</label>
                        <div class="flex gap-2">
                            <input id="club-name-input" type="text" maxlength="30" value="${esc(clubName)}" placeholder="Enter club name..."
                                class="form-input-game flex-1 text-sm py-2" />
                            <button onclick="doSetClubName()" class="btn-game btn-secondary-game py-2 px-4 text-xs">Set</button>
                        </div>
                    </div>

                    ${clubReady && clubName ? `
                        <button onclick="doActivateClub()" class="btn-game btn-primary-game w-full py-3 text-sm animate-pulse-glow">
                            Activate Club
                        </button>
                        <p class="text-xs text-emerald-400/60 text-center">All positions filled! Ready to play matches.</p>
                    ` : `
                        <div class="p-4 rounded-xl bg-white/[0.02] border border-white/[0.06] text-center">
                            <p class="text-sm text-slate-400 mb-1">Fill all ${totalSlots} positions & set name</p>
                            <p class="text-xs text-slate-600">Scout players for each position needed</p>
                        </div>
                    `}

                    <!-- Position needs -->
                    <div class="flex flex-wrap gap-2">
                        ${(() => {
                            const needed = {};
                            positions.forEach(p => { needed[p] = (needed[p]||0) + 1; });
                            const have = {};
                            players.forEach(p => { have[p.position] = (have[p.position]||0) + 1; });
                            return Object.entries(needed).map(([pos, count]) => {
                                const got = Math.min(have[pos]||0, count);
                                const full = got >= count;
                                const pc = (positionColors||{})[pos] || 'bg-slate-500';
                                return `<div class="flex items-center gap-1 p-1 rounded ${full ? 'bg-emerald-500/[0.08] border border-emerald-500/20' : 'bg-white/[0.02] border border-white/[0.06]'}">
                                    <div class="w-5 h-5 rounded ${pc} flex items-center justify-center text-[8px] font-bold text-white">${pos}</div>
                                    <span class="text-[10px] ${full ? 'text-emerald-400' : 'text-slate-400'}">${got}/${count}</span>
                                </div>`;
                            }).join('');
                        })()}
                    </div>
                </div>
            </div>
            `}
        </div>

        ${clubActive ? `
        <!-- League Section -->
        <div class="game-panel mt-4">
            <div class="game-panel-header">
                <div class="flex items-center justify-center w-7 h-7 rounded-lg bg-amber-500/10">
                    <svg class="w-3.5 h-3.5 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                </div>
                <h3 class="font-semibold text-sm">League Season ${league ? league.season : (s.leagueSeason || 0)}</h3>
                ${league && !league.completed ? `<span class="ml-auto badge bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 text-[10px]">ACTIVE</span>` : ''}
            </div>
            <div class="game-panel-body">
                ${!league || league.completed ? `
                    <div class="text-center py-4 space-y-3">
                        ${league && league.completed ? `
                            <div class="text-sm text-amber-400 font-semibold">Season ${league.season} Complete!</div>
                            <div class="text-xs text-slate-400">Start a new season to compete again.</div>
                        ` : `
                            <div class="text-sm text-slate-400">Join a league to compete against AI teams for prizes!</div>
                        `}
                        <button onclick="doStartLeague()" class="btn-game btn-primary-game py-2.5 px-6 text-sm">
                            Start New Season
                        </button>
                    </div>
                ` : `
                    <!-- Active League -->
                    <div class="space-y-3">
                        <div class="flex items-center justify-between p-2 rounded-lg bg-blue-500/10 border border-blue-500/20">
                            <span class="text-xs text-blue-400">Matchday ${league.currentMatchday}/${league.totalMatchdays}</span>
                            <span class="text-xs font-bold text-white">${league.currentMatchday >= league.totalMatchdays ? 'COMPLETE' : 'IN PROGRESS'}</span>
                        </div>

                        <!-- Standings Table -->
                        <div class="overflow-x-auto">
                            <table class="w-full text-[10px]">
                                <thead>
                                    <tr class="text-slate-500 border-b border-white/[0.06]">
                                        <th class="text-left py-1 px-1">#</th>
                                        <th class="text-left py-1 px-1">Team</th>
                                        <th class="text-center py-1 px-1">P</th>
                                        <th class="text-center py-1 px-1">W</th>
                                        <th class="text-center py-1 px-1">D</th>
                                        <th class="text-center py-1 px-1">L</th>
                                        <th class="text-center py-1 px-1">GD</th>
                                        <th class="text-center py-1 px-1 font-bold">Pts</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${Object.entries(league.standings)
                                        .sort((a, b) => b[1].points - a[1].points || (b[1].gf - b[1].ga) - (a[1].gf - a[1].ga) || b[1].gf - a[1].gf)
                                        .map(([team, st], i) => {
                                            const isPlayer = team === league.playerTeam;
                                            const gd = st.gf - st.ga;
                                            return `
                                            <tr class="${isPlayer ? 'bg-emerald-500/10 font-semibold' : ''} border-b border-white/[0.03]">
                                                <td class="py-1 px-1 ${i === 0 ? 'text-amber-400' : 'text-slate-500'}">${i + 1}</td>
                                                <td class="py-1 px-1 ${isPlayer ? 'text-emerald-400' : 'text-white'}">${esc(team)}${isPlayer ? ' (You)' : ''}</td>
                                                <td class="text-center py-1 px-1 text-slate-400">${st.played}</td>
                                                <td class="text-center py-1 px-1 text-emerald-400">${st.wins}</td>
                                                <td class="text-center py-1 px-1 text-amber-400">${st.draws}</td>
                                                <td class="text-center py-1 px-1 text-red-400">${st.losses}</td>
                                                <td class="text-center py-1 px-1 ${gd > 0 ? 'text-emerald-400' : gd < 0 ? 'text-red-400' : 'text-slate-400'}">${gd > 0 ? '+' : ''}${gd}</td>
                                                <td class="text-center py-1 px-1 font-bold text-white">${st.points}</td>
                                            </tr>`;
                                        }).join('')}
                                </tbody>
                            </table>
                        </div>

                        ${league.currentMatchday < league.totalMatchdays ? `
                            <button onclick="doPlayLeagueMatch()" ${matchCooldown > 0 ? 'disabled' : ''} class="btn-game btn-primary-game w-full py-2.5 text-sm">
                                ${matchCooldown > 0 ? `Cooldown ${Math.ceil(matchCooldown)}s` : `Play Matchday ${league.currentMatchday + 1}`}
                            </button>
                        ` : `
                            <button onclick="doStartLeague()" class="btn-game btn-primary-game w-full py-2.5 text-sm">
                                Start New Season
                            </button>
                        `}
                    </div>
                `}
            </div>
        </div>

        <div class="grid lg:grid-cols-2 gap-4 mt-4">
            <!-- Facilities -->
            <div class="game-panel">
                <div class="game-panel-header">
                    <div class="flex items-center justify-center w-7 h-7 rounded-lg bg-amber-500/10">
                        <svg class="w-3.5 h-3.5 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/></svg>
                    </div>
                    <h3 class="font-semibold text-sm">Facilities</h3>
                </div>
                <div class="game-panel-body space-y-2">
                    <div class="flex items-center justify-between p-2 rounded-lg bg-white/[0.02] border border-white/[0.06]">
                        <div>
                            <div class="text-xs font-semibold text-white">Stadium</div>
                            <div class="text-[10px] text-slate-400">+25% match rewards per level</div>
                        </div>
                        <div class="flex items-center gap-2">
                            <span class="text-xs text-emerald-400">Lv.${facilities.stadium || 0}</span>
                            ${(facilities.stadium || 0) < 5 ? `
                                <button onclick="doUpgradeFacility('stadium')" class="btn-game btn-secondary-game py-1 px-2 text-[10px]">
                                    ${fmt(facilityCosts.stadium || 0)}
                                </button>
                            ` : `<span class="text-[10px] text-amber-400">MAX</span>`}
                        </div>
                    </div>
                    <div class="flex items-center justify-between p-2 rounded-lg bg-white/[0.02] border border-white/[0.06]">
                        <div>
                            <div class="text-xs font-semibold text-white">Training Ground</div>
                            <div class="text-[10px] text-slate-400">-30s training cooldown per level</div>
                        </div>
                        <div class="flex items-center gap-2">
                            <span class="text-xs text-emerald-400">Lv.${facilities.training || 0}</span>
                            ${(facilities.training || 0) < 5 ? `
                                <button onclick="doUpgradeFacility('training')" class="btn-game btn-secondary-game py-1 px-2 text-[10px]">
                                    ${fmt(facilityCosts.training || 0)}
                                </button>
                            ` : `<span class="text-[10px] text-amber-400">MAX</span>`}
                        </div>
                    </div>
                    <div class="flex items-center justify-between p-2 rounded-lg bg-white/[0.02] border border-white/[0.06]">
                        <div>
                            <div class="text-xs font-semibold text-white">Youth Academy</div>
                            <div class="text-[10px] text-slate-400">Bonus young player chance</div>
                        </div>
                        <div class="flex items-center gap-2">
                            <span class="text-xs text-emerald-400">Lv.${facilities.youth || 0}</span>
                            ${(facilities.youth || 0) < 5 ? `
                                <button onclick="doUpgradeFacility('youth')" class="btn-game btn-secondary-game py-1 px-2 text-[10px]">
                                    ${fmt(facilityCosts.youth || 0)}
                                </button>
                            ` : `<span class="text-[10px] text-amber-400">MAX</span>`}
                        </div>
                    </div>
                </div>
            </div>

            <!-- Match History -->
            <div class="game-panel">
                <div class="game-panel-header">
                    <div class="flex items-center justify-center w-7 h-7 rounded-lg bg-slate-500/10">
                        <svg class="w-3.5 h-3.5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                    </div>
                    <h3 class="font-semibold text-sm">Recent Matches</h3>
                </div>
                <div class="game-panel-body space-y-1.5 max-h-[200px] overflow-y-auto">
                    ${matchHistory.length > 0 ? matchHistory.slice().reverse().map(m => `
                        <div class="flex items-center gap-2 p-1.5 rounded bg-white/[0.02] text-[10px]">

/* Show batch training modal */
let selectedTrainingPlayers = [];
function showBatchTraining() {
    selectedTrainingPlayers = [];
    const players = S.players || [];
    const cooldowns = S.playerTrainingCooldowns || {};
    const now = Date.now() / 1000;
    const maxTrainable = Math.max(1, Math.floor(players.length * 3 / 11));

    const availablePlayers = players.filter(p => {
        const onCooldown = cooldowns[p.id] && cooldowns[p.id] > now;
        return !onCooldown;
    });

    if (availablePlayers.length === 0) {
        showModal('No Players Available', `
            <div class="text-center py-4">
                <p class="text-sm text-slate-400">All players are on training cooldown.</p>
            </div>
        `);
        return;
    }

    const trainingTypes = S.trainingTypes || {};

    showModal('Batch Training', `
        <div class="space-y-3">
            <div class="flex items-center justify-between p-2 rounded-lg bg-blue-500/10 border border-blue-500/20">
                <span class="text-xs text-blue-400">Select up to ${maxTrainable} players</span>
                <span id="batch-train-count" class="text-xs font-bold text-white">0/${maxTrainable}</span>
            </div>

            <div class="space-y-2 max-h-64 overflow-y-auto" id="batch-train-players">
                ${availablePlayers.map(p => {
                    const flag = nationalityFlags[p.nationality] || '&#127760;';
                    return `
                        <div onclick="toggleTrainingPlayer('${p.id}', ${maxTrainable})" id="train-player-${p.id}" class="flex items-center gap-3 p-2 rounded-lg bg-white/[0.02] border border-white/[0.06] hover:bg-white/[0.04] cursor-pointer transition-colors">
                            <input type="checkbox" class="w-4 h-4 rounded border-white/20 bg-white/5" disabled>
                            <div class="flex-1">
                                <div class="text-xs font-semibold text-white flex items-center gap-1.5">
                                    ${esc(p.name)}
                                    <span class="text-[10px]">${flag}</span>
                                </div>
                                <div class="text-[10px] text-slate-400">${p.position} | ${(p.stats||{}).overall||'?'} OVR</div>
                            </div>
                        </div>
                    `;
                }).join('')}
            </div>

            <div class="space-y-2">
                <label class="text-xs text-slate-400">Training Type</label>
                <select id="batch-training-type" class="form-input-game text-sm py-2">
                    ${Object.entries(trainingTypes).map(([key, t]) => `
                        <option value="${key}">${esc(t.name)} - ${fmt(t.cost)}</option>
                    `).join('')}
                </select>
            </div>

            <button onclick="doBatchTrain(${maxTrainable})" class="btn-game btn-primary-game w-full py-3 text-sm">
                Train Selected Players
            </button>
        </div>
    `);
}

function toggleTrainingPlayer(playerId, maxTrainable) {
    const idx = selectedTrainingPlayers.indexOf(playerId);
    if (idx >= 0) {
        selectedTrainingPlayers.splice(idx, 1);
    } else {
        if (selectedTrainingPlayers.length >= maxTrainable) {
            showToast(`Can only train ${maxTrainable} players at once`, 'error');
            return;
        }
        selectedTrainingPlayers.push(playerId);
    }

    // Update UI
    const el = document.getElementById(`train-player-${playerId}`);
    if (el) {
        const checkbox = el.querySelector('input[type="checkbox"]');
        if (checkbox) checkbox.checked = idx < 0;
        if (idx < 0) {
            el.classList.add('border-emerald-500/40', 'bg-emerald-500/5');
        } else {
            el.classList.remove('border-emerald-500/40', 'bg-emerald-500/5');
        }
    }

    // Update count
    const countEl = document.getElementById('batch-train-count');
    if (countEl) countEl.textContent = `${selectedTrainingPlayers.length}/${maxTrainable}`;
}

async function doBatchTrain(maxTrainable) {
    if (selectedTrainingPlayers.length === 0) {
        showToast('Select at least one player', 'error');
        return;
    }

    const trainingType = document.getElementById('batch-training-type')?.value;
    if (!trainingType) {
        showToast('Select a training type', 'error');
        return;
    }

    const { data } = await api('/api/club/train-batch', { method: 'POST', body: { playerIds: selectedTrainingPlayers, trainingType } });
    if (data.error) {
        showToast(data.error, 'error');
        return;
    }

    if (data.state) { S = data.state; }
    removeModal();
    if (data.trained) {
        showToast(`Successfully trained ${data.trained} player(s)!`, 'success');
    }
    renderFull();
}
