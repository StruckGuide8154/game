<!-- Main Render Functions -->
<script>
let lastRenderedTab = null;
let shellBuilt = false;

/* Full render - only called on tab switch or initial load */
function renderFull() {
    if (currentScreen === 'loading') { renderLoading(); return; }
    if (currentScreen === 'login') { window.location.href = '/login'; return; }
    renderGameShell();
    processNotifications();
    shellBuilt = true;
    lastRenderedTab = currentTab;
}

/* Targeted update - called every 1s poll, never rebuilds DOM */
function updateUI() {
    if (currentScreen !== 'game') return;
    if (document.getElementById('modal')) return;
    if (document.getElementById('event-popup-overlay')) return;
    if (!shellBuilt || lastRenderedTab !== currentTab) { renderFull(); return; }
    updateStatsBar();
    if (currentTab === 'game') {
        updateTransferMarket();
        updateClientsPanel();
        updateUpgradesPanel();
        updateActionsPanel();
        updateFooter();
    } else if (currentTab === 'payments') {
        updatePaymentsPage();
    } else if (currentTab === 'club') {
        updateClubPanel();
    } else if (currentTab === 'market') {
        /* Market re-renders on full only */
    } else if (currentTab === 'admin') {
        updateAdminPanel();
    }
    processNotifications();
    checkEventPopup();
    checkOfflineEarnings();
}

/* Alias for backwards compat */
function render() { renderFull(); }

function renderLoading() {
    document.getElementById('app').innerHTML = `
        <div class="min-h-screen flex items-center justify-center">
            <div class="text-center animate-scale-in">
                <div class="inline-flex items-center justify-center w-20 h-20 rounded-2xl bg-emerald-500/10 border border-emerald-500/20 mb-4">
                    <span class="text-4xl">&#9917;</span>
                </div>
                <div class="font-display text-xl font-bold tracking-wider text-white mb-1">LOADING</div>
                <div class="w-32 h-1 mx-auto rounded-full bg-white/10 overflow-hidden mt-3">
                    <div class="h-full bg-emerald-500 rounded-full shimmer" style="width: 60%"></div>
                </div>
            </div>
        </div>`;
}

function renderGameShell() {
    const app = document.getElementById('app');
    let content = '';
    content += renderNavbar();

    if (currentTab === 'game') {
        content += renderStatsBar();
        content += renderGameContent();
        content += renderFooter();
    } else if (currentTab === 'payments') {
        content += renderStatsBar();
        content += renderPaymentsPage();
    } else if (currentTab === 'club') {
        content += renderStatsBar();
        content += renderClubPage();
    } else if (currentTab === 'market') {
        content += renderStatsBar();
        content += renderMarketPage();
    } else if (currentTab === 'admin') {
        content += renderStatsBar();
        content += renderAdminPage();
    }

    app.innerHTML = content;
}

function renderGameContent() {
    const s = S;
    const markets = s.unlockedMarkets || [];

    return `
    <div class="grid lg:grid-cols-12 gap-4 animate-float-in" style="animation-delay: 0.1s">
        <!-- Left Column: Transfer + Actions -->
        <div class="lg:col-span-3 space-y-4">
            ${renderTransferMarket()}
            ${renderActionsPanel()}
        </div>

        <!-- Center Column: Upgrades -->
        <div class="lg:col-span-5">
            ${renderUpgradesPanel()}
        </div>

        <!-- Right Column: Clients -->
        <div class="lg:col-span-4">
            ${renderClientsPanel()}
        </div>
    </div>`;
}

/* --- Helper: safely set innerHTML only if content changed --- */
function _patch(id, html) {
    const el = document.getElementById(id);
    if (!el) return false;
    if (el.dataset.hash !== undefined) {
        const h = _simpleHash(html);
        if (el.dataset.hash === h) return false;
        el.dataset.hash = h;
    }
    el.innerHTML = html;
    return true;
}

function _setText(id, text) {
    const el = document.getElementById(id);
    if (el && el.textContent !== text) el.textContent = text;
}

function _simpleHash(s) {
    let h = 0;
    for (let i = 0; i < s.length; i++) { h = ((h << 5) - h + s.charCodeAt(i)) | 0; }
    return String(h);
}
</script>
