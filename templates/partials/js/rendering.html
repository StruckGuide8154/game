<!-- Main Render Functions -->
<script>
function render() {
    if (currentScreen === 'loading') { renderLoading(); return; }
    if (currentScreen === 'login') { window.location.href = '/login'; return; }
    renderGameShell();
    processNotifications();
}

function renderLoading() {
    document.getElementById('app').innerHTML = `
        <div class="min-h-screen flex items-center justify-center">
            <div class="text-center animate-scale-in">
                <div class="inline-flex items-center justify-center w-20 h-20 rounded-2xl bg-emerald-500/10 border border-emerald-500/20 mb-4">
                    <span class="text-4xl">&#9917;</span>
                </div>
                <div class="font-display text-xl font-bold tracking-wider text-white mb-1">LOADING</div>
                <div class="w-32 h-1 mx-auto rounded-full bg-white/10 overflow-hidden mt-3">
                    <div class="h-full bg-emerald-500 rounded-full shimmer" style="width: 60%"></div>
                </div>
            </div>
        </div>`;
}

function renderGameShell() {
    const app = document.getElementById('app');
    let content = '';

    // Navbar
    content += renderNavbar();

    if (currentTab === 'game') {
        content += renderStatsBar();
        content += renderGameContent();
        content += renderFooter();
    } else if (currentTab === 'payments') {
        content += renderPaymentsPage();
    }

    app.innerHTML = content;
}

function renderGameContent() {
    const s = S;
    const markets = s.unlockedMarkets || [];

    return `
    <div class="grid lg:grid-cols-12 gap-4 animate-float-in" style="animation-delay: 0.1s">
        <!-- Left Column: Transfer + Actions + Markets -->
        <div class="lg:col-span-3 space-y-4">
            ${renderTransferMarket()}
            ${renderActionsPanel()}

            <!-- Markets Panel -->
            <div class="game-panel hover-lift">
                <div class="game-panel-header">
                    <div class="flex items-center justify-center w-8 h-8 rounded-lg bg-blue-500/10">
                        <svg class="w-4 h-4 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 014 10 15.3 15.3 0 01-4 10 15.3 15.3 0 01-4-10 15.3 15.3 0 014-10z"/></svg>
                    </div>
                    <h3 class="font-semibold text-sm">Markets</h3>
                </div>
                <div class="game-panel-body space-y-1.5">
                    ${markets.map((m, i) => `
                        <div class="flex items-center justify-between py-1.5 px-2 rounded-lg ${i === markets.length-1 ? 'bg-white/[0.03]' : ''}">
                            <span class="text-xs ${m.color} font-medium">${esc(m.name)}</span>
                            <span class="text-[10px] text-slate-600">${m.multiplier}x</span>
                        </div>
                    `).join('')}
                </div>
            </div>
        </div>

        <!-- Center Column: Upgrades -->
        <div class="lg:col-span-5">
            ${renderUpgradesPanel()}
        </div>

        <!-- Right Column: Clients -->
        <div class="lg:col-span-4">
            ${renderClientsPanel()}
        </div>
    </div>`;
}
</script>
