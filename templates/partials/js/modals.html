<!-- Modal System -->
<script>
function showScoutModal(players) {
    removeModal();
    const overlay = document.createElement('div');
    overlay.id = 'modal';
    overlay.className = 'modal-overlay';
    overlay.onclick = (e) => { if (e.target === overlay) removeModal(); };

    overlay.innerHTML = `
        <div class="modal-content bg-gradient-to-br from-[#0a1a2e] to-[#0d2818]">
            <div class="p-6 border-b border-white/[0.06]">
                <div class="flex justify-between items-center">
                    <div class="flex items-center gap-3">
                        <div class="flex items-center justify-center w-10 h-10 rounded-xl bg-emerald-500/10 border border-emerald-500/20">
                            <svg class="w-5 h-5 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
                        </div>
                        <div>
                            <h2 class="text-lg font-bold text-white">Scouted Players</h2>
                            <p class="text-xs text-slate-500">${players.length} talent(s) found</p>
                        </div>
                    </div>
                    <button onclick="removeModal()" class="w-8 h-8 flex items-center justify-center rounded-lg bg-white/[0.05] hover:bg-white/[0.1] text-slate-400 hover:text-white transition-game">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                    </button>
                </div>
            </div>
            <div class="p-6 space-y-3 max-h-[60vh] overflow-y-auto">
                ${players.length === 0 ? `
                    <div class="text-center py-8">
                        <p class="text-slate-400 mb-3">All players declined. Try again!</p>
                        <button onclick="doScout()" class="btn-game btn-primary-game py-2 px-6 text-sm">Scout Again</button>
                    </div>
                ` : players.map(p => {
                    const flag = nationalityFlags[p.nationality] || '&#127760;';
                    return `
                    <div class="p-4 rounded-xl bg-white/[0.03] border ${p.demanded ? 'border-red-500/20' : 'border-emerald-500/10'} transition-game hover:bg-white/[0.05]">
                        <div class="flex items-start justify-between mb-3">
                            <div class="flex items-center gap-3">
                                <div class="w-3 h-3 rounded-full ${p.color}"></div>
                                <div>
                                    <div class="font-semibold text-white flex items-center gap-1.5">
                                        ${esc(p.name)}
                                        <span class="text-sm">${flag}</span>
                                    </div>
                                    <div class="text-xs text-slate-500">${esc(p.tier)}</div>
                                </div>
                            </div>
                            <div class="text-right">
                                <div class="text-sm font-medium text-emerald-400">${fmt(p.value * p.multiplier)}/s</div>
                            </div>
                        </div>
                        <div class="grid grid-cols-2 gap-2 mb-3">
                            <div class="text-xs p-2 rounded-lg bg-white/[0.02]">
                                <span class="text-slate-500">Rep needed: </span>
                                <span class="${(S.reputation||0)>=p.repRequired?'text-emerald-400':'text-red-400'}">${p.repRequired}</span>
                            </div>
                            <div class="text-xs p-2 rounded-lg bg-white/[0.02]">
                                <span class="text-slate-500">Chance: </span>
                                <span class="${p.acceptanceChance>=70?'text-emerald-400':p.acceptanceChance>=40?'text-amber-400':'text-red-400'}">${p.acceptanceChance}%</span>
                            </div>
                        </div>
                        <div class="progress-bar mb-3">
                            <div class="progress-fill ${p.acceptanceChance>=70?'bg-emerald-500':p.acceptanceChance>=40?'bg-amber-500':'bg-red-500'}" style="width:${p.acceptanceChance}%"></div>
                        </div>
                        <button onclick="doSign('${p.id}')" class="btn-game ${p.demanded ? 'btn-danger-game' : 'btn-primary-game'} w-full py-2.5 text-sm">
                            ${p.demanded ? 'Try Anyway (Risky)' : 'Offer Representation'}
                        </button>
                    </div>`;
                }).join('')}
            </div>
            <div class="p-4 border-t border-white/[0.06]">
                <button onclick="doScout()" class="btn-game btn-secondary-game w-full py-2.5 text-sm">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
                    Refresh Scout List
                </button>
            </div>
        </div>`;
    document.body.appendChild(overlay);
}

function showTransferModal(deals) {
    removeModal();
    const overlay = document.createElement('div');
    overlay.id = 'modal';
    overlay.className = 'modal-overlay';
    overlay.onclick = (e) => { if (e.target === overlay) removeModal(); };

    overlay.innerHTML = `
        <div class="modal-content bg-gradient-to-br from-[#1a0a2e] to-[#0a1628]">
            <div class="p-6 border-b border-white/[0.06]">
                <div class="flex justify-between items-center">
                    <div class="flex items-center gap-3">
                        <div class="flex items-center justify-center w-10 h-10 rounded-xl bg-purple-500/10 border border-purple-500/20">
                            <svg class="w-5 h-5 text-purple-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
                        </div>
                        <div>
                            <h2 class="text-lg font-bold text-white">Transfer Window</h2>
                            <p class="text-xs text-slate-500">${deals.length} deal(s) available</p>
                        </div>
                    </div>
                    <button onclick="removeModal()" class="w-8 h-8 flex items-center justify-center rounded-lg bg-white/[0.05] hover:bg-white/[0.1] text-slate-400 hover:text-white transition-game">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                    </button>
                </div>
            </div>
            <div class="p-6 space-y-3 max-h-[60vh] overflow-y-auto">
                ${deals.length === 0 ? `
                    <div class="text-center py-8">
                        <p class="text-slate-400 mb-3">No deals available right now</p>
                        <button onclick="removeModal()" class="btn-game btn-secondary-game py-2 px-6 text-sm">Close</button>
                    </div>
                ` : deals.map(d => `
                    <div class="p-4 rounded-xl bg-white/[0.03] border ${d.type==='transfer' ? 'border-emerald-500/10' : 'border-blue-500/10'} transition-game hover:bg-white/[0.05]">
                        <div class="flex items-center gap-2 mb-2">
                            <span class="badge ${d.type==='transfer' ? 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20' : 'bg-blue-500/10 text-blue-400 border border-blue-500/20'} text-[10px]">
                                ${d.type==='transfer' ? 'TRANSFER' : 'RENEWAL'}
                            </span>
                            <span class="text-[10px] text-slate-600">${esc(d.league || '')}</span>
                        </div>
                        <div class="flex items-start justify-between mb-3">
                            <div>
                                <div class="font-semibold text-white">${esc(d.playerName)}</div>
                                <div class="text-xs text-slate-500">${esc(d.playerTier)}</div>
                            </div>
                            <div class="text-right">
                                <div class="text-xs text-slate-500">Commission</div>
                                <div class="text-lg font-bold text-amber-400">${fmt(d.commission)}</div>
                            </div>
                        </div>
                        <div class="grid grid-cols-2 gap-2 mb-3">
                            <div class="text-xs p-2 rounded-lg bg-white/[0.02]">
                                <div class="text-slate-500 mb-0.5">Club</div>
                                <div class="font-medium text-white">${esc(d.club)}</div>
                            </div>
                            <div class="text-xs p-2 rounded-lg bg-white/[0.02]">
                                <div class="text-slate-500 mb-0.5">${d.type==='transfer' ? 'Fee' : 'Value'}</div>
                                <div class="font-medium text-emerald-400">${fmt(d.transferFee)}</div>
                            </div>
                        </div>
                        <button onclick="doDeal('${d.id}')" class="btn-game ${d.type==='transfer' ? 'btn-primary-game' : 'btn-secondary-game border-blue-500/30'} w-full py-2.5 text-sm">
                            ${d.type==='transfer' ? 'Complete Transfer' : 'Sign Contract'}
                        </button>
                    </div>
                `).join('')}
            </div>
        </div>`;
    document.body.appendChild(overlay);
}

function removeModal() {
    const m = document.getElementById('modal');
    if (m) m.remove();
}
</script>
