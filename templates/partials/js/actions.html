<!-- Action Handlers -->
<script>
async function doLogout() {
    stopPoll();
    await api('/api/logout', { method: 'POST' });
    currentUser = null;
    S = {};
    window.location.href = '/login';
}

async function fetchState() {
    const { data } = await api('/api/state');
    S = data;
    checkEventPopup();
}

async function doScout() {
    const { data } = await api('/api/scout', { method: 'POST', body: {} });
    if (data.players) showScoutModal(data.players);
    else if (data.state) { S = data.state; renderFull(); }
}

async function doSign(playerId) {
    const { data } = await api('/api/sign', { method: 'POST', body: { playerId } });
    if (data.state) S = data.state;
    if (data.signed) {
        removeModal();
        renderFull();
    } else {
        if (S.scoutedPlayers && S.scoutedPlayers.length > 0) {
            showScoutModal(S.scoutedPlayers);
        } else {
            showScoutModal([]);
        }
        renderFull();
    }
}

async function doUpgrade(key) {
    const { data } = await api('/api/upgrade', { method: 'POST', body: { upgrade: key } });
    if (data.state) { S = data.state; renderFull(); }
}

async function doHireAgent() {
    const { data } = await api('/api/hire-agent', { method: 'POST', body: {} });
    if (data.state) { S = data.state; renderFull(); }
}

async function doOpenTransfers() {
    const { data } = await api('/api/transfer-window', { method: 'POST', body: {} });
    if (data.deals) showTransferModal(data.deals);
    if (data.state) S = data.state;
}

async function doDeal(dealId) {
    const { data } = await api('/api/complete-deal', { method: 'POST', body: { dealId } });
    if (data.state) S = data.state;
    if ((S.availableDeals || []).length > 0) {
        showTransferModal(S.availableDeals);
    } else {
        removeModal();
    }
    renderFull();
}

async function doToggleAutoSign() {
    const { data } = await api('/api/toggle-autosign', { method: 'POST', body: {} });
    if (data.error) { showToast(data.error, 'error'); }
    if (data.state) { S = data.state; renderFull(); }
}

async function doToggleAutoPay() {
    const { data } = await api('/api/toggle-autopay', { method: 'POST', body: {} });
    if (data.state) { S = data.state; renderFull(); }
}

async function doPayExpense(expenseId) {
    const { data } = await api('/api/pay-expense', { method: 'POST', body: { expenseId } });
    if (data.error) { showToast(data.error, 'error'); }
    if (data.state) { S = data.state; renderFull(); }
}

async function doFire(playerId) {
    if (!confirm('Release this client? This cannot be undone.')) return;
    const { data } = await api('/api/fire-player', { method: 'POST', body: { playerId } });
    if (data.state) { S = data.state; renderFull(); }
}

async function doSave() {
    await api('/api/save', { method: 'POST', body: {} });
    showToast('Game saved', 'success');
}

async function doReset() {
    if (!confirm('Reset ALL progress? This cannot be undone!')) return;
    const { data } = await api('/api/reset', { method: 'POST', body: {} });
    if (data.state) { S = data.state; renderFull(); }
}

/* Club actions */
async function doSetFormation(f) {
    const { data } = await api('/api/set-formation', { method: 'POST', body: { formation: f } });
    if (data.state) { S = data.state; renderFull(); }
}

async function doSetClubName() {
    const input = document.getElementById('club-name-input');
    if (!input) return;
    const name = input.value.trim();
    if (!name) { showToast('Enter a club name', 'error'); return; }
    const { data } = await api('/api/set-club-name', { method: 'POST', body: { name } });
    if (data.state) { S = data.state; renderFull(); }
}

async function doActivateClub() {
    const { data } = await api('/api/activate-club', { method: 'POST', body: {} });
    if (data.error) { showToast(data.error, 'error'); return; }
    if (data.state) { S = data.state; renderFull(); }
}

/* Admin actions */
async function doAdminSetTier(playerId, tier) {
    const { data } = await api('/api/admin/set-tier', { method: 'POST', body: { playerId, tier } });
    if (data.error) { showToast(data.error, 'error'); return; }
    if (data.state) { S = data.state; renderFull(); }
}

async function doAdminAddMoney() {
    const input = document.getElementById('admin-money-input');
    if (!input) return;
    const amount = parseFloat(input.value);
    if (isNaN(amount) || amount <= 0) { showToast('Enter a valid amount', 'error'); return; }
    const { data } = await api('/api/admin/add-money', { method: 'POST', body: { amount } });
    if (data.state) { S = data.state; renderFull(); }
    input.value = '';
}

async function doAdminSetReputation() {
    const input = document.getElementById('admin-rep-input');
    if (!input) return;
    const rep = parseFloat(input.value);
    if (isNaN(rep) || rep < 0) { showToast('Enter a valid reputation', 'error'); return; }
    const { data } = await api('/api/admin/set-reputation', { method: 'POST', body: { reputation: rep } });
    if (data.state) { S = data.state; renderFull(); }
    input.value = '';
}

/* William VIP bonus */
function showWilliamBonus() {
    const lastClaim = S.lastVipClaim || 0;
    const now = S.serverTime || (Date.now() / 1000);
    const hoursPassed = (now - lastClaim) / 3600;
    const canClaim = hoursPassed >= 1;
    const nextClaimIn = canClaim ? 0 : Math.ceil((1 - hoursPassed) * 60);

    showModal('VIP Bonus', `
        <div class="text-center space-y-4">
            <div class="w-16 h-16 mx-auto rounded-full bg-gradient-to-br from-amber-500 to-yellow-500 flex items-center justify-center">
                <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
                </svg>
            </div>
            <div>
                <div class="text-lg font-bold text-amber-400">VIP Hourly Bonus</div>
                <div class="text-sm text-slate-400">Claim $5,000 once per hour</div>
            </div>
            ${canClaim ? `
                <button onclick="claimVipBonus()" class="btn-game btn-primary-game w-full py-3 text-sm">
                    Claim $5,000
                </button>
            ` : `
                <div class="p-4 rounded-xl bg-white/[0.02] border border-white/[0.06]">
                    <div class="text-sm text-slate-400">Next claim available in</div>
                    <div class="text-2xl font-bold text-amber-400">${nextClaimIn} minutes</div>
                </div>
            `}
        </div>
    `);
}

async function claimVipBonus() {
    const { data } = await api('/api/vip-bonus', { method: 'POST', body: {} });
    if (data.error) {
        showToast(data.error, 'error');
        return;
    }
    if (data.state) { S = data.state; }
    removeModal();
    showToast('Claimed $5,000 VIP bonus!', 'success');
    renderFull();
}

/* =========== Admin User Management =========== */
let userSearchTimeout = null;

async function handleUserSearch(query) {
    clearTimeout(userSearchTimeout);
    const resultsDiv = document.getElementById('user-search-results');
    if (!resultsDiv) return;

    if (query.length < 1) {
        resultsDiv.classList.add('hidden');
        return;
    }

    userSearchTimeout = setTimeout(async () => {
        const { data } = await api(`/api/admin/search-users?q=${encodeURIComponent(query)}`);
        if (data.users && data.users.length > 0) {
            resultsDiv.innerHTML = data.users.map(u => `
                <div class="px-3 py-2 hover:bg-white/[0.05] cursor-pointer flex items-center justify-between"
                     onclick="selectUserForAdmin(${u.id}, '${esc(u.username)}')">
                    <div>
                        <span class="text-sm text-white">${esc(u.username)}</span>
                        ${u.isAdmin ? '<span class="ml-1.5 text-[9px] px-1.5 py-0.5 rounded bg-amber-500/20 text-amber-400">ADMIN</span>' : ''}
                    </div>
                    <span class="text-[10px] text-slate-500">${new Date(u.createdAt * 1000).toLocaleDateString()}</span>
                </div>
            `).join('');
            resultsDiv.classList.remove('hidden');
        } else {
            resultsDiv.innerHTML = '<div class="px-3 py-2 text-sm text-slate-500">No users found</div>';
            resultsDiv.classList.remove('hidden');
        }
    }, 200);
}

function showUserSuggestions() {
    const input = document.getElementById('admin-user-search');
    if (input && input.value.length >= 1) {
        handleUserSearch(input.value);
    }
}

document.addEventListener('click', (e) => {
    const resultsDiv = document.getElementById('user-search-results');
    const searchInput = document.getElementById('admin-user-search');
    if (resultsDiv && searchInput && !searchInput.contains(e.target) && !resultsDiv.contains(e.target)) {
        resultsDiv.classList.add('hidden');
    }
});

async function selectUserForAdmin(userId, username) {
    document.getElementById('user-search-results')?.classList.add('hidden');
    adminSelectedUser = { id: userId, username: username };
    await loadUserDetails(userId);
}

async function selectUserFromLeaderboard(userId, username) {
    adminSelectedUser = { id: userId, username: username };
    await loadUserDetails(userId);
    switchAdminTab('users');
}

async function loadUserDetails(userId) {
    const { data } = await api(`/api/admin/user-stats/${userId}`);
    if (data.error) {
        showToast(data.error, 'error');
        return;
    }
    adminSelectedUser = { id: data.user.id, username: data.user.username };
    adminSelectedUserStats = data;
    renderFull();
}

async function loadLeaderboard() {
    const { data } = await api('/api/admin/leaderboard');
    if (data.leaderboard) {
        adminLeaderboardData = data.leaderboard;
        renderFull();
    }
}

async function loadPlaytime() {
    const { data } = await api('/api/admin/playtime');
    if (data.playtime) {
        adminPlaytimeData = data.playtime;
        renderFull();
    }
}

/* Admin: Set Balance for selected user */
async function doAdminSetBalance() {
    if (!adminSelectedUser) { showToast('Select a user first', 'error'); return; }
    const input = document.getElementById('admin-user-balance');
    if (!input) return;
    const amount = parseFloat(input.value);
    if (isNaN(amount) || amount < 0) { showToast('Enter a valid amount', 'error'); return; }
    const { data } = await api('/api/admin/set-balance', { method: 'POST', body: { userId: adminSelectedUser.id, amount } });
    if (data.error) { showToast(data.error, 'error'); return; }
    showToast(`Balance set to ${fmt(amount)}`, 'success');
    await loadUserDetails(adminSelectedUser.id);
}

/* Admin: Set Reputation for selected user */
async function doAdminSetUserReputation() {
    if (!adminSelectedUser) { showToast('Select a user first', 'error'); return; }
    const input = document.getElementById('admin-user-rep');
    if (!input) return;
    const rep = parseFloat(input.value);
    if (isNaN(rep) || rep < 0) { showToast('Enter valid reputation', 'error'); return; }
    const { data } = await api('/api/admin/set-user-reputation', { method: 'POST', body: { userId: adminSelectedUser.id, reputation: rep } });
    if (data.error) { showToast(data.error, 'error'); return; }
    showToast(`Reputation set to ${Math.floor(rep)}`, 'success');
    await loadUserDetails(adminSelectedUser.id);
}

/* Admin: Add Player to selected user */
async function doAdminAddPlayer(tier) {
    if (!adminSelectedUser) { showToast('Select a user first', 'error'); return; }
    const { data } = await api('/api/admin/add-player', { method: 'POST', body: { userId: adminSelectedUser.id, tier } });
    if (data.error) { showToast(data.error, 'error'); return; }
    showToast(`Added ${data.player.name} (${tier})`, 'success');
    await loadUserDetails(adminSelectedUser.id);

/* Admin: Remove Player from selected user */
async function doAdminRemovePlayer(playerId, playerName) {
    if (!adminSelectedUser) return;
    if (!confirm(`Remove ${playerName} from ${adminSelectedUser.username}?`)) return;
    const { data } = await api('/api/admin/remove-player', { method: 'POST', body: { userId: adminSelectedUser.id, playerId } });
    if (data.error) { showToast(data.error, 'error'); return; }
    showToast(`Removed ${data.removed}`, 'success');
    await loadUserDetails(adminSelectedUser.id);
}

/* Admin: Edit player tier for selected user */
async function doAdminEditPlayerTier(playerId, tier) {
    if (!adminSelectedUser) return;
    const { data } = await api('/api/admin/edit-player', { method: 'POST', body: {
        userId: adminSelectedUser.id, playerId, changes: { tier }
    }});
    if (data.error) { showToast(data.error, 'error'); return; }

/* Admin: Toggle Sponsorship for a player */
async function doAdminToggleSponsorship(playerId) {
    if (!adminSelectedUser) return;
    const { data } = await api('/api/admin/toggle-sponsorship', { method: 'POST', body: { userId: adminSelectedUser.id, playerId } });
    if (data.error) { showToast(data.error, 'error'); return; }
    showToast(data.hasSponsorship ? 'Sponsorship granted' : 'Sponsorship removed', 'success');
    await loadUserDetails(adminSelectedUser.id);
}

/* Admin: Toggle admin status */
async function doAdminToggleUserAdmin() {
    if (!adminSelectedUser) return;
    const { data } = await api('/api/admin/toggle-user-admin', { method: 'POST', body: { userId: adminSelectedUser.id } });
    if (data.error) { showToast(data.error, 'error'); return; }
    showToast(`${data.username} is ${data.isAdmin ? 'now admin' : 'no longer admin'}`, 'success');
    await loadUserDetails(adminSelectedUser.id);
}

/* Admin: Edit Player Stats Modal */
function openEditPlayerModal(playerId) {
    if (!adminSelectedUserStats) return;
    const player = adminSelectedUserStats.players.find(p => p.id === playerId);
    if (!player) return;
    const stats = player.stats || {};

    showModal('Edit Player: ' + player.name, `
        <div class="space-y-4">
            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="text-xs text-slate-400 mb-1 block">Name</label>
                    <input id="edit-p-name" type="text" value="${esc(player.name)}" class="form-input-game w-full text-sm py-1.5" />
                </div>
                <div>
                    <label class="text-xs text-slate-400 mb-1 block">Position</label>
                    <select id="edit-p-position" class="form-input-game w-full text-sm py-1.5">
                        ${positionOptions.map(pos => `<option value="${pos}" ${player.position === pos ? 'selected' : ''}>${pos}</option>`).join('')}
                    </select>
                </div>
                <div>
                    <label class="text-xs text-slate-400 mb-1 block">Value</label>
                    <input id="edit-p-value" type="number" min="1" value="${player.value}" class="form-input-game w-full text-sm py-1.5" />
                </div>
                <div>
                    <label class="text-xs text-slate-400 mb-1 block">Age</label>
                    <input id="edit-p-age" type="number" min="16" max="45" value="${player.age}" class="form-input-game w-full text-sm py-1.5" />
                </div>
            </div>
            <div>
                <label class="text-xs text-slate-400 mb-1 block">Stats</label>
                <div class="grid grid-cols-3 gap-2">
                    ${['pace','shooting','passing','dribbling','defending','physical'].map(sn => `
                        <div>
                            <label class="text-[10px] text-slate-500 block capitalize">${sn}</label>
                            <input id="edit-p-${sn}" type="number" min="1" max="99" value="${stats[sn]||50}" class="form-input-game w-full text-sm py-1" />
                        </div>
                    `).join('')}
                </div>
            </div>
            <button onclick="submitEditPlayer('${playerId}')" class="btn-game btn-primary-game w-full py-2.5 text-sm">Save Changes</button>
        </div>
    `, { maxWidth: 'max-w-md' });
}

async function submitEditPlayer(playerId) {
    if (!adminSelectedUser) return;
    const changes = {
        name: document.getElementById('edit-p-name')?.value || '',
        position: document.getElementById('edit-p-position')?.value || 'CM',
        value: parseInt(document.getElementById('edit-p-value')?.value) || 1,
        age: parseInt(document.getElementById('edit-p-age')?.value) || 22,
        stats: {}
    };
    ['pace','shooting','passing','dribbling','defending','physical'].forEach(sn => {
        changes.stats[sn] = parseInt(document.getElementById('edit-p-' + sn)?.value) || 50;
    });

    const { data } = await api('/api/admin/edit-player', { method: 'POST', body: {
        userId: adminSelectedUser.id, playerId, changes
    }});
    if (data.error) { showToast(data.error, 'error'); return; }
    removeModal();
    showToast('Player updated', 'success');
    await loadUserDetails(adminSelectedUser.id);
}

function confirmDeleteUser(userId, username) {
    if (!confirm(`Are you sure you want to delete "${username}"? This cannot be undone!`)) return;
    deleteUser(userId);
}

async function deleteUser(userId) {
    const { data } = await api('/api/admin/delete-user', { method: 'POST', body: { userId } });
    if (data.error) {
        showToast(data.error, 'error');
        return;
    }
    removeModal();
    adminSelectedUser = null;
    adminSelectedUserStats = null;
    showToast(`Deleted user: ${data.deleted}`, 'success');
    renderFull();
}
</script>
