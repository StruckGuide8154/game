<!-- Boot & Polling -->
<script>
function startPoll() {
    stopPoll();
    /* Fetch from server every 5s, but run local UI update every 1s */
    let fetchCounter = 0;
    pollTimer = setInterval(async () => {
        if (currentScreen !== 'game') return;
        fetchCounter++;
        if (fetchCounter >= 5) {
            fetchCounter = 0;
            prevS = JSON.parse(JSON.stringify(S));
            await fetchState();
        }
        /* Client-side money interpolation between server fetches */
        if (S.earningsPerSecond && fetchCounter > 0) {
            S.money = (S.money || 0) + (S.earningsPerSecond || 0);
            /* Tick down transfer window locally */
            if (S.serverTime) S.serverTime += 1;
        }
        updateUI();
    }, 1000);
}

function stopPoll() {
    if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
}

// Boot
(async function boot() {
    const { data } = await api('/api/me');
    if (data.username) {
        currentUser = data.username;
        csrfToken = data.csrf_token;
        isAdmin = data.isAdmin || false;
        await fetchState();
        currentScreen = 'game';
        startPoll();
    } else {
        csrfToken = data.csrf_token || csrfToken;
        window.location.href = '/login';
        return;
    }
    renderFull();
    // Start tutorial for new players
    if (shouldShowTutorial()) {
        setTimeout(() => startTutorial(), 600);
    }
})();
</script>
