<!-- Boot & Polling -->
<script>
function startPoll() {
    stopPoll();
    /* Fetch from server every 5s, but run local UI update every 1s */
    let fetchCounter = 0;
    pollTimer = setInterval(async () => {
        if (currentScreen !== 'game') return;
        fetchCounter++;
        if (fetchCounter >= 5) {
            fetchCounter = 0;
            prevS = JSON.parse(JSON.stringify(S));
            await fetchState();
        }
        /* Client-side money interpolation between server fetches */
        if (S.earningsPerSecond && fetchCounter > 0) {
            S.money = (S.money || 0) + (S.earningsPerSecond || 0);
            /* Tick down transfer window locally */
            if (S.serverTime) S.serverTime += 1;
        }
        updateUI();
    }, 1000);
}

function stopPoll() {
    if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
}

function showServerMessageModal(message) {
    const overlay = document.createElement('div');
    overlay.id = 'server-msg-overlay';
    overlay.style.cssText = 'position:fixed;inset:0;z-index:20000;display:flex;align-items:center;justify-content:center;padding:1rem;background:rgba(0,0,0,0.85);backdrop-filter:blur(8px);';
    overlay.innerHTML = `
        <div style="max-width:480px;width:100%;background:linear-gradient(135deg,#0f172a,#1e293b);border:2px solid rgba(59,130,246,0.4);border-radius:20px;padding:32px;box-shadow:0 25px 60px rgba(0,0,0,0.6);">
            <div style="display:flex;align-items:center;gap:12px;margin-bottom:16px;">
                <div style="width:40px;height:40px;border-radius:10px;background:rgba(59,130,246,0.15);border:1px solid rgba(59,130,246,0.3);display:flex;align-items:center;justify-content:center;font-size:20px;">&#128226;</div>
                <div>
                    <div style="font-size:14px;font-weight:700;color:#fff;font-family:'Orbitron',sans-serif;">SERVER ANNOUNCEMENT</div>
                    <div style="font-size:11px;color:#64748b;">Message from the Football Agent Empire team</div>
                </div>
            </div>
            <p style="color:#cbd5e1;font-size:14px;line-height:1.7;margin:0 0 20px 0;padding:16px;background:rgba(255,255,255,0.03);border-radius:10px;border:1px solid rgba(255,255,255,0.06);">${message.replace(/</g,'&lt;').replace(/>/g,'&gt;')}</p>
            <button onclick="document.getElementById('server-msg-overlay').remove()" style="width:100%;padding:12px;border-radius:10px;background:linear-gradient(135deg,#3b82f6,#2563eb);border:none;color:#fff;font-size:13px;font-weight:600;cursor:pointer;">Got it!</button>
        </div>`;
    document.body.appendChild(overlay);
}

function showLocationOnboarding() {
    const countries = {
        'england': { name: 'England &#127988;&#917607;&#917602;&#917605;&#917614;&#917607;&#917631;', leagues: ['League Two', 'League One', 'Championship', 'Premier League'] },
        'spain': { name: 'Spain &#127466;&#127480;', leagues: ['Segunda B', 'Segunda Divisi\u00f3n', 'La Liga 2', 'La Liga'] },
        'germany': { name: 'Germany &#127465;&#127466;', leagues: ['3. Liga', '2. Bundesliga', 'Bundesliga'] },
        'france': { name: 'France &#127467;&#127479;', leagues: ['National 2', 'National', 'Ligue 2', 'Ligue 1'] },
        'italy': { name: 'Italy &#127470;&#127481;', leagues: ['Serie C', 'Serie B', 'Serie A'] },
        'portugal': { name: 'Portugal &#127477;&#127481;', leagues: ['Liga 3', 'Liga Portugal 2', 'Primeira Liga'] },
        'netherlands': { name: 'Netherlands &#127475;&#127473;', leagues: ['Eerste Divisie', 'Eredivisie'] },
        'brazil': { name: 'Brazil &#127463;&#127479;', leagues: ['S\u00e9rie D', 'S\u00e9rie C', 'S\u00e9rie B', 'S\u00e9rie A'] },
        'usa': { name: 'USA &#127482;&#127480;', leagues: ['USL League One', 'USL Championship', 'MLS'] },
    };
    let selectedCountry = 'england';
    let selectedLeagueTier = 0;

    function buildLeagueButtons(country) {
        return countries[country].leagues.map((l, i) => `
            <button onclick="selectLeagueTier(${i})" id="lt-btn-${i}" style="padding:8px 12px;border-radius:8px;background:${selectedLeagueTier===i?'rgba(16,185,129,0.2)':'rgba(255,255,255,0.05)'};border:1px solid ${selectedLeagueTier===i?'rgba(16,185,129,0.4)':'rgba(255,255,255,0.1)'};color:${selectedLeagueTier===i?'#10b981':'#94a3b8'};font-size:11px;cursor:pointer;text-align:left;">
                ${l}${i===0?' (Start here)':''}
            </button>`).join('');
    }

    const overlay = document.createElement('div');
    overlay.id = 'location-onboarding';
    overlay.style.cssText = 'position:fixed;inset:0;z-index:20000;display:flex;align-items:center;justify-content:center;padding:1rem;background:rgba(0,0,0,0.95);';
    overlay.innerHTML = `
        <div style="max-width:520px;width:100%;background:linear-gradient(135deg,#0f172a,#1e293b);border:2px solid rgba(16,185,129,0.3);border-radius:20px;padding:32px;box-shadow:0 25px 60px rgba(0,0,0,0.6);">
            <div style="text-align:center;margin-bottom:24px;">
                <div style="font-size:40px;margin-bottom:12px;">&#9917;</div>
                <div style="font-size:18px;font-weight:700;color:#fff;font-family:'Orbitron',sans-serif;margin-bottom:6px;">WHERE IS YOUR AGENCY BASED?</div>
                <div style="font-size:12px;color:#64748b;">Choose your country and starting league. You can rise through the divisions!</div>
            </div>
            <div style="margin-bottom:20px;">
                <label style="font-size:11px;color:#94a3b8;display:block;margin-bottom:8px;text-transform:uppercase;letter-spacing:1px;">Country</label>
                <select id="country-select" onchange="onCountryChange(this.value)" style="width:100%;padding:10px 12px;border-radius:10px;background:#1e293b;border:1px solid rgba(255,255,255,0.1);color:#fff;font-size:13px;">
                    ${Object.entries(countries).map(([k,v]) => `<option value="${k}">${v.name}</option>`).join('')}
                </select>
            </div>
            <div style="margin-bottom:20px;">
                <label style="font-size:11px;color:#94a3b8;display:block;margin-bottom:8px;text-transform:uppercase;letter-spacing:1px;">Starting League</label>
                <div id="league-buttons" style="display:grid;grid-template-columns:1fr 1fr;gap:6px;">${buildLeagueButtons('england')}</div>
            </div>
            <div style="margin-bottom:16px;">
                <label style="font-size:11px;color:#94a3b8;display:block;margin-bottom:8px;text-transform:uppercase;letter-spacing:1px;">City Name (Optional)</label>
                <input id="city-input" type="text" maxlength="30" placeholder="e.g. London, Manchester..." style="width:100%;padding:10px 12px;border-radius:10px;background:#1e293b;border:1px solid rgba(255,255,255,0.1);color:#fff;font-size:13px;box-sizing:border-box;" />
            </div>
            <button onclick="submitLocation()" style="width:100%;padding:14px;border-radius:12px;background:linear-gradient(135deg,#10b981,#059669);border:none;color:#fff;font-size:14px;font-weight:700;cursor:pointer;font-family:'Orbitron',sans-serif;letter-spacing:1px;">START YOUR AGENCY &#8594;</button>
        </div>`;
    document.body.appendChild(overlay);

    window.onCountryChange = function(country) {
        selectedCountry = country;
        selectedLeagueTier = 0;
        document.getElementById('league-buttons').innerHTML = buildLeagueButtons(country);
    };
    window.selectLeagueTier = function(tier) {
        selectedLeagueTier = tier;
        document.getElementById('league-buttons').innerHTML = buildLeagueButtons(selectedCountry);
    };
    window.submitLocation = async function() {
        const city = (document.getElementById('city-input').value || '').trim();
        const { data } = await api('/api/set-location', { method: 'POST', body: { country: selectedCountry, city, leagueTier: selectedLeagueTier } });
        if (data.ok) {
            S = data.state;
            document.getElementById('location-onboarding').remove();
            renderFull();
            if (shouldShowTutorial()) setTimeout(() => startTutorial(), 600);
        }
    };
}

// Boot
(async function boot() {
    const { data } = await api('/api/me');
    if (data.username) {
        currentUser = data.username;
        csrfToken = data.csrf_token;
        isAdmin = data.isAdmin || false;
        await fetchState();
        currentScreen = 'game';
        startPoll();
    } else {
        csrfToken = data.csrf_token || csrfToken;
        window.location.href = '/login';
        return;
    }
    renderFull();

    // Show server announcement if set
    try {
        const { data: msgData } = await api('/api/server-message');
        if (msgData && msgData.message) {
            setTimeout(() => showServerMessageModal(msgData.message), 800);
        }
    } catch(e) {}

    // Show location onboarding for new players
    if (S && !S.locationSet) {
        setTimeout(() => showLocationOnboarding(), 200);
    } else if (shouldShowTutorial()) {
        setTimeout(() => startTutorial(), 600);
    }
})();
</script>
