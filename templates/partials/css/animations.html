<style>
    @keyframes shimmer {
        0% { background-position: -200% 0; }
        100% { background-position: 200% 0; }
    }

    @keyframes pulse-glow {
        0%, 100% { box-shadow: 0 0 15px rgba(16, 185, 129, 0.3), inset 0 1px 0 rgba(255,255,255,0.05); }
        50% { box-shadow: 0 0 30px rgba(16, 185, 129, 0.5), 0 0 60px rgba(16, 185, 129, 0.2), inset 0 1px 0 rgba(255,255,255,0.05); }
    }

    @keyframes float-in {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
    }

    @keyframes slide-in-right {
        from { opacity: 0; transform: translateX(100px); }
        to { opacity: 1; transform: translateX(0); }
    }

    @keyframes slide-out-right {
        from { opacity: 1; transform: translateX(0); }
        to { opacity: 0; transform: translateX(100px); }
    }

    @keyframes fade-in {
        from { opacity: 0; }
        to { opacity: 1; }
    }

    @keyframes scale-in {
        from { opacity: 0; transform: scale(0.95); }
        to { opacity: 1; transform: scale(1); }
    }

    @keyframes count-up {
        from { opacity: 0; transform: translateY(8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    @keyframes border-pulse {
        0%, 100% { border-color: rgba(16, 185, 129, 0.3); }
        50% { border-color: rgba(16, 185, 129, 0.6); }
    }

    @keyframes spin-slow {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
    }

    .animate-float-in { animation: float-in 0.4s ease-out; }
    .animate-slide-in { animation: slide-in-right 0.3s ease-out; }
    .animate-slide-out { animation: slide-out-right 0.3s ease-out forwards; }
    .animate-fade-in { animation: fade-in 0.3s ease-out; }
    .animate-scale-in { animation: scale-in 0.3s ease-out; }
    .animate-pulse-glow { animation: pulse-glow 2s infinite; }
    .animate-border-pulse { animation: border-pulse 2s infinite; }
    .animate-spin-slow { animation: spin-slow 20s linear infinite; }

    /* Smooth transitions for interactive elements */
    .transition-game {
        transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* Hover lift effect */
    .hover-lift {
        transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .hover-lift:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 30px rgba(0,0,0,0.3);
    }

    /* Button press effect */
    .btn-press:active {
        transform: scale(0.97);
    }
</style>
