<style>
    /* ---- Scrollbar ---- */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.2); }

    /* ---- Stat Cards ---- */
    .stat-card {
        background: linear-gradient(135deg, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0.02) 100%);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 12px;
        padding: 1rem 1.25rem;
        position: relative;
        overflow: hidden;
        transition: all 0.25s ease;
    }
    .stat-card::before {
        content: '';
        position: absolute;
        top: 0; left: 0; right: 0;
        height: 2px;
        background: var(--accent-color, var(--accent-emerald));
        opacity: 0.6;
    }
    .stat-card:hover {
        background: linear-gradient(135deg, rgba(255,255,255,0.07) 0%, rgba(255,255,255,0.03) 100%);
        border-color: rgba(255,255,255,0.12);
        transform: translateY(-1px);
    }

    /* ---- Game Panel ---- */
    .game-panel {
        background: linear-gradient(180deg, rgba(255,255,255,0.04) 0%, rgba(255,255,255,0.01) 100%);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 16px;
        overflow: hidden;
    }
    .game-panel-header {
        padding: 1rem 1.25rem;
        border-bottom: 1px solid rgba(255,255,255,0.06);
        display: flex;
        align-items: center;
        gap: 0.5rem;
    }
    .game-panel-body {
        padding: 1rem 1.25rem;
    }

    /* ---- Buttons ---- */
    .btn-game {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        font-weight: 600;
        font-size: 0.875rem;
        border-radius: 10px;
        padding: 0.625rem 1.25rem;
        border: none;
        cursor: pointer;
        transition: all 0.2s ease;
        position: relative;
        overflow: hidden;
    }
    .btn-game:active { transform: scale(0.97); }
    .btn-game:disabled {
        opacity: 0.4;
        cursor: not-allowed;
        transform: none;
    }

    .btn-primary-game {
        background: linear-gradient(135deg, #10b981 0%, #059669 100%);
        color: white;
        box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
    }
    .btn-primary-game:hover:not(:disabled) {
        box-shadow: 0 6px 20px rgba(16, 185, 129, 0.4);
        transform: translateY(-1px);
    }

    .btn-secondary-game {
        background: rgba(255, 255, 255, 0.06);
        color: var(--text-primary);
        border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .btn-secondary-game:hover:not(:disabled) {
        background: rgba(255, 255, 255, 0.1);
        border-color: rgba(255, 255, 255, 0.2);
    }

    .btn-danger-game {
        background: linear-gradient(135deg, #dc2626 0%, #b91c1c 100%);
        color: white;
        box-shadow: 0 4px 15px rgba(220, 38, 38, 0.2);
    }
    .btn-danger-game:hover:not(:disabled) {
        box-shadow: 0 6px 20px rgba(220, 38, 38, 0.3);
    }

    .btn-gold-game {
        background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
        color: white;
        box-shadow: 0 4px 15px rgba(245, 158, 11, 0.25);
    }
    .btn-gold-game:hover:not(:disabled) {
        box-shadow: 0 6px 20px rgba(245, 158, 11, 0.35);
    }

    /* ---- Auth Forms ---- */
    .auth-wrapper {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1rem;
    }
    .auth-card {
        width: 100%;
        max-width: 420px;
        background: linear-gradient(135deg, rgba(255,255,255,0.07) 0%, rgba(255,255,255,0.03) 100%);
        backdrop-filter: blur(20px);
        border: 1px solid rgba(255,255,255,0.1);
        border-radius: 20px;
        padding: 2.5rem;
        box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    }
    .form-input-game {
        width: 100%;
        padding: 0.75rem 1rem;
        background: rgba(0,0,0,0.3);
        border: 1px solid rgba(255,255,255,0.1);
        border-radius: 10px;
        color: white;
        font-size: 0.9375rem;
        font-family: 'Inter', sans-serif;
        transition: all 0.2s ease;
        outline: none;
    }
    .form-input-game:focus {
        border-color: var(--accent-emerald);
        box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.15);
    }
    .form-input-game::placeholder {
        color: var(--text-muted);
    }

    /* ---- Notification Toasts ---- */
    .toast-container {
        position: fixed;
        top: 1rem;
        right: 1rem;
        z-index: 1000;
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
        max-width: 380px;
        pointer-events: none;
    }
    .toast {
        pointer-events: auto;
        padding: 0.75rem 1rem;
        border-radius: 10px;
        backdrop-filter: blur(12px);
        font-size: 0.8125rem;
        font-weight: 500;
        animation: slide-in-right 0.3s ease-out;
        border: 1px solid;
        box-shadow: 0 8px 24px rgba(0,0,0,0.3);
    }
    .toast-success {
        background: rgba(16, 185, 129, 0.15);
        border-color: rgba(16, 185, 129, 0.3);
        color: #6ee7b7;
    }
    .toast-error {
        background: rgba(239, 68, 68, 0.15);
        border-color: rgba(239, 68, 68, 0.3);
        color: #fca5a5;
    }
    .toast-warning {
        background: rgba(245, 158, 11, 0.15);
        border-color: rgba(245, 158, 11, 0.3);
        color: #fcd34d;
    }
    .toast-info {
        background: rgba(59, 130, 246, 0.15);
        border-color: rgba(59, 130, 246, 0.3);
        color: #93c5fd;
    }
    .toast.removing {
        animation: slide-out-right 0.3s ease-out forwards;
    }

    /* ---- Modal ---- */
    .modal-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.6);
        backdrop-filter: blur(6px);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 500;
        padding: 1rem;
        animation: fade-in 0.2s ease-out;
    }
    .modal-content {
        width: 100%;
        max-width: 700px;
        max-height: 85vh;
        overflow-y: auto;
        border-radius: 20px;
        border: 1px solid rgba(255,255,255,0.1);
        box-shadow: 0 25px 80px rgba(0,0,0,0.5);
        animation: scale-in 0.3s ease-out;
    }

    /* ---- Badge/Pill ---- */
    .badge {
        display: inline-flex;
        align-items: center;
        padding: 0.25rem 0.625rem;
        border-radius: 9999px;
        font-size: 0.6875rem;
        font-weight: 600;
        letter-spacing: 0.025em;
    }

    /* ---- Progress Bar ---- */
    .progress-bar {
        width: 100%;
        height: 6px;
        background: rgba(255,255,255,0.1);
        border-radius: 3px;
        overflow: hidden;
    }
    .progress-fill {
        height: 100%;
        border-radius: 3px;
        transition: width 0.5s ease;
    }

    /* ---- Tab Navigation ---- */
    .tab-nav {
        display: flex;
        gap: 0.25rem;
        padding: 0.25rem;
        background: rgba(255,255,255,0.03);
        border-radius: 10px;
        border: 1px solid rgba(255,255,255,0.06);
    }
    .tab-btn {
        flex: 1;
        padding: 0.5rem 0.75rem;
        border-radius: 8px;
        border: none;
        background: transparent;
        color: var(--text-secondary);
        font-size: 0.8125rem;
        font-weight: 500;
        cursor: pointer;
        transition: all 0.2s ease;
        font-family: 'Inter', sans-serif;
    }
    .tab-btn.active {
        background: rgba(16, 185, 129, 0.15);
        color: #6ee7b7;
    }
    .tab-btn:hover:not(.active) {
        color: var(--text-primary);
        background: rgba(255,255,255,0.04);
    }

    /* ---- Hidden helper ---- */
    .hidden { display: none !important; }
</style>
