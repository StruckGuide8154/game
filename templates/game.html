<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Football Agent Empire</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background: linear-gradient(to bottom right, #14532d, #166534, #047857);
            min-height: 100vh;
        }
        .modal-overlay { backdrop-filter: blur(4px); }
        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 0 20px rgba(34, 197, 94, 0.5); }
            50% { box-shadow: 0 0 40px rgba(34, 197, 94, 0.8); }
        }
        .deal-ready { animation: pulse-glow 2s infinite; }
        .login-screen, .signup-screen {
            position: fixed; inset: 0; display: flex;
            align-items: center; justify-content: center;
            background: linear-gradient(to bottom right, #14532d, #166534, #047857);
            z-index: 100;
        }
        .auth-container {
            background: rgba(255,255,255,0.1); backdrop-filter: blur(10px);
            border-radius: 12px; padding: 2rem; width: 100%;
            max-width: 400px; border: 1px solid rgba(255,255,255,0.2);
        }
        .form-input {
            width: 100%; padding: 0.75rem;
            background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.2);
            border-radius: 6px; color: white; font-size: 1rem;
        }
        .form-input:focus { outline: none; border-color: #86efac; }
        .btn-primary {
            width: 100%; padding: 0.875rem;
            background: linear-gradient(to right, #22c55e, #16a34a);
            border: none; border-radius: 6px; color: white;
            font-weight: bold; font-size: 1rem; letter-spacing: 0.05em; cursor: pointer; margin-top: 1rem;
        }
        .btn-primary:hover { background: linear-gradient(to right, #16a34a, #15803d); }
        .btn-primary:disabled { opacity: .5; cursor: not-allowed; }
        .error-box {
            display: none; text-align: center; padding: 0.5rem;
            border-radius: 6px; margin-top: 1rem; font-size: 0.875rem;
            background: rgba(239,68,68,0.2); border: 1px solid #ef4444; color: #fca5a5;
        }
        .success-box {
            display: none; text-align: center; padding: 0.5rem;
            border-radius: 6px; margin-top: 1rem; font-size: 0.875rem;
            background: rgba(34,197,94,0.2); border: 1px solid #22c55e; color: #86efac;
        }
        .hidden { display: none !important; }
    </style>
</head>
<body class="text-white p-4">
    <div id="app" class="max-w-7xl mx-auto"></div>

<script>
// ============================================================
//  Thin client – ALL state comes from the server.
//  No game logic runs here. Every action is an API call.
// ============================================================

let csrfToken = '';
let currentUser = null;
let currentScreen = 'loading'; // loading | login | signup | game
let S = {};            // server state snapshot
let pollTimer = null;

// ---- API helpers ----
async function api(path, opts = {}) {
    const method = opts.method || 'GET';
    const headers = { 'Content-Type': 'application/json' };
    if (method !== 'GET') headers['X-CSRF-Token'] = csrfToken;
    const body = opts.body ? JSON.stringify(opts.body) : undefined;
    const res = await fetch(path, { method, headers, body, credentials: 'same-origin' });
    const json = await res.json();
    if (json.csrf_token) csrfToken = json.csrf_token;
    if (json.state) S = json.state;
    return { status: res.status, data: json };
}

// ---- Formatting ----
function fmt(n) {
    if (n >= 1e9) return `$${(n/1e9).toFixed(2)}B`;
    if (n >= 1e6) return `$${(n/1e6).toFixed(2)}M`;
    if (n >= 1e3) return `$${(n/1e3).toFixed(1)}K`;
    return `$${Math.floor(n)}`;
}

// ---- SVG icons (pure presentation) ----
const icons = {
    dollar:    '<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>',
    star:      '<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>',
    users:     '<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>',
    award:     '<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><circle cx="12" cy="8" r="7"/><polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88"/></svg>',
    trending:  '<svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>',
    handshake: '<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5M2 12l10 5 10-5"/></svg>',
};

const upgradeIcons = {
    scoutingNetwork: '&#x1F50D;',
    negotiationSkills: '&#x1F4BC;',
    officeSpace: '&#x1F3E2;',
    marketingTeam: '&#x1F4C8;',
    legalTeam: '&#x2696;&#xFE0F;',
    mediaConnections: '&#x1F4FA;',
};

// ============================================================
//  RENDER
// ============================================================
function render() {
    if (currentScreen === 'loading') { renderLoading(); return; }
    if (currentScreen === 'login')   { renderLogin(); return; }
    if (currentScreen === 'signup')  { renderSignup(); return; }
    renderGame();
}

function renderLoading() {
    document.getElementById('app').innerHTML = `
        <div class="fixed inset-0 flex items-center justify-center">
            <div class="text-2xl font-bold animate-pulse">Loading...</div>
        </div>`;
}

function renderLogin() {
    document.getElementById('app').innerHTML = `
    <div class="login-screen">
        <div class="auth-container">
            <div style="text-align:center;margin-bottom:2rem">
                <h2 style="font-size:2rem;font-weight:bold;letter-spacing:.05em">&#9917; FOOTBALL AGENT</h2>
                <p style="font-size:1.25rem;color:#86efac;letter-spacing:.1em">EMPIRE</p>
            </div>
            <form id="loginForm" onsubmit="doLogin(event)">
                <div style="margin-bottom:1rem">
                    <label style="display:block;font-size:.75rem;font-weight:bold;letter-spacing:.05em;margin-bottom:.5rem;color:#d1fae5">USERNAME</label>
                    <input type="text" id="lu" class="form-input" required autocomplete="username">
                </div>
                <div style="margin-bottom:1rem">
                    <label style="display:block;font-size:.75rem;font-weight:bold;letter-spacing:.05em;margin-bottom:.5rem;color:#d1fae5">PASSWORD</label>
                    <input type="password" id="lp" class="form-input" required autocomplete="current-password">
                </div>
                <button type="submit" class="btn-primary" id="loginBtn">LOGIN</button>
                <div id="loginErr" class="error-box"></div>
                <div style="text-align:center;margin-top:1rem;font-size:.875rem;color:#d1fae5">
                    Don't have an account? <button type="button" onclick="showScreen('signup')" style="background:none;border:none;color:#86efac;text-decoration:underline;cursor:pointer;font-weight:bold">Sign Up</button>
                </div>
            </form>
        </div>
    </div>`;
}

function renderSignup() {
    document.getElementById('app').innerHTML = `
    <div class="signup-screen">
        <div class="auth-container">
            <h2 style="font-size:2rem;font-weight:bold;text-align:center;margin-bottom:.5rem">&#9917; Create Account</h2>
            <p style="text-align:center;color:#86efac;font-size:.875rem;letter-spacing:.1em;margin-bottom:1.5rem">JOIN THE NETWORK</p>
            <form id="signupForm" onsubmit="doSignup(event)">
                <div style="margin-bottom:1rem">
                    <label style="display:block;font-size:.75rem;font-weight:bold;letter-spacing:.05em;margin-bottom:.5rem;color:#d1fae5">USERNAME</label>
                    <input type="text" id="su" class="form-input" required minlength="3" maxlength="20" autocomplete="username">
                </div>
                <div style="margin-bottom:1rem">
                    <label style="display:block;font-size:.75rem;font-weight:bold;letter-spacing:.05em;margin-bottom:.5rem;color:#d1fae5">PASSWORD</label>
                    <input type="password" id="sp" class="form-input" required minlength="6" autocomplete="new-password">
                    <div style="font-size:.75rem;color:#9ca3af;margin-top:.25rem">Min. 6 characters</div>
                </div>
                <div style="margin-bottom:1rem">
                    <label style="display:block;font-size:.75rem;font-weight:bold;letter-spacing:.05em;margin-bottom:.5rem;color:#d1fae5">CONFIRM PASSWORD</label>
                    <input type="password" id="spc" class="form-input" required autocomplete="new-password">
                </div>
                <button type="submit" class="btn-primary" id="signupBtn">CREATE ACCOUNT</button>
                <div id="signupErr" class="error-box"></div>
                <div id="signupOk" class="success-box"></div>
                <div style="text-align:center;margin-top:1rem;font-size:.875rem;color:#d1fae5">
                    Already have an account? <button type="button" onclick="showScreen('login')" style="background:none;border:none;color:#86efac;text-decoration:underline;cursor:pointer;font-weight:bold">Log In</button>
                </div>
            </form>
        </div>
    </div>`;
}

function renderGame() {
    const s = S;
    const markets = s.unlockedMarkets || [];
    const topMarket = markets[markets.length - 1] || { name: 'Youth Academy', color: 'text-gray-400' };
    const now = Date.now() / 1000;
    const timeUntil = Math.max(0, (s.nextTransferWindow || 0) - (s.serverTime || now));
    const transferReady = timeUntil <= 0 && (s.players || []).length > 0;
    const tiers = s.availableTiers || [];
    const info = s.upgradeInfo || {};

    let html = `
    <!-- User bar -->
    <div class="flex justify-between items-center mb-4 p-4 bg-white/10 backdrop-blur rounded-lg border border-white/20">
        <div class="text-sm text-green-300">&#x1F464; ${esc(currentUser)}</div>
        <div class="flex gap-2">
            <button onclick="doSave()" class="bg-white/10 hover:bg-white/20 border border-white/20 text-white font-bold py-1 px-3 rounded text-sm">&#x1F4BE; Save</button>
            <button onclick="doLogout()" class="bg-white/10 hover:bg-white/20 border border-white/20 text-white font-bold py-1 px-3 rounded text-sm">&#x1F6AA; Logout</button>
        </div>
    </div>

    <!-- Header -->
    <div class="text-center mb-6">
        <h1 class="text-4xl font-bold mb-2">&#9917; Football Agent Empire</h1>
        <p class="text-green-200">Represent players. Negotiate deals. Build your empire!</p>
        <div class="mt-2 text-lg font-bold ${topMarket.color}">${esc(topMarket.name)}</div>
    </div>

    <!-- Notifications -->
    ${(s.notifications || []).length > 0 ? `
        <div class="fixed top-4 right-4 z-50 space-y-2 max-w-sm">
            ${(s.notifications || []).map(n => `
                <div class="bg-${n.type==='success'?'green':'red'}-900/90 backdrop-blur border-2 border-${n.type==='success'?'green':'red'}-400 rounded-lg p-3 shadow-lg">
                    ${esc(n.message)}
                </div>
            `).join('')}
        </div>` : ''}

    <!-- Stats -->
    <div class="grid grid-cols-2 md:grid-cols-5 gap-3 mb-6">
        <div class="bg-white/10 backdrop-blur rounded-lg p-3 border-2 border-green-400">
            <div class="flex items-center gap-2 mb-1">${icons.dollar}<span class="text-xs text-green-200">Balance</span></div>
            <div class="text-xl font-bold">${fmt(s.money||0)}</div>
            <div class="text-xs text-green-300">${fmt(s.earningsPerSecond||0)}/sec</div>
        </div>
        <div class="bg-white/10 backdrop-blur rounded-lg p-3 border-2 border-blue-400">
            <div class="flex items-center gap-2 mb-1">${icons.star}<span class="text-xs text-blue-200">Reputation</span></div>
            <div class="text-xl font-bold">${Math.floor(s.reputation||0)}</div>
        </div>
        <div class="bg-white/10 backdrop-blur rounded-lg p-3 border-2 border-purple-400">
            <div class="flex items-center gap-2 mb-1">${icons.users}<span class="text-xs text-purple-200">Agents</span></div>
            <div class="text-xl font-bold">${s.agents||1}</div>
            <div class="text-xs text-purple-300">Max: ${s.maxAgents||1}</div>
        </div>
        <div class="bg-white/10 backdrop-blur rounded-lg p-3 border-2 border-yellow-400">
            <div class="flex items-center gap-2 mb-1">${icons.award}<span class="text-xs text-yellow-200">Clients</span></div>
            <div class="text-xl font-bold">${(s.players||[]).length}</div>
        </div>
        <div class="bg-white/10 backdrop-blur rounded-lg p-3 border-2 border-orange-400">
            <div class="flex items-center gap-2 mb-1">${icons.handshake}<span class="text-xs text-orange-200">Deals</span></div>
            <div class="text-xl font-bold">${s.transfersCompleted||0}</div>
            <div class="text-xs text-orange-300">${fmt(s.totalCommission||0)}</div>
        </div>
    </div>

    <div class="grid md:grid-cols-3 gap-6">
        <!-- Transfer Window & Actions -->
        <div class="md:col-span-1">
            <div class="bg-gradient-to-br from-purple-900/50 to-pink-900/50 backdrop-blur rounded-lg p-4 mb-4 border-2 ${transferReady ? 'border-green-400 deal-ready' : 'border-purple-400'}">
                <h3 class="text-xl font-bold mb-3 flex items-center gap-2">${icons.handshake} Transfer Market</h3>
                ${transferReady ? `
                    <button onclick="doOpenTransfers()" class="w-full bg-gradient-to-r from-green-500 to-emerald-600 hover:from-green-600 hover:to-emerald-700 text-white font-bold py-4 px-6 rounded-lg transition transform hover:scale-105 shadow-lg">&#x1F4BC; Open Transfer Window</button>
                    <div class="text-xs text-center mt-2 text-green-300">Deals available!</div>
                ` : (s.players||[]).length === 0 ? `
                    <div class="text-center py-4">
                        <div class="text-sm text-gray-300 mb-3">Sign players to unlock transfer deals</div>
                        <button onclick="doScout()" class="bg-blue-500 hover:bg-blue-600 text-white font-bold py-2 px-4 rounded transition">Scout Players</button>
                    </div>
                ` : `
                    <div class="text-center py-4">
                        <div class="text-2xl font-bold text-yellow-300 mb-2">${Math.ceil(timeUntil)}s</div>
                        <div class="text-sm text-gray-300">Until next window opens</div>
                        <div class="text-xs text-gray-400 mt-2">${(s.players||[]).length} clients waiting</div>
                    </div>
                `}
            </div>

            <div class="bg-white/10 backdrop-blur rounded-lg p-4 mb-4 border border-white/20">
                <h2 class="text-xl font-bold mb-3 flex items-center gap-2">${icons.users} Actions</h2>
                <button onclick="doScout()" ${(s.players||[]).length >= (s.maxPlayers||3) ? 'disabled' : ''} class="w-full bg-gradient-to-r from-green-500 to-emerald-600 hover:from-green-600 hover:to-emerald-700 disabled:from-gray-500 disabled:to-gray-600 disabled:cursor-not-allowed text-white font-bold py-3 px-4 rounded-lg mb-2 transition transform hover:scale-105 shadow-lg">
                    &#x1F50D; Scout Players ${(s.players||[]).length >= (s.maxPlayers||3) ? '(Roster Full)' : ''}
                </button>
                <button onclick="doHireAgent()" ${(s.agents||1) >= (s.maxAgents||1) || (s.money||0) < (s.hireAgentCost||10000) ? 'disabled' : ''} class="w-full bg-gradient-to-r from-blue-500 to-blue-600 hover:from-blue-600 hover:to-blue-700 disabled:from-gray-500 disabled:to-gray-600 disabled:cursor-not-allowed text-white font-bold py-2 px-4 rounded-lg mb-3 transition">
                    &#x1F454; Hire Agent (${fmt(s.hireAgentCost||10000)})
                </button>
                <label class="flex items-center gap-2 text-xs cursor-pointer bg-white/5 p-2 rounded">
                    <input type="checkbox" ${s.autoSignEnabled ? 'checked' : ''} onchange="doToggleAutoSign()" class="w-4 h-4">
                    <span>Auto-sign prospects</span>
                </label>
            </div>

            <div class="bg-white/10 backdrop-blur rounded-lg p-4 border border-white/20">
                <h3 class="font-bold mb-2">Unlocked Markets:</h3>
                <div class="space-y-1">
                    ${markets.map(m => `
                        <div class="flex justify-between items-center text-sm">
                            <span class="${m.color}">${esc(m.name)}</span>
                            <span class="text-gray-400">${m.multiplier}x</span>
                        </div>
                    `).join('')}
                </div>
            </div>
        </div>

        <!-- Upgrades -->
        <div class="md:col-span-1">
            <div class="bg-white/10 backdrop-blur rounded-lg p-4 border border-white/20">
                <h2 class="text-xl font-bold mb-3 flex items-center gap-2">${icons.trending} Agency Upgrades</h2>
                <div class="space-y-2">
                    ${Object.entries(info).map(([key, up]) => `
                        <div class="bg-white/5 p-3 rounded-lg border border-white/10">
                            <div class="flex justify-between items-start mb-1">
                                <div class="flex-1">
                                    <div class="font-bold text-sm">${upgradeIcons[key]||''} ${esc(up.name)}</div>
                                    <div class="text-xs text-gray-400 mb-1">${esc(up.description)}</div>
                                    <div class="text-xs text-gray-300">Lv ${(s.upgrades||{})[key]||0} &bull; ${esc(up.effect)}</div>
                                </div>
                                <button onclick="doUpgrade('${key}')" ${(s.money||0) < ((s.upgradeCosts||{})[key]||Infinity) ? 'disabled' : ''} class="bg-yellow-500 hover:bg-yellow-600 disabled:bg-gray-600 disabled:cursor-not-allowed text-white font-bold py-1 px-2 rounded text-xs transition ml-2 whitespace-nowrap">
                                    ${fmt((s.upgradeCosts||{})[key]||0)}
                                </button>
                            </div>
                        </div>
                    `).join('')}
                </div>
            </div>
            <div class="mt-4 bg-white/10 backdrop-blur rounded-lg p-4 border border-white/20">
                <h3 class="font-bold mb-2 text-sm">Available Player Tiers:</h3>
                <div class="flex flex-wrap gap-2">
                    ${tiers.map(t => `<span class="${t.color} px-2 py-1 rounded-full text-xs font-bold">${esc(t.name)}</span>`).join('')}
                </div>
            </div>
        </div>

        <!-- Players -->
        <div class="md:col-span-1">
            <div class="bg-white/10 backdrop-blur rounded-lg p-4 border border-white/20">
                <h2 class="text-xl font-bold mb-3 flex items-center gap-2">
                    ${icons.award} Your Clients
                    <span class="text-sm font-normal ml-auto ${(s.players||[]).length >= (s.maxPlayers||3) ? 'text-red-400' : 'text-gray-400'}">
                        ${(s.players||[]).length}/${s.maxPlayers||3}
                    </span>
                </h2>
                <div class="space-y-2 max-h-[600px] overflow-y-auto">
                    ${(s.players||[]).length === 0 ? `
                        <p class="text-center text-gray-400 py-8 text-sm">No clients yet. Start scouting talent!</p>
                    ` : (s.players||[]).map(p => `
                        <div class="bg-white/5 p-3 rounded-lg border ${p.hasSponsorship ? 'border-yellow-400' : 'border-white/10'}">
                            <div class="flex justify-between items-start mb-2">
                                <div class="flex items-center gap-2">
                                    <div class="w-2 h-2 rounded-full ${p.color}"></div>
                                    <div>
                                        <div class="font-bold text-sm">${esc(p.name)}</div>
                                        <div class="text-xs text-gray-300">${esc(p.tier)}</div>
                                        <div class="text-xs text-blue-300">&#x1F48E; ${fmt(p.value||0)}</div>
                                    </div>
                                </div>
                                ${p.hasSponsorship ? '<div class="text-xs bg-yellow-500 px-2 py-1 rounded">&#x1F4BC; Sponsor</div>' : ''}
                            </div>
                            <div class="flex justify-between items-center text-xs">
                                <div class="text-gray-400">Commission:</div>
                                <div class="font-bold text-green-400">${fmt((p.value||0) * (p.multiplier||1) * (s.commissionMultiplier||1) * (s.agents||1))}/s</div>
                            </div>
                            ${p.hasSponsorship ? `
                                <div class="flex justify-between items-center text-xs mt-1">
                                    <div class="text-gray-400">Sponsorship:</div>
                                    <div class="font-bold text-yellow-400">${fmt(p.sponsorshipValue||0)}/s</div>
                                </div>` : ''}
                            <div class="flex justify-between items-center text-xs mt-1 pt-1 border-t border-white/10">
                                <div class="text-gray-400">Total Earned:</div>
                                <div class="text-gray-300">${fmt(p.earnings||0)}</div>
                            </div>
                            <button onclick="doFire('${p.id}')" class="w-full mt-2 bg-red-600 hover:bg-red-700 text-white text-xs font-bold py-1 px-2 rounded transition">
                                &#x1F525; Fire Client
                            </button>
                        </div>
                    `).join('')}
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <div class="mt-6 bg-white/10 backdrop-blur rounded-lg p-4 border border-white/20">
        <div class="flex justify-between items-center">
            <div class="text-sm text-gray-300">
                Game Progress: ${(s.players||[]).length} Players | ${s.transfersCompleted||0} Deals
            </div>
            <div class="flex gap-2">
                <button onclick="doSave()" class="bg-blue-500 hover:bg-blue-600 text-white font-bold py-2 px-4 rounded text-sm transition">SAVE</button>
                <button onclick="doReset()" class="bg-red-500 hover:bg-red-600 text-white font-bold py-2 px-4 rounded text-sm transition">RESET</button>
            </div>
        </div>
    </div>`;

    document.getElementById('app').innerHTML = html;
}

// ---- Modals (scouting & transfer) ----
function showScoutModal(players) {
    removeModal();
    const overlay = document.createElement('div');
    overlay.id = 'modal';
    overlay.className = 'fixed inset-0 bg-black/70 flex items-center justify-center p-4 z-50';
    overlay.style.backdropFilter = 'blur(4px)';
    overlay.innerHTML = `
        <div class="bg-gradient-to-br from-green-900 to-emerald-900 rounded-lg p-6 max-w-2xl w-full max-h-[80vh] overflow-y-auto border-2 border-green-400">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-2xl font-bold">&#x1F50D; Scout Players</h2>
                <button onclick="removeModal()" class="text-white hover:text-red-400 text-2xl font-bold">&times;</button>
            </div>
            <p class="text-sm text-green-200 mb-4">Approach talented players. Higher reputation = better acceptance rates!</p>
            ${players.length === 0 ? `
                <div class="text-center py-8">
                    <p class="text-gray-400 mb-4">All players declined. Try again!</p>
                    <button onclick="doScout()" class="bg-green-500 hover:bg-green-600 text-white font-bold py-2 px-4 rounded">Scout New Players</button>
                </div>
            ` : `
                <div class="space-y-3">
                    ${players.map(p => `
                        <div class="bg-white/10 p-4 rounded-lg border-2 ${p.demanded ? 'border-red-500/50' : 'border-green-500/50'}">
                            <div class="flex justify-between items-start mb-2">
                                <div class="flex items-center gap-3">
                                    <div class="w-4 h-4 rounded-full ${p.color}"></div>
                                    <div>
                                        <div class="font-bold text-lg">${esc(p.name)}</div>
                                        <div class="text-sm text-gray-300">${esc(p.tier)}</div>
                                    </div>
                                </div>
                                <div class="text-right">
                                    <div class="text-sm text-green-400">${fmt(p.value * p.multiplier)}/s</div>
                                </div>
                            </div>
                            <div class="grid grid-cols-2 gap-2 mb-3 text-sm">
                                <div><span class="text-gray-400">Rep Required:</span> <span class="${(S.reputation||0)>=p.repRequired?'text-green-400':'text-red-400'}">${p.repRequired}</span></div>
                                <div><span class="text-gray-400">Acceptance:</span> <span class="${p.acceptanceChance>=70?'text-green-400':p.acceptanceChance>=40?'text-yellow-400':'text-red-400'}">${p.acceptanceChance}%</span></div>
                            </div>
                            <div class="mb-3"><div class="w-full bg-white/20 rounded-full h-2"><div class="h-2 rounded-full ${p.acceptanceChance>=70?'bg-green-500':p.acceptanceChance>=40?'bg-yellow-500':'bg-red-500'}" style="width:${p.acceptanceChance}%"></div></div></div>
                            <button onclick="doSign('${p.id}')" class="w-full font-bold py-2 px-4 rounded transition ${p.demanded ? 'bg-orange-500 hover:bg-orange-600' : 'bg-green-500 hover:bg-green-600'} text-white">
                                ${p.demanded ? '&#x1F3AF; Try Anyway (Risky!)' : '&#x1F91D; Offer Representation'}
                            </button>
                        </div>
                    `).join('')}
                </div>
            `}
            <div class="mt-4 pt-4 border-t border-white/20">
                <button onclick="doScout()" class="w-full bg-blue-500 hover:bg-blue-600 text-white font-bold py-2 px-4 rounded transition">&#x1F504; Refresh Scouting List</button>
            </div>
        </div>`;
    document.body.appendChild(overlay);
}

function showTransferModal(deals) {
    removeModal();
    const overlay = document.createElement('div');
    overlay.id = 'modal';
    overlay.className = 'fixed inset-0 bg-black/70 flex items-center justify-center p-4 z-50';
    overlay.style.backdropFilter = 'blur(4px)';
    overlay.innerHTML = `
        <div class="bg-gradient-to-br from-purple-900 to-pink-900 rounded-lg p-6 max-w-3xl w-full max-h-[80vh] overflow-y-auto border-2 border-purple-400">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-2xl font-bold">&#x1F4BC; Transfer & Contract Deals</h2>
                <button onclick="removeModal()" class="text-white hover:text-red-400 text-2xl font-bold">&times;</button>
            </div>
            <p class="text-sm text-purple-200 mb-4">Negotiate deals for your clients. Each deal earns you commission!</p>
            ${deals.length === 0 ? `
                <div class="text-center py-8">
                    <p class="text-gray-400 mb-4">No deals available. Wait for the next window!</p>
                    <button onclick="removeModal()" class="bg-purple-500 hover:bg-purple-600 text-white font-bold py-2 px-4 rounded">Close</button>
                </div>
            ` : `
                <div class="space-y-3">
                    ${deals.map(d => `
                        <div class="bg-white/10 p-4 rounded-lg border-2 ${d.type==='transfer'?'border-green-500/50':'border-blue-500/50'}">
                            <div class="flex justify-between items-start mb-3">
                                <div>
                                    <div class="text-xs ${d.type==='transfer'?'text-green-400':'text-blue-400'} font-bold mb-1">${d.type==='transfer'?'&#x1F504; TRANSFER DEAL':'&#x1F4DD; CONTRACT RENEWAL'}</div>
                                    <div class="font-bold text-lg">${esc(d.playerName)}</div>
                                    <div class="text-sm text-gray-300">${esc(d.playerTier)}</div>
                                </div>
                                <div class="text-right">
                                    <div class="text-xs text-gray-400">Your Commission</div>
                                    <div class="text-2xl font-bold text-yellow-400">${fmt(d.commission)}</div>
                                </div>
                            </div>
                            <div class="grid grid-cols-2 gap-3 mb-3 text-sm">
                                <div class="bg-white/5 p-2 rounded"><div class="text-gray-400 text-xs">Club</div><div class="font-bold">${esc(d.club)}</div></div>
                                <div class="bg-white/5 p-2 rounded"><div class="text-gray-400 text-xs">${d.type==='transfer'?'Transfer Fee':'Contract Value'}</div><div class="font-bold text-green-400">${fmt(d.transferFee)}</div></div>
                            </div>
                            <button onclick="doDeal('${d.id}')" class="w-full bg-gradient-to-r ${d.type==='transfer'?'from-green-500 to-emerald-600 hover:from-green-600 hover:to-emerald-700':'from-blue-500 to-blue-600 hover:from-blue-600 hover:to-blue-700'} text-white font-bold py-3 px-4 rounded transition transform hover:scale-105">
                                ${d.type==='transfer'?'&#x2705; Complete Transfer':'&#x2705; Sign Contract'}
                            </button>
                        </div>
                    `).join('')}
                </div>
            `}
        </div>`;
    document.body.appendChild(overlay);
}

function removeModal() {
    const m = document.getElementById('modal');
    if (m) m.remove();
}

function esc(s) {
    if (s == null) return '';
    const d = document.createElement('div');
    d.textContent = String(s);
    return d.innerHTML;
}

// ============================================================
//  ACTIONS – every action calls the server, then re-renders
// ============================================================
async function doLogin(e) {
    e.preventDefault();
    const btn = document.getElementById('loginBtn');
    btn.disabled = true;
    const { status, data } = await api('/api/login', {
        method: 'POST',
        body: { username: document.getElementById('lu').value, password: document.getElementById('lp').value }
    });
    btn.disabled = false;
    if (data.ok) {
        currentUser = data.username;
        csrfToken = data.csrf_token;
        await fetchState();
        currentScreen = 'game';
        render();
        startPoll();
    } else {
        const el = document.getElementById('loginErr');
        el.textContent = data.error || 'Login failed';
        el.style.display = 'block';
    }
}

async function doSignup(e) {
    e.preventDefault();
    const pw = document.getElementById('sp').value;
    const pwc = document.getElementById('spc').value;
    const errEl = document.getElementById('signupErr');
    if (pw !== pwc) {
        errEl.textContent = 'Passwords do not match';
        errEl.style.display = 'block';
        return;
    }
    const btn = document.getElementById('signupBtn');
    btn.disabled = true;
    const { status, data } = await api('/api/register', {
        method: 'POST',
        body: { username: document.getElementById('su').value, password: pw }
    });
    btn.disabled = false;
    if (data.ok) {
        currentUser = data.username;
        csrfToken = data.csrf_token;
        const okEl = document.getElementById('signupOk');
        okEl.textContent = 'Account created! Loading game...';
        okEl.style.display = 'block';
        errEl.style.display = 'none';
        await fetchState();
        currentScreen = 'game';
        render();
        startPoll();
    } else {
        errEl.textContent = data.error || 'Signup failed';
        errEl.style.display = 'block';
    }
}

async function doLogout() {
    stopPoll();
    await api('/api/logout', { method: 'POST' });
    currentUser = null;
    S = {};
    currentScreen = 'login';
    render();
}

async function fetchState() {
    const { data } = await api('/api/state');
    S = data;
}

async function doScout() {
    const { data } = await api('/api/scout', { method: 'POST', body: {} });
    if (data.players) showScoutModal(data.players);
    else if (data.state) { S = data.state; render(); }
}

async function doSign(playerId) {
    const { data } = await api('/api/sign', { method: 'POST', body: { playerId } });
    if (data.state) S = data.state;
    if (data.signed) {
        removeModal();
        render();
    } else {
        // Player declined – refresh the scouted list from state
        if (S.scoutedPlayers && S.scoutedPlayers.length > 0) {
            showScoutModal(S.scoutedPlayers);
        } else {
            showScoutModal([]);
        }
        render();
    }
}

async function doUpgrade(key) {
    const { data } = await api('/api/upgrade', { method: 'POST', body: { upgrade: key } });
    if (data.state) { S = data.state; render(); }
}

async function doHireAgent() {
    const { data } = await api('/api/hire-agent', { method: 'POST', body: {} });
    if (data.state) { S = data.state; render(); }
}

async function doOpenTransfers() {
    const { data } = await api('/api/transfer-window', { method: 'POST', body: {} });
    if (data.deals) showTransferModal(data.deals);
    if (data.state) S = data.state;
}

async function doDeal(dealId) {
    const { data } = await api('/api/complete-deal', { method: 'POST', body: { dealId } });
    if (data.state) S = data.state;
    // Refresh deals
    if ((S.availableDeals || []).length > 0) {
        showTransferModal(S.availableDeals);
    } else {
        removeModal();
    }
    render();
}

async function doToggleAutoSign() {
    await api('/api/toggle-autosign', { method: 'POST', body: {} });
}

async function doFire(playerId) {
    if (!confirm('Are you sure you want to fire this client?')) return;
    const { data } = await api('/api/fire-player', { method: 'POST', body: { playerId } });
    if (data.state) { S = data.state; render(); }
}

async function doSave() {
    await api('/api/save', { method: 'POST', body: {} });
}

async function doReset() {
    if (!confirm('Are you sure you want to reset all progress? This cannot be undone!')) return;
    const { data } = await api('/api/reset', { method: 'POST', body: {} });
    if (data.state) { S = data.state; render(); }
}

function showScreen(name) {
    currentScreen = name;
    render();
}

// ---- Polling: fetch fresh state every 2s while in game ----
function startPoll() {
    stopPoll();
    pollTimer = setInterval(async () => {
        if (currentScreen !== 'game') return;
        await fetchState();
        // Only re-render if no modal is open
        if (!document.getElementById('modal')) render();
    }, 2000);
}

function stopPoll() {
    if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
}

// ---- Boot ----
(async function boot() {
    // Get CSRF token + check if already logged in
    const { data } = await api('/api/me');
    if (data.username) {
        currentUser = data.username;
        csrfToken = data.csrf_token;
        await fetchState();
        currentScreen = 'game';
        startPoll();
    } else {
        csrfToken = data.csrf_token || csrfToken;
        currentScreen = 'login';
    }
    render();
})();
</script>
</body>
</html>
